"],["Légifrance — CASF art. L345-2-2 (accueil inconditionnel)","https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000037670338"]]},{"id":"importer-immatriculer-vehicule","icon":"car","titre":"Importer et immatriculer son véhicule : de la plaque étrangère à la carte grise française","intro":"Une personne arrivée en France avec sa voiture, ou qui en achète une à l'étranger, doit la faire immatriculer en France. Le parcours mêle le fisc (quitus fiscal), parfois l'homologation technique (DREAL), puis la demande de carte grise en ligne (ANTS). En pratique, c'est une succession de guichets indépendants, chacun avec ses propres délais — sans calendrier global garanti. Pendant ce temps, la voiture roule encore sous plaque étrangère, ce qui attire les contrôles de police.","steps":[{"ic":"car","l":"Véhicule immatriculé à l'étranger"},{"ic":"form","l":"Quitus fiscal au service des impôts (SIE)"},{"ic":"decision","l":"Homologation / conformité DREAL si besoin (RTI ou COC)"},{"ic":"form","l":"Demande d'immatriculation sur l'ANTS"},{"w":true,"real":"Quitus fiscal : 1 à 2 semaines<br>RTI DREAL (hors UE) : plusieurs semaines à plusieurs mois<br>Carte grise ANTS : 1 à 5 semaines après dossier complet<br>Total fréquent : plusieurs mois","legal":"Demande à faire dans le mois suivant l'acquisition (C. route art. R322-2). Aucun délai global d'aboutissement opposable pour l'ensemble du parcours import : « Non établi »"},{"ic":"check","l":"Carte grise française délivrée et plaque FR posée"}],"constat":"Le parcours fonctionne quand chaque pièce arrive : quitus fiscal du fisc, certificat de conformité (COC) ou réception à titre isolé (RTI) de la DREAL, puis carte grise de l'ANTS. La loi fixe bien un délai d'un mois pour faire la demande après l'acquisition, mais aucune autorité n'est tenue à un délai global pour finir l'ensemble. Le demandeur dépend de trois administrations distinctes qui ne se coordonnent pas.","probleme":"Pendant ce parcours morcelé, le véhicule reste sous plaque étrangère et continue d'être contrôlé par la police et la gendarmerie, qui ciblent justement ces plaques (suspicion de défaut d'immatriculation, d'assurance ou de contrôle technique). Le demandeur, pourtant de bonne foi et déjà engagé dans ses démarches, s'expose à une amende forfaitaire de 135 € et à une éventuelle immobilisation — sans qu'aucun délai légal global ne le protège tant que les guichets n'ont pas répondu. Le certificat provisoire « WW » (valable 4 mois) existe pour combler ce vide, mais il est mal connu et n'est délivré qu'une fois le dossier ANTS déjà déposé.","chiffres":[["1 mois","délai légal pour déposer la demande après l'acquisition (C. route R322-2)"],["—","aucun délai global légal pour l'aboutissement complet du parcours import"],["135 €","amende forfaitaire encourue en cas de circulation sans immatriculation française dans les délais"]],"propositions":[["Guichet unique import","Faire de l'ANTS un point d'entrée unique qui déclenche en chaîne le quitus fiscal et, si besoin, la saisine DREAL, plutôt que trois démarches séparées à initier soi-même."],["Protection pendant l'instruction","Reconnaître et généraliser un justificatif de démarche en cours (type récépissé ou WW automatique) qui suspend les sanctions tant que les administrations n'ont pas répondu dans un délai raisonnable."],["Délai d'aboutissement opposable","Instaurer un délai cible d'aboutissement global (quitus + homologation + carte grise) avec engagement de l'administration, comblant le « Non établi » actuel."],["Information ciblée des nouveaux arrivants","Diffuser une notice claire (FR + langues des principaux publics, dont l'ukrainien) sur l'ordre des étapes, le quitus gratuit pour l'occasion et le certificat provisoire WW."],["Consignes aux forces de l'ordre","Diffuser une instruction pour que les contrôles tiennent compte d'un justificatif de démarche en cours et privilégient le rappel à la règle plutôt que l'amende immédiate de bonne foi."],["Moyens DREAL pour les RTI","Renforcer les effectifs et budgets des unités véhicules des DREAL, principal goulot d'étranglement pour les véhicules hors UE nécessitant une réception à titre isolé."]],"base":[["Code de la route, art. R322-1","Tout véhicule à moteur doit être muni d'un certificat d'immatriculation (carte grise) pour circuler sur les voies ouvertes à la circulation publique."],["Code de la route, art. R322-2","Le certificat d'immatriculation au nom du nouveau propriétaire doit être demandé dans le mois suivant l'acquisition ; circulation provisoire possible sous couvert d'un certificat provisoire d'immatriculation."],["Code général des impôts (quitus fiscal)","L'immatriculation d'un véhicule acquis dans l'UE est subordonnée à la production d'un certificat fiscal (quitus) attestant la régularité au regard de la TVA, délivré par le service des impôts."],["Code de la route, art. R321-15 (réception)","Avant immatriculation, un véhicule sans réception communautaire valide doit faire l'objet d'une réception (notamment à titre isolé) auprès de la DREAL."]],"chips":["C. route art. R322-1","C. route art. R322-2","C. route art. R321-15","CGI quitus fiscal","RTI / DREAL"],"sources":[["impots.gouv.fr — Obtenir un quitus fiscal (particulier)","https://www.impots.gouv.fr/vous-etes-un-particulier-et-vous-souhaitez-obtenir-un-quitus-fiscal"],["impots.gouv.fr — Immatriculer un véhicule et demander un quitus fiscal (UE)","https://www.impots.gouv.fr/fiche-focus-immatriculer-un-vehicule-et-demander-un-quitus-fiscal-vehicule-acquis-dans-lunion"],["Légifrance — Code de la route, art. R322-2","https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000032401205"],["DRIEAT Île-de-France — FAQ réception de véhicules (RTI / DREAL)","https://www.drieat.ile-de-france.developpement-durable.gouv.fr/faq-reception-de-vehicules-a3246.html"]]},{"id":"echanger-permis-de-conduire","icon":"permis","titre":"Échanger son permis de conduire : protégé en France, mais tributaire d'un accord avec le pays fui","intro":"Une personne protégée qui s'installe durablement en France doit échanger son permis étranger contre un permis français. Mais l'échange n'est possible que s'il existe un accord de réciprocité avec le pays d'origine — celui-là même qu'elle a dû fuir et avec lequel l'OFPRA lui demande de ne plus prendre contact. Sans accord, la demande est refusée, quel que soit le sérieux du dossier.","steps":[{"ic":"ofpraok","l":"Protection subsidiaire ou statut de réfugié accordé"},{"ic":"permis","l":"Permis de conduire du pays d'origine"},{"ic":"form","l":"Demande d'échange (ANTS / CERT) dans le délai d'un an"},{"w":true,"real":"Plusieurs mois d'instruction,<br>puis refus au seul motif<br>de l'absence d'accord","legal":"1 an pour déposer la demande (art. 11-I). Aucun délai opposable à l'administration."},{"ic":"warning","l":"Refus : pas d'accord de réciprocité avec le pays d'origine"},{"ic":"car","l":"Repasser l'intégralité du permis français : mois d'attente et coût élevé"}],"constat":"Un permis délivré par un État hors Union européenne n'est échangeable en France que s'il existe un accord de réciprocité avec cet État (article 5-I-A de l'arrêté du 12 janvier 2012, renvoyant à l'article R. 222-1 du code de la route). L'arrêté prévoit pourtant un régime spécifique pour les personnes protégées : elles sont dispensées de produire une attestation de droits à conduire (article 6-D) et de la condition de validité du titre de séjour (article 11-II), et disposent d'un délai d'un an courant à compter de la remise du récépissé constatant leur statut (article 11-I). Mais <strong>aucune de ces dispositions ne les dispense de la condition de réciprocité</strong>. Résultat : un réfugié ou un bénéficiaire de la protection subsidiaire originaire d'un pays sans accord — l'Ukraine par exemple — voit sa demande refusée pour ce seul motif. Le problème a été signalé au Parlement (question écrite au Sénat n° 03096 du 6 février 2025) : le gouvernement a répondu que le nombre de personnes concernées était « trop faible pour justifier » la négociation d'un accord, laquelle supposerait de surcroît une ratification parlementaire. Aucune voie de régularisation n'est proposée entre-temps.","chiffres":[["—","délai opposable à l'administration pour instruire la demande — et aucune procédure, ni calendrier, pour conclure l'accord dont tout dépend"],["1 an","délai imposé à la personne protégée pour déposer sa demande, à compter du récépissé (art. 11-I de l'arrêté du 12 janvier 2012)"],["≈ 98 %","des Ukrainiens protégés en France relèvent de la protection subsidiaire — précisément le statut qui oblige à échanger le permis sans le permettre"]],"probleme":"L'asymétrie est double. D'abord dans le temps : la personne protégée dispose d'un an, à peine de perdre définitivement son droit à l'échange, tandis qu'aucun délai ne s'impose à l'administration pour instruire, ni à l'État pour négocier l'accord dont dépend l'issue. Ensuite dans la logique même : la protection internationale repose sur la rupture des liens avec le pays d'origine — la décision de l'OFPRA enjoint de ne plus prendre contact avec ses autorités — mais le droit de conduire, lui, reste suspendu à un accord conclu avec ce même pays. Le paradoxe est complet : les bénéficiaires de la protection <em>temporaire</em>, qui n'ont pas leur résidence normale en France (art. R. 222-2 du code de la route), continuent de conduire avec leur permis ukrainien, alors que ceux qui obtiennent la protection <em>subsidiaire</em> — un statut plus stable — perdent ce droit. Dans le même temps, un accord bilatéral toujours en vigueur permet l'échange aux ressortissants russes. Pour les personnes concernées, la conséquence est très concrète : perte du droit de conduire, donc d'un grand nombre d'emplois, et obligation de repasser l'intégralité du permis français, au prix de plusieurs mois et de près de deux mille euros.","propositions":[["Dispenser les personnes protégées de la condition de réciprocité","Compléter l'article 11 de l'arrêté du 12 janvier 2012 pour que la condition de réciprocité de l'article 5-I-A ne soit pas opposable aux réfugiés, bénéficiaires de la protection subsidiaire et apatrides — dans la logique des articles 6-D et 11-II, qui les dispensent déjà d'autres conditions parce que leur situation n'est pas celle d'un étranger ordinaire."],["Reconnaître les permis conformes à la Convention de Vienne","À défaut d'accord bilatéral, admettre l'échange sur la base de la conformité du titre à la Convention de Vienne du 8 novembre 1968 sur la circulation routière, à laquelle la France et de nombreux pays d'origine sont parties, avec vérification documentaire par le CERT."],["Suspendre le délai d'un an pendant l'instruction et les recours","Prévoir que le délai d'un an de l'article 11-I est suspendu tant que l'administration n'a pas statué et pendant l'exercice des recours, afin que la lenteur de l'instruction ne fasse pas perdre le droit lui-même."],["Réexaminer d'office les refus fondés sur la seule réciprocité","Organiser le réexamen des demandes déjà refusées au seul motif de l'absence d'accord, sans nouvelle condition de délai, pour les personnes protégées qui avaient déposé leur demande dans les temps."],["Prévoir un dispositif de substitution, à défaut d'accord","Lorsqu'aucun accord n'existe, ouvrir une voie allégée — vérification des droits à conduire et épreuve pratique de contrôle — plutôt qu'un repassage intégral du permis, dont le coût et le délai sont dissuasifs pour des personnes en début d'installation."],["Donner au CERT les moyens de traiter et publier ses délais","Doter le centre d'expertise et de ressources titres compétent (CERT EPE) d'effectifs à la hauteur du volume de demandes, et publier chaque trimestre les délais moyens d'instruction et le taux de refus par motif."]],"base":[["Arrêté du 12 janvier 2012, art. 5-I-A","L'échange d'un permis délivré par un État n'appartenant ni à l'Union européenne ni à l'EEE suppose qu'il existe un accord de réciprocité entre la France et cet État (renvoi à l'art. R. 222-1 du code de la route). Cette condition n'est assortie d'aucune exception en faveur des bénéficiaires d'une protection internationale."],["Arrêté du 12 janvier 2012, art. 11-I","Pour les réfugiés, les bénéficiaires de la protection subsidiaire et les apatrides, le délai d'un an pour demander l'échange court à compter de la date de remise du récépissé constatant le statut."],["Arrêté du 12 janvier 2012, art. 11-II et art. 6-D","Ces mêmes personnes sont dispensées de la condition de validité du titre de séjour (art. 5-I-B) et de la production de l'attestation de droits à conduire : un régime spécifique existe donc déjà pour elles, mais il ne couvre pas la réciprocité."],["Code de la route, art. R. 222-2","L'obligation d'échanger ne vise que les personnes ayant leur résidence normale en France. Les bénéficiaires de la protection temporaire y échappent et conservent l'usage de leur permis d'origine, à la différence des personnes durablement protégées."]],"chips":["Arrêté du 12 janv. 2012, art. 5-I-A","art. 6-D","art. 11-I et 11-II","C. route art. R222-1, R222-2"],"sources":[["Arrêté du 12 janvier 2012 (reconnaissance et échange des permis hors UE/EEE) — Légifrance","https://www.legifrance.gouv.fr/loda/id/JORFTEXT000025175223"],["Question écrite au Sénat n° 03096 du 6 février 2025 — impossibilité d'échanger un permis ukrainien","https://www.senat.fr/questions/base/2025/qSEQ250203096.html"],["Question à l'Assemblée nationale n° 700 — reconnaissance mutuelle des permis France-Ukraine","https://questions.assemblee-nationale.fr/q17/17-700QE.htm"],["GISTI — L'échange du permis de conduire des étrangers","https://www.gisti.org/spip.php?article5252"]]}]},"comparatif":{"tag":"Réel vs légal","h":"L'écart entre l'attente et la loi","sub":"Pour chaque démarche : le délai réellement constaté, et le délai que la loi impose (ou non) à l'administration.","rows":[["Refaire son état civil (OFPRA)","≈ 9 mois (jusqu'à 1,5 an)","Non établi"],["Titre de voyage","8 à 10 mois","Non établi"],["Titre de séjour","souvent > 3 mois","3 mois"],["Naturalisation","3 à 4 ans","18 mois (12 si 10 ans)"],["Réunification familiale / DCEM","3 à 8 mois (visa) ; 2 à 4 mois (DCEM)","Non établi"],["Ouvrir un compte bancaire","refus et reports fréquents","3 jours ouvrés (banque désignée)"],["Logement social","plusieurs mois à plusieurs années","« délai anormalement long » (arrêté préfectoral)"],["Immatriculer son véhicule","plusieurs mois (parcours morcelé)","1 mois pour déposer ; pas de délai global"],["Échanger son permis de conduire","refus, quel que soit le délai d'attente","1 an pour déposer ; rien pour l'administration"]]},"propositions":{"tag":"Ce que nous proposons","h":"Cinq principes simples","sub":"Le même fil conducteur traverse chaque parcours. Voici ce que ce site défend.","cards":[["I","Un délai opposable","Un délai clair pour chaque étape, avec un point de départ certain qui ne peut être repoussé par l'administration."],["II","Une sanction effective","Un dépassement qui a des conséquences réelles : astreinte, attestation ou titre délivré de plein droit."],["III","La continuité des droits","Aucune rupture entre deux titres ni pendant l'instruction : séjour, travail, ressources et prestations préservés."],["IV","La transparence","Un compteur du délai, un suivi en ligne étape par étape, des délais réels publiés par préfecture."],["V","Une dématérialisation fiable","Une plateforme (ANEF) qui fonctionne, doublée d'un accueil humain pour qui ne peut pas l'utiliser."],["VI","Des moyens à la hauteur","Un délai n'est tenable que si l'administration en a les moyens. Investir dans des recrutements pérennes et un budget pluriannuel, dimensionnés sur le volume réel de demandes — pas seulement créer des obligations."]]},"cadre":{"tag":"Cadre juridique","h":"Sur quoi reposent ces parcours","sub":"Les délais et obligations présentés s'appuient sur les textes suivants. Les délais réels proviennent de sources officielles et de retours de terrain.","items":[["Refaire son état civil (OFPRA)",["CESEDA art. L121-9","R121-35","L561-16","CE 30 janv. 2025, n° 495916 et 495917"]],["Titre de voyage",["CESEDA art. L561-9 à L561-13","L582-7 (apatride)","CGI art. 953-IV","R561-8"]],["Titre de séjour",["CESEDA art. R424-1, R424-7","L424-1 à L424-13","R431-15-1, R431-5","CE 3 juin 2022 n° 452798 ; CE 5 mai 2026 n° 502860"]],["Naturalisation",["Code civil art. 21-25-1","décret n° 93-1362 art. 37-1","CRPA art. L. 231-4","Tribunal administratif de Nantes (SDANF)"]]],"sourcesLabel":"Sources","sources":[["Légifrance — Code civil, CESEDA, CGI","https://www.legifrance.gouv.fr/"],["Conseil d'État — décisions et communiqués","https://www.conseil-etat.fr/"],["Défenseur des droits — rapports sur l'ANEF et la naturalisation","https://www.defenseurdesdroits.fr/"],["OFPRA — données de l'asile et bilan 2024-2025","https://www.ofpra.gouv.fr/"],["service-public.gouv.fr — fiches pratiques","https://www.service-public.gouv.fr/"],["HCR (UNHCR) — tendances mondiales sur les réfugiés","https://www.unhcr.org/fr-fr/tendances-mondiales-0"]]},"cta":{"ha":"Comprendre, c'est déjà agir.","p":"Ce parcours et ces délais concernent des centaines de milliers de personnes. Partagez cette page, parlez-en, et soutenez l'idée simple qui la traverse : des délais clairs, opposables, et des droits sans rupture.","share":"Partager cette page","print":"Imprimer / PDF"},"footer":{"brand":"Délais & Droits","disclaimer":"<strong>Document d'information et de sensibilisation.</strong> Il ne constitue pas un conseil juridique individualisé. Pour une démarche personnelle, rapprochez-vous d'une association spécialisée (La Cimade, France terre d'asile, GISTI, Forum réfugiés) ou d'un avocat en droit des étrangers. Chiffres et textes vérifiés en juin 2026 auprès de sources publiques ; les délais réels sont indicatifs et évoluent.","meta":["Mis à jour · juin 2026","Sources · OFPRA · HCR","· Conseil d'État","· Défenseur des droits","· Légifrance · service-public.gouv.fr"]},"merci":{"tag":"Un mot pour finir","h":"Ceci n'est pas une revendication.","p1":"Ce site n'exprime aucune exigence. Il propose, avec respect, des pistes pour fluidifier des démarches que l'administration elle-même cherche à améliorer.","p2":"Toutes les personnes au nom desquelles ces propositions sont formulées — et que ces parcours concernent directement — tiennent avant tout à exprimer leur profonde gratitude envers la République française. En ouvrant ses portes à celles et ceux qui ont dû fuir la guerre et les persécutions, la France est devenue, pour beaucoup d'entre nous, un nouveau foyer. Nous n'oublions ni cet accueil, ni les femmes et les hommes — agents des préfectures, de l'OFPRA, des associations, bénévoles — qui le rendent possible chaque jour.","p3":"Si nous évoquons les délais, ce n'est pas pour nous plaindre, mais pour contribuer : des démarches plus claires et plus rapides profitent à tout le monde — aux personnes protégées comme à l'administration et à la société française qui nous a accueillis. C'est dans cet esprit de reconnaissance et de coopération que ces propositions sont offertes.","sign":"— Merci."},"labels":{"constat":"Le constat","probleme":"Le problème","propositions":"Nos propositions","propWord":"Proposition","fond":"Cadre juridique","sources":"Sources"}}
</script>

<script type="application/json" id="SITE-ru">
{"meta":{"title":"Беженцы во Франции: путь и сроки","desc":"Понять, шаг за шагом, административный путь лиц, получивших защиту во Франции."},"ui":{"brand":"Сроки и права","nav":[["chiffres","Цифры"],["parcours","Путь"],["comparatif","Реальность и закон"],["propositions","Наши предложения"],["cadre","Правовая база"]],"ctaPrimary":"Посмотреть путь","ctaSecondary":"Печать / PDF","share":"Поделиться","print":"Печать / PDF","linkCopied":"Ссылка скопирована ✓","realLabel":"Реальный срок","lawLabel":"Срок, установленный законом","notSet":"Законом не установлен"},"hero":{"eyebrow":"Понять путь лиц, получивших защиту","h1a":"Защита предоставлена.","h1b":"А затем — ожидание.","lead":"Когда человек получает убежище во Франции, его административный путь только начинается. Этот сайт показывает, шаг за шагом, что должны пройти беженцы и лица, получившие дополнительную защиту, — и разрыв между реально наблюдаемым сроком и сроком, установленным законом.","note":"Данные проверены в июне 2026 года — OFPRA, Conseil d'État, Защитник прав (Défenseur des droits), УВКБ ООН (HCR), Légifrance — дополнены сведениями с мест."},"stats":{"tag":"Цифры","h":"Франция и беженцы — вкратце","sub":"Несколько ориентиров, чтобы представить реальность, часто плохо известную широкой публике.","cards":[["≈ 663 000","человек под защитой OFPRA","на конец 2024 года — беженцы, дополнительная защита, апатриды"],["153 596","заявлений об убежище, зарегистрированных в 2024 году","рекордный уровень (+7,7 % за год)"],["54 430","предоставленных защит в 2024 году","то есть ≈ 39 % решений OFPRA"],["3-я","страна приёма в Европейском союзе","по числу беженцев — но 21-я в пересчёте на население"]],"context":{"h":"Реальность, часто плохо известная","p":"В мировом масштабе примерно трое беженцев из четырёх принимаются странами с низким или средним уровнем дохода, чаще всего соседними с зонами конфликтов. Из почти 43 миллионов беженцев в мире Франция принимает лишь скромную часть. А после предоставления защиты начинается другой путь: путь формальностей и ожидания."}},"parcours":{"tag":"Путь, шаг за шагом","h":"Каждая ситуация — шаг за шагом","sub":"Для каждой ситуации: этапы, которые нужно пройти, реально наблюдаемый срок (⏱ оранжевым) и срок, который закон устанавливает для администрации (⚖ синим — или «не установлен», когда закон его не задаёт).","items":[{"id":"p-etatcivil","icon":"acte","titre":"Восстановить гражданское состояние после положительного решения","intro":"Лицо, получившее защиту, больше не может обращаться к властям страны происхождения. Именно OFPRA должно восстановить его гражданское состояние — а без этих актов почти ничего невозможно.","steps":[{"ic":"ofpraok","l":"Положительное решение OFPRA или CNDA"},{"ic":"actebarre","l":"Акты страны происхождения больше не пригодны к использованию"},{"ic":"form","l":"Заявление о восстановлении, направленное в OFPRA"},{"w":true,"real":"≈ 9 месяцев<br>(от 8 месяцев до 1,5 года)","legal":""},{"ic":"acte","l":"Выданные акты гражданского состояния (имеют силу подлинных документов)"},{"ic":"unlock","l":"Постоянный титул, брак, банк… наконец становятся возможными"}],"constat":"Лицо под защитой больше не может обращаться к властям страны своего происхождения. Именно OFPRA через своё подразделение по защите <strong>устанавливает, восстанавливает и ведёт его акты гражданского состояния</strong> и выдаёт документы, заменяющие акты (свидетельство о рождении, о браке, семейную книжку), — документы, имеющие силу подлинных актов. Сроки сильно выросли: со 141 дня в 2017 году до 240 дней в 2021 году, затем количество дел превысило 31 500 в конце 2022 года. С конца 2023 года ситуация улучшилась, но средний срок составлял 11,7 месяца в 2023 году, 10,8 месяца в 2024 году и 9,1 месяца в 2025 году, при этом в конце 2024 года ещё 59 860 дел ожидали рассмотрения. <strong>На OFPRA законом не возлагается никакого срока</strong> для выполнения этой задачи.","probleme":"Пока OFPRA не оформит акты, лицо под защитой живёт в серой зоне: <strong>префектура не может выдать окончательный вид на жительство, пока ей не передан акт гражданского состояния</strong>; к этому добавляются открытие полноценного банковского счёта, подписание договора аренды, брак, семейная книжка, некоторые пособия. Государственный совет (30 января 2025 года) счёл, что подтверждения о продлении рассмотрения и статуса достаточно для осуществления основной части прав; на практике это подтверждение часто остаётся малоизвестным или плохо принимаемым в окошках обслуживания (банки, работодатели, арендодатели, CAF, France Travail, мэрии), и беженец не располагает ни обязательным сроком, ни действенным способом обращения.","propositions":[["Закрепить обязательный законный срок в 4 месяца","Дополнить статью L121-9 CESEDA максимальным сроком в <strong>четыре месяца</strong> (шесть месяцев для дел, требующих дополнительного расследования или легализации иностранных актов) между полным заявлением и выдачей акта OFPRA — чёткой эталонной нормой, сегодня отсутствующей."],["Сопроводить превышение срока неустойкой и простым способом обращения","Предусмотреть декретом обращение к судье за предписанием о выдаче под неустойку (ст. L911-1 и след. CJA); создать заранее цифровую жалобу в OFPRA с подтверждением о получении и ответом в течение 15 дней, а также процедуру срочного рассмотрения по мотивированным основаниям (брак, рождение, воссоединение семьи, трудоустройство)."],["Усилить ресурсы и завершить цифровизацию","Закрепить и увеличить штат офицеров по защите, занимающихся актами гражданского состояния; повсеместно ввести подачу и отслеживание онлайн с защищённой цифровой выдачей (акт с электронной подписью, поддающийся проверке); ежеквартально публиковать открытые показатели (количество дел, средний срок, срок на уровне 9-го дециля)."],["Гарантировать полную обязательность подтверждения","Привязать к ст. L561-16 CESEDA текст, напоминающий, что подтверждение о продлении рассмотрения и расписка служат подтверждением проживания и права на работу, и издать межведомственную инструкцию, обязательную для банков (через ACPR), арендодателей, работодателей, CAF и France Travail, запрещающую им требовать окончательный акт, когда представлено подтверждение."],["Признать доказательственную силу временных документов","Уточнить в CESEDA и циркуляром (для офицеров гражданского состояния, префектур), что временные документы и административное удостоверение, выдаваемые OFPRA в ожидании окончательного акта, имеют достаточную доказательственную силу для начала процедур гражданской жизни, — чтобы ожидание больше не парализовало осуществление прав."],["Дать OFPRA ресурсы для ликвидации очереди","Сделать постоянным и увеличить число офицеров защиты, занятых актами гражданского состояния, и профинансировать план ликвидации очереди (почти 60 000 дел в ожидании), чтобы достичь обязательного целевого срока."]],"base":[["Статья L121-9 CESEDA","OFPRA уполномочено выдавать беженцам, лицам, пользующимся дополнительной защитой, и апатридам документы, необходимые для актов гражданской жизни, в частности документы, заменяющие акты гражданского состояния. Его генеральный директор удостоверяет эти акты, которые имеют силу подлинных актов и восполняют отсутствие актов, выданных в стране происхождения. Текст не устанавливает никакого срока оформления."],["Статья R121-35 CESEDA","Уточняет условия оформления и выдачи актов Управлением и подтверждает их силу подлинных актов, при этом Управление может исправлять только пропуски и чисто технические ошибки. И здесь не предусмотрено никакого срока, обязательного для OFPRA."],["Статья L561-16 CESEDA","В ожидании окончательного установления своих актов гражданского состояния OFPRA лицо под защитой может ходатайствовать о предоставлении прав, открытых кодексами труда, социального обеспечения, социальной помощи и помощи семьям, а также строительства и жилья, на основе состава семьи, учтённого при рассмотрении ходатайства о предоставлении убежища."],["Conseil d'État, 2e-7e ch. réunies, 30 janvier 2025, nos 495916 et 495917","Рассмотрев иски, поданные, с одной стороны, GISTI и ADDE, а с другой — La Cimade, GAS, JRS France и LDH, об оспаривании подразумеваемого отказа принять меры по сокращению сроков OFPRA, Государственный совет отклонил требования. Он отметил, что сроки начали снижаться с последнего квартала 2023 года, будучи доведены до менее чем десяти месяцев, и что статус лица под защитой в сочетании с подтверждением о продлении рассмотрения и правами, открытыми ст. L561-16, позволял осуществлять основную часть прав, связанных со статусом."]],"chiffres":[["59 860","дел по актам гражданского состояния в ожидании рассмотрения в OFPRA на 31 декабря 2024 года (количество дел превышало 31 500 в конце 2022 года)"],["9,1 месяца","средний срок оформления актов в 2025 году (275 дней), против 10,8 месяца в 2024 году и 11,7 месяца в 2023 году"],["—","законный срок, сегодня обязательный для OFPRA по оформлению актов гражданского состояния"]],"sources":[["Article L121-9 du CESEDA — Légifrance","https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000042777575"],["Article L561-16 du CESEDA — Légifrance","https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000042775752"],["CE, 30 janvier 2025, n° 495916 (délais d'état civil OFPRA) — Légifrance","https://www.legifrance.gouv.fr/ceta/id/CETATEXT000051105650"],["Conseil d'État — Décision n° 495916 du 30 janvier 2025","https://www.conseil-etat.fr/fr/arianeweb/CE/decision/2025-01-30/495916"],["OFPRA — Bilan 2025 : une activité record et des évolutions contrastées","https://www.ofpra.gouv.fr/actualites/bilan-2025-de-lofpra-une-activite-record-et-des-evolutions-contrastees"],["La Cimade — Rapport d'activité OFPRA 2024","https://www.lacimade.org/rapport-dactivite-ofpra-2024-cartographie-de-la-demande-dasile/"]],"chips":["L121-9 CESEDA","R121-35","L561-16","CE 30 janv. 2025, 495916"]},{"id":"p-voyage","icon":"passport","titre":"Путешествовать за пределы Франции (туризм, командировка, семья)","intro":"Для рабочей поездки, туристического путешествия или визита к близким лицо, получившее защиту, не может использовать паспорт страны происхождения.","steps":[{"ic":"plane","l":"Планы поездки (туризм, командировка, семья)"},{"ic":"passportno","l":"Паспорт страны происхождения непригоден"},{"ic":"form","l":"Заявление на проездной документ (TIV / TVR) через ANEF"},{"w":true,"real":"от 8 до 10 месяцев<br>по сообщениям","legal":""},{"ic":"passport","l":"Проездной документ выдан"},{"ic":"planeok","l":"Поездка становится возможной"}],"constat":"<strong>Проездной документ для беженца</strong> (TVR), <strong>удостоверение личности и проездной документ</strong> (TIV), выдаваемое лицам, пользующимся дополнительной защитой, и проездной документ для апатрида — это защищённые биометрические документы, заменяющие национальный паспорт, который эти лица не могут запросить у страны своего происхождения. Заявление подаётся исключительно в цифровом виде, через ANEF. В отличие от срока действия и пошлины, установленных законом, <strong>ни один акт не устанавливает законного срока изготовления или выдачи</strong>. На практике префектуры рекомендуют подавать не менее чем за три месяца до отъезда и объявляют сроки порядка 30–60 дней, без гарантии и без приоритетной обработки; реальные сроки иногда значительно больше, при отсутствии организованной процедуры срочной выдачи.","probleme":"Без обязательного срока лицо под защитой не имеет никакой гарантии относительно даты, когда оно реально сможет отправиться в путь: навестить близких в третьей стране, деловая поездка, медицинская необходимость, смерть близкого человека. <strong>Отсутствие процедуры срочной выдачи делает невозможным учёт неотложных ситуаций.</strong> Рекомендация подавать «не менее чем за три месяца до» возлагает на человека неопределённость, которую он не контролирует, при том что он по определению не может получить паспорт страны своего происхождения, — лишая действенности право, признанное законом.","propositions":[["Закрепить нормативный срок выдачи в CESEDA","Дополнить нормативную часть CESEDA (вокруг ст. R561-8) максимальным обязательным сроком изготовления и выдачи документа, установленным в <strong>два месяца</strong> с момента полного заявления, согласованным с практикой обычного паспорта. При отсутствии решения предусмотреть обязательный контактный пункт в префектуре и ускоренное обжалование."],["Создать процедуру срочной выдачи по неотложным основаниям","Ввести путь срочной выдачи в течение 5–10 рабочих дней при обоснованном неотложном основании (тяжёлая медицинская причина, смерть или болезнь близкого, неотложное семейное основание, профессиональное обязательство с указанием даты), с перечнем подтверждающих документов и приоритетным окном — по модели срочной выдачи, существующей для паспорта и удостоверения личности (CNI)."],["Гарантировать отслеживание онлайн и публикуемые сроки","Сделать обязательным в ANEF поэтапное отслеживание (подача, рассмотрение, изготовление, выдача) с отметкой времени и ежеквартальную публикацию по каждой префектуре реальных средних сроков выдачи — чтобы сделать администрацию подотчётной и позволить управлять отклонениями."],["Сопроводить превышение срока действенными гарантиями","В случае превышения срока по вине администрации предусмотреть неустойку по праву в обеспечительном порядке перед административным судьёй и возможность выдачи временного проездного документа, позволяющего совершить уже запланированную поездку, — по образцу временных документов, существующих в сфере проживания."],["Снизить или отменить пошлину для наименее обеспеченных","Изменить пункт IV статьи 953 Налогового кодекса (CGI), чтобы освободить от гербового сбора (45 € или 40 €) лиц, пользующихся защитой, без средств или получателей минимальных социальных пособий, либо ввести сниженный тариф, чтобы стоимость не была дополнительным препятствием для осуществления основного права."],["Обеспечить службу изготовления достаточными ресурсами","Выделить службе, отвечающей за проездные документы, персонал и биометрическое оборудование, соразмерные спросу, чтобы сократить изготовление до нескольких недель."]],"base":[["Статья L561-9 CESEDA — проездной документ для беженца","Иностранец, имеющий действующий вид на жительство и признанный беженцем, может получить «проездной документ для беженца», дающий ему право выезжать за пределы Франции, за исключением неотложных оснований национальной безопасности или общественного порядка, кроме государства или государств, в отношении которых опасения преследования признаны обоснованными. Никакого срока изготовления или выдачи не установлено."],["Статья L561-10 CESEDA — удостоверение личности и проездной документ","Лицо, пользующееся дополнительной защитой, может получить «удостоверение личности и проездной документ», за исключением неотложных оснований национальной безопасности или общественного порядка. Он не позволяет отправиться в государство или государства, где заинтересованное лицо подверглось бы серьёзным посягательствам, упомянутым в ст. L512-1. Никакого срока изготовления или выдачи не установлено."],["Статьи L561-11, L561-12 и L561-13 CESEDA","Несовершеннолетнему ребёнку лица под защитой может быть выдан проездной документ, предусмотренный ст. L561-10 (L561-11). Срок действия документов, выдаваемых на основании ст. L561-9 — L561-11, установлен в пункте IV статьи 953 CGI (L561-12); никакого срока обработки в нём не предусмотрено. Документ может быть изъят или в его продлении может быть отказано по неотложным основаниям национальной безопасности или общественного порядка (L561-13)."],["Статья L582-7 CESEDA — проездной документ для апатрида","Иностранец, признанный апатридом и имеющий действующий вид на жительство, может получить «проездной документ для апатрида», за исключением неотложных оснований национальной безопасности или общественного порядка, при этом срок его действия также отнесён к пункту IV статьи 953 CGI. Никакого срока изготовления или выдачи не установлено."],["Статья 953, IV, Налогового кодекса (Code général des impôts)","Устанавливает срок действия и пошлину: документ, выдаваемый беженцам, апатридам или лицам, пользующимся дополнительной защитой, имеющим карту резидента, — действителен 5 лет, пошлина 45 €; документ, выдаваемый апатридам или лицам, пользующимся дополнительной защитой, имеющим многолетнюю карту на 4 года, — действителен 4 года, пошлина 40 €; удостоверение личности и проездной документ, выдаваемое иностранцу, не пользующемуся защитой (например, ребёнку), — действителен 1 год, пошлина 15 €. Ни одно положение не устанавливает срока выдачи."],["Статья R561-8 CESEDA","Уточняет документы, которые необходимо представить (вид на жительство, две фотографии установленного образца, подтверждение места жительства или декларация о месте жительства). Текст устанавливает условия подачи, но не устанавливает ни срока рассмотрения, ни срока выдачи документа."]],"chiffres":[["663 241","человек под защитой OFPRA на конец 2024 года (беженцы, апатриды, дополнительная защита) — затрагиваемое население"],["—","установленный законом срок изготовления или выдачи проездного документа: ни один акт его не регламентирует"],["3 месяца","минимальный срок, лишь рекомендуемый префектурами для подачи до поездки, без гарантии соблюдения"]],"sources":[["CESEDA — Section 4 : Documents de voyage (L561-9 à L561-13) — Légifrance","https://www.legifrance.gouv.fr/codes/section_lc/LEGITEXT000006070158/LEGISCTA000042772564/"],["CESEDA — Apatridie, dont L582-7 — Légifrance","https://www.legifrance.gouv.fr/codes/section_lc/LEGITEXT000006070158/LEGISCTA000042772666/"],["CGI, article 953 (validité et taxe des titres de voyage) — Légifrance","https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000041466881"],["Réfugié : titre de séjour, document de voyage et accompagnement — service-public.gouv.fr","https://www.service-public.gouv.fr/particuliers/vosdroits/F15401"],["Demander un titre de voyage (dépôt ANEF, recommandation 3 mois) — Préfecture de la Gironde","https://www.gironde.gouv.fr/Demarches/Immigration-et-integration/Demander-un-document-de-voyage-delivre-par-la-France/Refugie-Protege-subsidiaire/Demander-un-titre-de-voyage-pour-etranger-beneficiaire-de-la-protection-internationale"],["Dématérialisation via l'ANEF : des ruptures de droits graves et massives — Défenseur des droits","https://www.defenseurdesdroits.fr/dematerialisation-des-demandes-de-titres-de-sejour-lanef-des-ruptures-de-droits-graves-et-massives"]],"chips":["L561-9 (TVR)","L561-10 (TIV)","L561-12","L582-7 (apatride)","CGI art. 953-IV","R561-8"]},{"id":"p-sejour","icon":"carte","titre":"Получить вид на жительство после предоставления защиты","intro":"Сразу после решения OFPRA или CNDA префектура должна выдать вид на жительство. В промежутке пособие часто прекращается.","steps":[{"ic":"ofpraok","l":"Положительное решение (OFPRA / CNDA)"},{"ic":"pauseada","l":"Пособие (ADA) прекращается — риск периода без средств к существованию"},{"w":true,"real":"часто > 3 месяцев<br>(иногда 7 месяцев и более)","legal":"3 месяца"},{"ic":"carte","l":"Карта пребывания или резидента выдана"}],"constat":"После того как защита предоставлена OFPRA или CNDA, у префекта есть нормативный срок в <strong>три месяца</strong> для выдачи вида на жительство. Беженцы имеют право на десятилетнюю карту резидента; лица, пользующиеся дополнительной защитой, сначала получают многолетнюю карту сроком максимум на четыре года, а затем, после четырёх лет законного проживания, — десятилетнюю карту резидента. На практике этот срок очень часто превышается, <strong>при этом никакой санкции к нему не привязано</strong>. При продлении обработка через цифровую платформу ANEF порождает перерывы в правах, задокументированные Защитником прав (Défenseur des droits), Государственным советом (Conseil d'État) и общественными организациями.","probleme":"Срок в три месяца лишён принудительной силы: его превышение не влечёт для администрации никакой санкции. При продлении прохождение через ANEF, ставший общим каналом, вызывает перерывы в правах — истечение срока документа без подтверждения о продлении, потеря работы, жилья и пособий. <strong>Право на подачу заявления и на получение подтверждения, охватывающего весь объём прав (проживание, работа, пособия), действенным образом не гарантировано.</strong>","propositions":[["Сделать трёхмесячный срок обязательным и наказуемым","Дополнить статьи R. 424-1 и R. 424-7 CESEDA: при невыдаче в течение трёх месяцев по праву выдаётся подтверждение, приравниваемое к виду на жительство (дающее право на работу и пособия), с автоматической неустойкой в пользу заинтересованного лица в случае необоснованного превышения срока (по модели обеспечительной процедуры полезных мер, ст. L. 521-3 CJA)."],["Автоматически выдавать подтверждение, охватывающее все права","Изменить статью R. 431-15-1 CESEDA так, чтобы подтверждение о продлении рассмотрения автоматически формировалось платформой ANEF сразу после подачи полного дела, прямо упоминало право на проживание, работу и пособия и автоматически продлевалось — в соответствии с предписанием Государственного совета от 5 мая 2026 года (№ 502860)."],["Автоматически продлевать срок действия документа на время рассмотрения","Предусмотреть декретом, что документ лица под защитой, подавшего заявление о продлении в установленные сроки, остаётся действительным до прямого решения префектуры, без условия об окне подачи и без дополнительных действий — устраняя любой пробел между истечением срока документа и подтверждением."],["Гарантировать право на подачу и доступ к записи на приём","Сделать действующим альтернативное решение (декрет № 2023-191 от 22 марта 2023 года): личный приём в течение 30 дней при невозможности использовать ANEF, отслеживаемость попыток с отметкой времени, облегчённый доступ к судье по обеспечительной процедуре полезных мер (в русле CE, 18 февраля 2022 года, № 455740)."],["Сделать ANEF надёжной и публиковать показатели","Исполнить предписания Государственного совета (№ 502860): одновременная подача по разным основаниям, исправление дел, прекращение отказов, ошибочно основанных на невозврате прежнего документа. Публиковать по каждой префектуре средний срок и долю соблюдения трёхмесячного срока, при наличии наблюдательного комитета."],["Усилить отделы по делам иностранцев в префектурах","Сделать постоянным и расширить объявленный план в 500 сотрудников: нанять штатных работников в отделы «séjour» префектур с многолетним финансированием, чтобы разгрузить очереди и соблюдать трёхмесячный срок."]],"base":[["Статья R424-1 CESEDA","Префект производит выдачу карты резидента (ст. L. 424-1 или L. 424-3) в срок три месяца с момента решения о признании статуса беженца OFPRA или CNDA. Этот срок не сопровождается никакой санкцией в случае превышения."],["Статья R424-7 CESEDA","Префект производит выдачу многолетней карты на проживание (ст. L. 424-9 или L. 424-11) в срок три месяца с момента решения о предоставлении дополнительной защиты. Как и для беженцев, этот срок не сопровождается никакой санкцией."],["Статьи L424-1, L424-4, L424-9, L424-13 CESEDA","Беженец получает десятилетнюю карту резидента (L. 424-1); L. 424-4 отсылает к декрету определение срока выдачи (конкретизированного в R. 424-1). Лицо, пользующееся дополнительной защитой, получает многолетнюю карту сроком максимум на четыре года (L. 424-9), а затем, после четырёх лет законного и непрерывного проживания, — десятилетнюю карту резидента (L. 424-13), при условии, в частности, отсутствия угрозы общественному порядку."],["Статьи R431-15-1 и R431-5 CESEDA","Подача через электронную службу влечёт выдачу подтверждения о подаче, которое не удостоверяет законность проживания. Когда рассмотрение полного заявления затягивается за пределы истечения срока документа, префект предоставляет подтверждение о продлении рассмотрения (API), действительное максимум три месяца и продлеваемое (R. 431-15-1). Заявление о продлении должно подаваться в период между 120-м и 60-м днём до истечения срока (R. 431-5); вне этого окна сохранение прав не гарантируется."],["CE, Section, 3 juin 2022, n° 452798","Государственный совет отменяет декрет, делающий обязательным использование ANEF, в той части, в которой он не предусматривает альтернативного решения: администрация должна предусмотреть сопровождение и нецифровой путь, когда пользователь оказывается не в состоянии использовать электронную службу."],["CE, 5 mai 2026, n° 502860","Государственный совет предписывает государству устранить сбои в работе ANEF: в течение шести месяцев обеспечить своевременное предоставление или продление подтверждений о продлении рассмотрения и указывать в них связанные с ними права (в частности, право на работу), сделать возможным дополнение дел, прекратить отказы, ошибочно основанные на невозврате прежнего документа; в течение двенадцати месяцев сделать возможной одновременную подачу заявлений по разным основаниям."]],"chiffres":[["3 месяца","Нормативный срок выдачи после решения OFPRA/CNDA (ст. R. 424-1 и R. 424-7 CESEDA), без действенной санкции"],["28 %","Доля обращений 2023 года в Défenseur des droits, относящихся к праву иностранцев; более 75 % из них касаются префектур"],["6–12 месяцев","Сроки, отведённые государству Государственным советом (5 мая 2026 года, № 502860) для устранения сбоев в работе ANEF"]],"sources":[["CESEDA — Section 1 : Réfugiés (R424-1 et s.) — Légifrance","https://www.legifrance.gouv.fr/codes/section_lc/LEGITEXT000006070158/LEGISCTA000042801156/"],["CESEDA — Section 2 : Protection subsidiaire (R424-7 et s.) — Légifrance","https://www.legifrance.gouv.fr/codes/section_lc/LEGITEXT000006070158/LEGISCTA000042801170/"],["CESEDA — Titres de séjour des bénéficiaires d'une protection (L424-1 et s.) — Légifrance","https://www.legifrance.gouv.fr/codes/section_lc/LEGITEXT000006070158/LEGISCTA000042771756/"],["Décret n° 2023-191 du 22 mars 2023 — Légifrance","https://www.legifrance.gouv.fr/jorf/id/JORFTEXT000047332636"],["CE, Section, 3 juin 2022, n° 452798 — Légifrance","https://www.legifrance.gouv.fr/ceta/id/CETATEXT000045863484"],["Défenseur des droits — Rapport sur l'ANEF (11 décembre 2024)","https://www.defenseurdesdroits.fr/atteintes-aux-droits-des-etrangers-le-defenseur-des-droits-publie-un-rapport-sur-ladministration"],["Conseil d'État — Accès normal à la plateforme ANEF (5 mai 2026, n° 502860)","https://www.conseil-etat.fr/actualites/services-publics-le-conseil-d-etat-enjoint-a-l-etat-de-garantir-un-acces-normal-a-la-plateforme-en-ligne-de-l-anef"]],"chips":["R424-1 CESEDA","R424-7","L424-1 / L424-13","R431-15-1","CE 452798","CE 502860"]},{"id":"p-naturalisation","icon":"flagfr","titre":"Стать французом: натурализация","intro":"Спустя несколько лет лицо, получившее защиту, может подать заявление на получение французского гражданства. Закон устанавливает срок… но его точку отсчёта можно откладывать бесконечно.","steps":[{"ic":"form","l":"Подача полного досье через ANEF"},{"ic":"recepisse","l":"Расписка о полноте досье — она (теоретически) запускает отсчёт срока"},{"w":true,"real":"от 3 до 4 лет<br>(часто)","legal":"18 месяцев"},{"ic":"decision","l":"Решение — молчание администрации означает отказ"},{"ic":"flagfr","l":"Натурализация"}],"constat":"Статья 21-25-1 Гражданского кодекса (Code civil) обязывает государственный орган ответить на заявление о натурализации в срок <strong>восемнадцать месяцев</strong> (двенадцать месяцев для иностранца, обычно проживающего во Франции не менее десяти лет), который может быть продлён только один раз на три месяца мотивированным решением. Но этот срок исчисляется лишь с момента передачи всех документов полного дела, «при которой расписка выдаётся немедленно». Между тем статья 37-1 декрета № 93-1362 предусматривает, что эта расписка выдаётся «при передаче документов», <strong>не сопровождая эту обязанность ни числовым сроком, ни санкцией</strong>. На практике выдача расписки откладывается или вовсе не производится — что Защитница прав (Défenseure des droits) квалифицировала как сбой в работе государственной службы (решение № 2024-025 от 19 февраля 2024 года). В 2024 году французское гражданство приобрели 103 661 человек, из них 48 494 — путём натурализации.","probleme":"Установленный законом срок почти всегда обходится с помощью простого механизма: пока не выдана расписка о полноте дела, отсчёт восемнадцати месяцев не начинается. Заявитель остаётся в ожидании без юридического предела. Когда срок в конце концов истекает, молчание администрации означает <strong>подразумеваемый отказ</strong> — а не согласие: бездействие государства оборачивается против человека. Единственное реальное средство правовой защиты — обращение к министру (RAPO), а затем в административный трибунал города Нанта (Tribunal administratif de Nantes) для понуждения вынести решение — добавляет несколько месяцев, а то и лет, и стоит услуг адвоката.","propositions":[["Запускать отсчёт срока с момента подачи полного дела на ANEF","Изменить статью 21-25-1 Гражданского кодекса так, чтобы срок в 18 месяцев (12 месяцев) исчислялся с момента онлайн-подачи полного дела, при этом подтверждение регистрации с отметкой времени приравнивалось бы к расписке о полноте дела. В качестве альтернативы — установить для выдачи расписки короткий и обязательный срок (например, 30 дней) в статье 37-1 декрета № 93-1362."],["Сделать превышение срока действительно наказуемым","По истечении несоблюдённого срока разрешить обращение к судье по обеспечительным мерам за предписанием вынести решение, сопровождаемым неустойкой (например, 100 € за каждый день просрочки) за счёт государства. Изучить возможность смягчения условий приемлемости жалобы в случае длительного бездействия."],["Обязать к прямому и мотивированному решению","Регламентировать подразумеваемый отказ: по любому полному заявлению должно выноситься прямое и мотивированное решение в установленный законом срок. Заявление, по которому не было вынесено уведомлённое решение, считалось бы приемлемым, без ущерба для проверки условий по существу, — устраняя порочный эффект молчания, означающего отказ."],["Создать ускоренную процедуру только для споров о сроках","Учредить в административном трибунале города Нанта особую ускоренную процедуру (единоличный судья, в течение нескольких месяцев), ограниченную спорами о превышении сроков и невыдаче расписки, отдельную от рассмотрения по существу."],["Сделать срок прозрачным и отслеживаемым онлайн","Отображать в личном кабинете ANEF дату полноты дела, применимый установленный законом срок, счётчик оставшегося времени и стадию рассмотрения; ежеквартально публиковать реальные сроки и количество дел в SDANF, а также усиливать кадровый состав пропорционально числу поданных заявлений."],["Дать SDANF ресурсы, чтобы соблюдать срок","Срок имеет смысл, только если у администрации есть возможность его соблюсти. Принять многолетний план найма сотрудников в подотдел доступа к французскому гражданству (SDANF) с отдельным финансированием, рассчитанным на реальное число дел, — чтобы ликвидировать очередь, а не только сделать срок обязательным."]],"base":[["Статья 21-25-1 Гражданского кодекса (Code civil)","«Ответ государственного органа на заявление о приобретении французского гражданства путём натурализации должен последовать не позднее чем через восемнадцать месяцев с момента передачи всех документов, необходимых для формирования полного дела, при которой расписка выдаётся немедленно». Этот срок сокращается до двенадцати месяцев для иностранца, подтверждающего обычное проживание во Франции не менее десяти лет, и может быть продлён только один раз, мотивированным решением, на три месяца. Точкой отсчёта является передача документов (расписка о полноте дела), а не дата подачи."],["Статья 37-1 декрета № 93-1362 от 30 декабря 1993 года","В действующей редакции (декрет № 2024-108 от 14 февраля 2024 года, применяемый к заявлениям, поданным с 1 января 2026 года) она гласит: «При передаче предусмотренных выше документов орган, в который было подано заявление, выдаёт расписку, предусмотренную статьёй 21-25-1 Гражданского кодекса». Однако ни одно положение не устанавливает для этой выдачи максимального числового и обязательного срока, что позволяет фактически откладывать точку отсчёта установленного законом срока рассмотрения."],["Молчание, означающее отказ — ст. L. 231-4 CRPA","В отступление от принципа «молчание означает согласие» (ст. L. 231-1 Кодекса отношений между обществом и администрацией, CRPA) молчание по заявлению о натурализации декретом означает подразумеваемое решение об отказе. Аналогично молчание министра в течение четырёх месяцев по обязательной предварительной административной жалобе (RAPO) означает отказ."],["Подсудность и средства обжалования","Неблагоприятное решение сначала должно быть обжаловано путём RAPO министру, отвечающему за натурализацию (срок: 2 месяца); его отказ затем может быть оспорен в административном трибунале города Нанта, единственно компетентном на национальном уровне по спорам, относящимся к Подуправлению по доступу к французскому гражданству (SDANF), в срок 2 месяца. Судья может понудить вынести решение, при необходимости под неустойку."]],"chiffres":[["18 месяцев","Установленный законом максимальный срок ответа (12 месяцев при 10 годах проживания) — ст. 21-25-1 C. civ."],["3–4 года","Реальная продолжительность, часто фиксируемая, поскольку точка отсчёта срока откладывается (Défenseur des droits, 2022)"],["48 494","Натурализаций в 2024 году из 103 661 случая приобретения гражданства (+6,6 % за год)"]],"sources":[["Article 21-25-1 du Code civil — Légifrance","https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000006419662"],["Article 37-1 du décret n° 93-1362 — Légifrance","https://www.legifrance.gouv.fr/loda/article_lc/LEGIARTI000051906775"],["Décision du Défenseur des droits n° 2024-025 du 19 février 2024","https://juridique.defenseurdesdroits.fr/index.php?lvl=notice_display&id=49828"],["Naturalisation par décret : délais et recours — service-public.gouv.fr","https://www.service-public.gouv.fr/particuliers/vosdroits/F2213"],["Intégration et accès à la nationalité — chiffres 2024 (ministère de l'Intérieur)","https://www.immigration.interieur.gouv.fr/fr/Info-ressources/Etudes-et-statistiques/Les-chiffres-de-l-immigration-en-France/Integration-et-l-acces-a-la-nationalite-francaise"],["Rapport du Défenseur des droits, « Devenir français par naturalisation » (2022)","https://www.defenseurdesdroits.fr/fr/rapports/2022/02/rapport-devenir-francais-par-naturalisation-recommandations-visant-a-faire"]],"chips":["Art. 21-25-1 C. civ.","Art. 37-1 décret 93-1362","Art. L. 231-4 CRPA","TA de Nantes"]},{"id":"reunification-familiale-dcem","icon":"family","titre":"Привезти детей и обеспечить им свободу передвижения: воссоединение семьи и документ на проезд (DCEM)","intro":"Лицо, признанное беженцем или получившее дополнительную защиту, имеет право привезти семью, оставшуюся за границей (воссоединение семьи), без условий о доходах, жилье или сроке проживания. После приезда семьи во Францию несовершеннолетнему ребёнку-иностранцу необходим документ на проезд (DCEM), чтобы выезжать за пределы Франции и возвращаться без визы. На бумаге эти права ясны. На практике же всё часто застревает в одном и том же месте: акты гражданского состояния. Консульства и префектуры требуют свежие свидетельства о рождении (иногда «не старше 3 месяцев»), которые защищённое лицо по определению не может запросить у властей страны, из которой оно бежало. Тогда оно оказывается в зависимости от восстановления своего гражданского состояния силами OFPRA, реальные сроки которого исчисляются месяцами, при этом администрации не противопоставлен никакой установленный законом срок.","steps":[{"ic":"ofpraok","l":"Защита предоставлена (статус OFPRA/CNDA)"},{"ic":"form","l":"Заявление о воссоединении семьи (виза в консульстве) или о DCEM (префектура, онлайн через ANEF)"},{"ic":"acte","l":"OFPRA восстанавливает гражданское состояние и удостоверяет состав семьи"},{"ic":"warning","l":"Препятствие: требуется «свежее» свидетельство о рождении, которое невозможно получить из страны происхождения"},{"w":true,"real":"Воссоединение семьи: виза часто выдаётся за 3–8 месяцев,<br>дольше, когда гражданское состояние ещё не установлено (восстановление OFPRA ~6–12 месяцев).<br>DCEM: на практике 2–4 месяца в префектуре.","legal":"DCEM: «Не установлен» (нет противопоставимого срока выдачи).<br>Воссоединение: CESEDA не устанавливает никакого срока."},{"ic":"check","l":"Документ выдан / семья воссоединена"}],"constat":"Право щедрое, но доступ к нему перекрыт административным узким местом: гражданским состоянием. Воссоединение семьи беженцев не зависит ни от доходов, ни от жилья (CESEDA ст. L561-2), а DCEM выдаётся ребёнку по праву. Но консульства, мэрии и префектуры требуют свежие акты гражданского состояния, которые защищённое лицо не может получить из своей страны происхождения, не подвергая себя опасности и не лишая саму свою защиту смысла. Поэтому оно полностью зависит от восстановления своего гражданского состояния силами OFPRA, сроки которого за пять лет удвоились (177 дней в 2019 году, 240 дней в 2021 году), достигая местами целого года. Всё это время администрации не противопоставлен никакой установленный законом срок: молчание администрации не влечёт никакой действенной санкции, и семьи остаются разлучёнными месяцами.","probleme":"Требование свидетельства о рождении «не старше 3 месяцев» на практике невыполнимо для защищённого лица: оно не может обратиться к властям страны, из которой бежало, а его французское гражданское состояние зависит от восстановления силами OFPRA с долгими и неурегулированными сроками. Результат — замкнутая блокировка: префектура или консульство ждёт документ, который может выдать только OFPRA, OFPRA тратит несколько месяцев, и никакой противопоставимый законом срок не позволяет разблокировать ситуацию. Дети остаются разлучёнными с одним из родителей или не могут ни путешествовать, ни навещать семью из-за отсутствия DCEM.","chiffres":[["—","Противопоставимый законом срок выдачи DCEM"],["~6–12 месяцев","Реальное восстановление гражданского состояния силами OFPRA"],["2 месяца","Срок, по истечении которого молчание означает отказ (DCEM)"]],"propositions":[["Запретить требование «свежих» актов от защищённых лиц","Распространить национальную инструкцию, напоминающую, что акты, составленные OFPRA, имеют силу подлинных документов и что от защищённого лица нельзя требовать никакой свежести («не старше 3 месяцев»)."],["Установить противопоставимый срок для восстановления силами OFPRA","Закрепить максимальный нормативный срок обработки гражданского состояния, сопровождаемый временной справкой, противопоставимой префектурам и консульствам в этот промежуток."],["Усилить ресурсы отдела гражданского состояния OFPRA","Увеличить штат и выделяемый бюджет, чтобы рассосать накопившийся объём и сократить сроки до менее чем 3 месяцев, поскольку число защищённых лиц сильно возросло."],["Признать временную справку достаточным документом","Разрешить по праву рассмотрение заявления о визе для воссоединения или о DCEM на основании временной справки о составе семьи, не дожидаясь окончательного акта."],["Понятная информация и сопровождение","Разместить на service-public.gouv.fr и в префектурах единую памятку, разъясняющую цепочку OFPRA → консульство → префектура и способы обжалования."],["Облегчить и прояснить обжалование","Систематически напоминать, в случае отказа в визе, об обязанности обратиться в Комиссию по обжалованию отказов в визах (CRRV) в течение 30 дней до обращения в административный суд Нанта."]],"base":[["CESEDA, ст. L561-2","К беженцу или получателю дополнительной защиты может присоединиться его супруг/партнёр и дети, без условий о сроке проживания, доходах или жилье (за исключением угрозы общественному порядку)."],["CESEDA, ст. R561-1 — R561-3","Заявление о визе для членов семьи подаётся в консульский орган, который запрашивает у OFPRA удостоверение состава семьи и гражданского состояния беженца."],["CESEDA, ст. D414-1 — D414-4","Документ на проезд для несовершеннолетнего иностранца (DCEM) выдаётся префектом по заявлению лица, осуществляющего родительские права, на максимальный срок 5 лет."],["CESEDA, ст. L121-13 / L561-2","Акты гражданского состояния, составленные OFPRA для защищённых лиц, имеют силу подлинных документов."]],"chips":["CESEDA art. L561-2","CESEDA art. R561-1","CESEDA art. R561-3","CESEDA art. D414-1","CESEDA art. D414-4"],"sources":[["Légifrance — CESEDA, воссоединение семьи (ст. L561-2 — L561-5)","https://www.legifrance.gouv.fr/codes/section_lc/LEGITEXT000006070158/LEGISCTA000042772546/"],["Légifrance — CESEDA, проездные документы для несовершеннолетних иностранцев (ст. D414-1 — D414-4)","https://www.legifrance.gouv.fr/codes/section_lc/LEGITEXT000006070158/LEGISCTA000042800892/"],["OFPRA — восстановление актов гражданского состояния","https://www.ofpra.gouv.fr/en/folder/institutions/civil-status-reconstitution"],["Sénat — сроки восстановления и выдачи актов гражданского состояния (воссоединение семьи)","https://www.senat.fr/questions/base/2022/qSEQ220700483.html"]]},{"id":"droit-au-compte","icon":"bank","titre":"Открыть банковский счёт: право на счёт","intro":"Иметь депозитный счёт необходимо, чтобы получать пособие, зарплату, платить за аренду или оформить подписку. Тем не менее из-за отсутствия постоянного трудового договора, документа, подтверждающего стабильное место жительства, или банковской истории во Франции многим защищённым лицам (в том числе получателям временной защиты, прибывшим из Украины) банки отказывают в открытии счёта. Французское право предусматривает ответ на эту ситуацию: «право на счёт». Любое лицо, проживающее во Франции, которому отказано в счёте, может обратиться в Banque de France, который тогда в обязательном порядке назначает учреждение, обязанное открыть счёт, бесплатно, с базовыми банковскими услугами. Этот маршрут описывает процедуру, её теоретические сроки и расхождения, наблюдаемые на практике.","steps":[{"ic":"euro","l":"Потребность в депозитном счёте"},{"ic":"warning","l":"Отказ или ограничение со стороны банка (нет бессрочного договора / места жительства)"},{"ic":"form","l":"Обращение в Banque de France в порядке права на счёт"},{"ic":"bank","l":"Назначение учреждения в обязательном порядке"},{"w":true,"real":"Переменно: назначение часто происходит быстро, но фактическое открытие нередко откладывается — запросы дополнительных документов, перенесённые встречи.<br>Регулярно сообщается о сроках ожидания в несколько недель.","legal":"1 рабочий день на назначение, затем 3 рабочих дня на открытие счёта назначенным банком (с момента получения документов)"},{"ic":"check","l":"Счёт открыт с бесплатными базовыми банковскими услугами"}],"constat":"Закон ясен и защищает: после обращения в Banque de France открытие счёта становится не любезностью, а обязанностью назначенного банка, в короткие сроки (1 рабочий день на назначение, 3 рабочих дня на открытие). На бумаге ни одно лицо, проживающее во Франции, не должно оставаться без счёта.","probleme":"На деле же путь остаётся полным препятствий. Многие люди вообще не знают о существовании права на счёт; отделения иногда отсылают к процедуре, не разъясняя её. На этапе фактического открытия наблюдаются повторные запросы подтверждающих документов (места жительства, личности), перенесённые встречи и счета, открытые по минимуму, иногда закрытые вскоре после этого. Базовые банковские услуги, без овердрафта и обычной чековой книжки, не всегда позволяют вести нормальную экономическую жизнь (арендодатель или работодатель может отнестись настороженно). Языковой барьер и административная сложность усугубляют разрыв между установленным законом сроком в 3 рабочих дня и сроком, переживаемым на практике.","chiffres":[["1 день","рабочий — на назначение банка со стороны Banque de France"],["3 дня","рабочих — на открытие счёта назначенным банком"],["12","бесплатных базовых банковских услуг гарантировано"]],"propositions":[["Систематическое информирование о праве на счёт","Выдавать при любом отказе в открытии письменную многоязычную памятку, разъясняющую обращение в Banque de France, и сделать это рефлексом в отделениях."],["Специальное сопровождение защищённых лиц","Привлекать социальных работников (уже уполномоченных обращаться в Banque de France) и ассоциации для формирования дел и отслеживания сроков вплоть до фактического открытия."],["Обеспечить соблюдение срока в 3 рабочих дня","Внедрить отслеживание переносов и простой механизм сигнализации (Banque de France, ACPR, Защитник прав), когда назначенный банк задерживает сверх установленного законом срока."],["Прояснить, какие документы можно требовать","Распространить типовой список допустимых подтверждающих документов (вид на жительство / временная защита, справка о домициляции), чтобы избежать необоснованных запросов документов."],["Усилить ресурсы приёма","Нанимать и обучать многоязычных сотрудников и медиаторов в Banque de France и в сетях помощи, а также финансировать структуры домициляции, чтобы справляться с потоками и сокращать реальные сроки."],["Расширить полезность базовых услуг","Поощрять банки предлагать сверх минимальных услуг реально пригодные платёжные решения для жилья и трудоустройства."]],"base":[["CMF ст. L312-1, I","Любое физическое или юридическое лицо, проживающее во Франции, имеет право на открытие депозитного счёта в кредитном учреждении по своему выбору."],["CMF ст. L312-1, II","В случае отказа лицо может обратиться в Banque de France, который назначает кредитное учреждение в срок один рабочий день с момента получения необходимых документов."],["CMF ст. L312-1, III","Назначенное учреждение обязано открыть счёт в срок три рабочих дня с момента получения всех документов."],["CMF ст. D312-5","Назначенное учреждение бесплатно обеспечивает базовые банковские услуги (двенадцать услуг, предусмотренных декретом)."]],"chips":["CMF art. L312-1","CMF art. D312-5","Charte d'accessibilité bancaire"],"sources":[["Banque de France — как реализовать право на счёт","https://www.banque-france.fr/fr/a-votre-service/particuliers/faire-valoir-droit-au-compte-bancaire"],["Légifrance — Валютно-финансовый кодекс, статья L312-1","https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000044605348/"],["economie.gouv.fr — процедура права на счёт (DAC)","https://www.economie.gouv.fr/particuliers/gerer-mon-argent/gerer-mon-budget-et-mon-epargne/comment-utiliser-la-procedure-de-droit-au-compte-dac-pour-ouvrir-un-compte-bancaire"],["ABE Infoservice — право на счёт","https://www.abe-infoservice.fr/fr/banque/droit-au-compte"]]},{"id":"se-loger-logement-social","icon":"house","titre":"Найти жильё: социальное жильё и выход из временного размещения","intro":"После получения защиты многие беженцы живут в экстренном размещении или во временном жилье. Чтобы получить постоянное жильё, основной путь — это заявление на социальное жильё, регистрируемое под «единым номером». Но предложение намного меньше спроса: ожидание нередко исчисляется месяцами, а то и годами, тогда как место во временном размещении может быть поставлено под вопрос. Этот маршрут описывает этапы, реальные наблюдаемые сроки и права, которые защищают человека во время ожидания, в частности противопоставимое право на жильё (DALO).","steps":[{"ic":"house","l":"Потребность в жилье / окончание экстренного размещения"},{"ic":"form","l":"Заявление на социальное жильё (единый номер)"},{"ic":"recepisse","l":"Справка о регистрации (в течение месяца)"},{"w":true,"real":"От нескольких месяцев до нескольких лет<br>в зависимости от территории и состава семьи","legal":"«Ненормально долгий срок», установленный постановлением префекта, различается по департаментам (например, 24 месяца, 36 месяцев)"},{"ic":"warning","l":"Риск необходимости покинуть размещение до предоставления нового жилья"},{"ic":"check","l":"Предложение жилья (или обращение по DALO)"}],"constat":"Заявление на социальное жильё опирается на ясный и противопоставимый механизм: регистрация, единый номер, справка в течение месяца и право на обжалование (DALO), если ожидание превышает «ненормально долгий срок». На бумаге сохранение в экстренном размещении гарантировано до тех пор, пока не предложено подходящее решение.","probleme":"На практике разрыв между предложением и спросом на социальное жильё делает ожидание очень долгим, без универсального законного предела. «Ненормально долгий срок» различается от департамента к департаменту и открывает лишь право на обжалование, а не немедленное жильё. Главное же — напряжённость с местами во временном размещении приводит к прекращению попечения, когда человеку ещё не предоставлено новое жильё: принцип непрерывности размещения (CASF ст. L345-2-3) ослаблен из-за нехватки мест, что фактически грозит выселением на улицу.","chiffres":[["1 месяц","установленный законом срок получения справки с единым номером (CCH ст. L441-2-1)"],["3 месяца","срок предоставления жилья после благоприятного решения DALO (6 месяцев в заморских территориях и крупных агломерациях)"],["—","нет гарантированного национального срока предоставления социального жилья"]],"propositions":[["Обеспечить сохранение в размещении","Реально гарантировать принцип непрерывности (CASF ст. L345-2-3): никакого прекращения попечения без предложения подходящего решения и без выселения на улицу."],["Информирование сразу при предоставлении защиты","Сопровождать каждое защищённое лицо при подаче заявления на социальное жильё и получении единого номера без промедления, на понятном ему языке."],["Лучше информировать о DALO","Систематически информировать о досудебном обращении в комиссию по медиации, как только достигнут ненормально долгий срок, а также о судебном обжаловании."],["Гармонизировать «ненормально долгие сроки»","Сократить расхождения между департаментами и чётко публиковать постановление префекта, применимое к каждой территории."],["Усилить ресурсы: предложение и сопровождение","Увеличить квоту мобилизуемого жилья (квота префектуры, Action Logement) и финансировать социальных работников и ассоциации сопровождения к жилью и в жилье."],["Связать размещение и переселение","Облегчить переход от размещения к жилью (арендное посредничество, переходящий договор аренды), чтобы избежать разрывов в маршруте."]],"base":[["CCH ст. L441-2-1","Любое заявление на социальное жильё регистрируется и получает единый национальный номер; справка выдаётся в течение месяца; никакого предоставления без регистрации и единого номера."],["CCH ст. L300-1 (закон № 2007-290 от 5 марта 2007 г.)","Право на достойное и независимое жильё гарантируется государством каждому лицу, законно проживающему и не способному получить его или сохранить за собой собственными силами (DALO)."],["CCH ст. L441-2-3","Комиссия по медиации может быть без промедления вызвана заявителем, не получившим подходящего предложения по истечении ненормально долгого срока, установленного префектом; затем префект обязан предоставить жильё лицу, признанному приоритетным."],["CASF ст. L345-2-3","Любое лицо, принятое в экстренное размещение, должно иметь возможность оставаться там, пока оно того желает, до направления к подходящему решению (принцип непрерывности)."]],"chips":["CCH art. L441-2-1","CCH art. L300-1","CCH art. L441-2-3","Loi n° 2007-290 du 5 mars 2007","CASF art. L345-2-3","CASF art. L345-2-2"],"sources":[["Légifrance — CCH ст. L441-2-1 (единый номер)","https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000033971871"],["Légifrance — Закон № 2007-290 от 5 марта 2007 г. (DALO)","https://www.legifrance.gouv.fr/loda/id/JORFTEXT000000271094"],["ANIL — право на жильё, обеспеченное судебной защитой (DALO): условия и сроки","https://www.anil.org/votre-projet/vous-etes-locataire/locataire-en-difficulte/droit-au-logement-et-a-lhebergement-opposable/"],["Légifrance — CASF ст. L345-2-2 (безусловный приём)","https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000037670338"]]},{"id":"importer-immatriculer-vehicule","icon":"car","titre":"Ввезти и зарегистрировать свой автомобиль: от иностранного номера к французскому техпаспорту","intro":"Лицо, прибывшее во Францию на своей машине или купившее её за границей, должно зарегистрировать её во Франции. Маршрут сочетает налоговую (налоговый квитус), иногда техническую омологацию (DREAL), а затем подачу заявления на техпаспорт онлайн (ANTS). На практике это череда независимых окошек, у каждого свои сроки — без гарантированного общего графика. Всё это время машина ещё ездит на иностранных номерах, что привлекает полицейские проверки.","steps":[{"ic":"car","l":"Автомобиль зарегистрирован за границей"},{"ic":"form","l":"Налоговый квитус в налоговой службе (SIE)"},{"ic":"decision","l":"Омологация / соответствие DREAL при необходимости (RTI или COC)"},{"ic":"form","l":"Заявление на регистрацию через ANTS"},{"w":true,"real":"Налоговый квитус: 1–2 недели<br>RTI DREAL (вне ЕС): от нескольких недель до нескольких месяцев<br>Техпаспорт ANTS: 1–5 недель после полного комплекта документов<br>Частый итог: несколько месяцев","legal":"Заявление подаётся в течение месяца после приобретения (Дорожный кодекс ст. R322-2). Никакого противопоставимого общего срока завершения всего маршрута ввоза: «Не установлен»"},{"ic":"check","l":"Французский техпаспорт выдан и номера FR установлены"}],"constat":"Маршрут работает, когда каждый документ поступает: налоговый квитус от налоговой, сертификат соответствия (COC) или индивидуальная приёмка (RTI) от DREAL, а затем техпаспорт от ANTS. Закон действительно устанавливает срок в один месяц для подачи заявления после приобретения, но ни один орган не обязан соблюдать общий срок завершения всего процесса. Заявитель зависит от трёх отдельных администраций, которые не координируются между собой.","probleme":"В течение этого раздробленного маршрута автомобиль остаётся на иностранных номерах и продолжает подвергаться проверкам полиции и жандармерии, которые как раз нацеливаются на такие номера (подозрение в отсутствии регистрации, страховки или техосмотра). Заявитель, при том что он действует добросовестно и уже начал свои процедуры, рискует получить фиксированный штраф в 135 € и возможную иммобилизацию — без какого-либо общего законного срока, который защищал бы его, пока окошки не ответили. Временный сертификат «WW» (действителен 4 месяца) существует, чтобы заполнить этот пробел, но он малоизвестен и выдаётся только после того, как дело в ANTS уже подано.","chiffres":[["1 месяц","установленный законом срок подачи заявления после приобретения (Дорожный кодекс R322-2)"],["—","нет общего законного срока полного завершения маршрута ввоза"],["135 €","фиксированный штраф, грозящий за движение без французской регистрации в установленные сроки"]],"propositions":[["Единое окно для ввоза","Сделать ANTS единой точкой входа, которая по цепочке запускает налоговый квитус и, при необходимости, обращение в DREAL, вместо трёх отдельных процедур, которые надо начинать самому."],["Защита на время рассмотрения","Признать и распространить подтверждение начатой процедуры (типа расписки или автоматического WW), которое приостанавливает санкции, пока администрации не ответили в разумный срок."],["Противопоставимый срок завершения","Установить целевой срок общего завершения (квитус + омологация + техпаспорт) с обязательством администрации, заполняющий нынешнее «Не установлено»."],["Целевое информирование вновь прибывших","Распространять понятную памятку (на французском + языках основных групп, в том числе на украинском) о порядке этапов, бесплатном по такому случаю квитусе и временном сертификате WW."],["Указания силам правопорядка","Распространить инструкцию, чтобы при проверках учитывалось подтверждение начатой процедуры и предпочтение отдавалось напоминанию о правилах, а не немедленному штрафу для добросовестных лиц."],["Ресурсы DREAL для RTI","Усилить штат и бюджеты подразделений по транспортным средствам в DREAL — главное узкое место для автомобилей вне ЕС, требующих индивидуальной приёмки."]],"base":[["Дорожный кодекс, ст. R322-1","Любое моторное транспортное средство должно быть снабжено свидетельством о регистрации (техпаспортом) для движения по дорогам, открытым для общественного пользования."],["Дорожный кодекс, ст. R322-2","Свидетельство о регистрации на имя нового владельца должно быть запрошено в течение месяца после приобретения; временное движение возможно при наличии временного свидетельства о регистрации."],["Общий налоговый кодекс (налоговый квитус)","Регистрация транспортного средства, приобретённого в ЕС, обусловлена представлением налогового сертификата (квитуса), подтверждающего правомерность в отношении НДС, выдаваемого налоговой службой."],["Дорожный кодекс, ст. R321-15 (приёмка)","Перед регистрацией транспортное средство без действующей общеевропейской приёмки должно пройти приёмку (в частности, индивидуальную) в DREAL."]],"chips":["C. route art. R322-1","C. route art. R322-2","C. route art. R321-15","CGI quitus fiscal","RTI / DREAL"],"sources":[["impots.gouv.fr — получение налогового квитуса (физлицо)","https://www.impots.gouv.fr/vous-etes-un-particulier-et-vous-souhaitez-obtenir-un-quitus-fiscal"],["impots.gouv.fr — регистрация автомобиля и запрос налогового квитуса (ЕС)","https://www.impots.gouv.fr/fiche-focus-immatriculer-un-vehicule-et-demander-un-quitus-fiscal-vehicule-acquis-dans-lunion"],["Légifrance — Дорожный кодекс, ст. R322-2","https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000032401205"],["DRIEAT Île-de-France — FAQ по приёмке (омологации) транспортных средств (RTI / DREAL)","https://www.drieat.ile-de-france.developpement-durable.gouv.fr/faq-reception-de-vehicules-a3246.html"]]},{"id":"echanger-permis-de-conduire","icon":"permis","titre":"Обмен водительского удостоверения: защита во Франции есть, но всё зависит от соглашения со страной, откуда пришлось бежать","intro":"Человек под защитой, который надолго остаётся во Франции, обязан обменять иностранные права на французские. Но обмен возможен только при наличии соглашения о взаимности со страной происхождения — той самой, откуда он был вынужден бежать и с властями которой OFPRA предписывает не контактировать. Без соглашения заявление отклоняют, каким бы безупречным ни было досье.","steps":[{"ic":"ofpraok","l":"Предоставлена дополнительная защита или статус беженца"},{"ic":"permis","l":"Водительское удостоверение страны происхождения"},{"ic":"form","l":"Заявление на обмен (ANTS / CERT) в течение одного года"},{"w":true,"real":"Несколько месяцев рассмотрения,<br>затем отказ — единственная причина:<br>отсутствие соглашения","legal":"1 год на подачу заявления (ст. 11-I). Для администрации обязательного срока нет."},{"ic":"warning","l":"Отказ: нет соглашения о взаимности со страной происхождения"},{"ic":"car","l":"Сдавать французские права заново: месяцы ожидания и высокая стоимость"}],"constat":"Права, выданные государством за пределами Евросоюза, можно обменять во Франции только при наличии соглашения о взаимности с этим государством (статья 5-I-A приказа от 12 января 2012 года, отсылающая к статье R. 222-1 Дорожного кодекса). При этом приказ предусматривает особый режим для лиц под защитой: они освобождены от предоставления справки о наличии права управления (статья 6-D) и от условия действительности вида на жительство (статья 11-II), а годичный срок для них исчисляется с даты выдачи расписки, подтверждающей статус (статья 11-I). Однако <strong>ни одна из этих норм не освобождает их от условия взаимности</strong>. В результате беженец или получатель дополнительной защиты из страны без соглашения — например, из Украины — получает отказ исключительно по этому основанию. Проблема поднималась в парламенте (письменный вопрос в Сенат № 03096 от 6 февраля 2025 года): правительство ответило, что число затронутых лиц «слишком мало, чтобы оправдать» переговоры о соглашении, которое к тому же потребовало бы парламентской ратификации. Никакого промежуточного механизма урегулирования не предложено.","chiffres":[["—","обязательный для администрации срок рассмотрения заявления — как и процедура или график заключения соглашения, от которого всё зависит"],["1 год","срок, отведённый лицу под защитой на подачу заявления, считая с даты расписки (ст. 11-I приказа от 12 января 2012 года)"
