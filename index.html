{"meta":{"title":"Refugees in France: the process and the timelines","desc":"Understanding, step by step, the administrative process for protected persons in France."},"ui":{"brand":"Deadlines & Rights","nav":[["chiffres","The figures"],["parcours","The process"],["comparatif","Actual vs legal"],["propositions","Our proposals"],["cadre","Legal framework"]],"ctaPrimary":"See the process","ctaSecondary":"Print / PDF","share":"Share","print":"Print / PDF","linkCopied":"Link copied ✓","realLabel":"Actual time","lawLabel":"Time set by law","notSet":"Not set by law"},"hero":{"eyebrow":"Understanding the process for protected persons","h1a":"Protection granted.","h1b":"Then the wait.","lead":"When someone is granted asylum in France, their administrative journey is only just beginning. This website shows, step by step, what refugees and beneficiaries of subsidiary protection have to accomplish — and the gap between the time actually observed and the time set by law.","note":"Data verified in June 2026 — OFPRA, Conseil d'État, Défenseur des droits, UNHCR, Légifrance — supplemented by field feedback."},"stats":{"tag":"The figures","h":"France and refugees, in brief","sub":"A few benchmarks to put into perspective a reality that is often poorly understood by the general public.","cards":[["≈ 663,000","people under OFPRA protection","end of 2024 — refugees, subsidiary protection, stateless persons"],["153,596","asylum applications registered in 2024","record level (+7.7% in one year)"],["54,430","protections granted in 2024","i.e. ≈ 39% of OFPRA decisions"],["3rd","host country in the European Union","by number of refugees — but 21st relative to population"]],"context":{"h":"A reality that is often poorly understood","p":"Worldwide, around three out of four refugees are hosted by low- or middle-income countries, most often neighbours of conflict zones. Out of nearly 43 million refugees worldwide, France hosts only a modest share. And once protection is granted, another journey begins: that of the procedures and the wait."}},"parcours":{"tag":"The process, step by step","h":"Each situation, step by step","sub":"For each situation: the steps to be taken, the time actually observed (⏱ in orange) and the time the law requires of the administration (⚖ in blue — or « not set » when the law sets none).","items":[{"id":"p-etatcivil","icon":"acte","titre":"Reconstituting civil status after a favourable decision","intro":"A protected person can no longer turn to the authorities of their country of origin. It is OFPRA that must reconstitute their civil status — and without these documents, almost nothing is possible.","steps":[{"ic":"ofpraok","l":"Favourable decision by OFPRA or the CNDA"},{"ic":"actebarre","l":"Documents from the country of origin can no longer be used"},{"ic":"form","l":"Reconstitution request submitted to OFPRA"},{"w":true,"real":"≈ 9 months<br>(from 8 months to a year and a half)","legal":""},{"ic":"acte","l":"Civil status documents issued (with the force of authentic records)"},{"ic":"unlock","l":"Permanent permit, marriage, bank account… finally possible"}],"constat":"A protected person can no longer turn to the authorities of their country of origin. It is the OFPRA which, through its protection division, <strong>establishes, reconstitutes and maintains their civil status</strong> and issues the documents serving as records (birth certificate, marriage certificate, family record book) — documents which have the value of authentic instruments. Deadlines have risen sharply: from 141 days in 2017 to 240 days in 2021, then a backlog exceeding 31,500 applications at the end of 2022. The situation has improved since the end of 2023, but the average deadline remained 11.7 months in 2023, 10.8 months in 2024 and 9.1 months in 2025, with still 59,860 files pending at the end of 2024. <strong>No deadline is legally enforceable against the OFPRA</strong> to carry out this task.","probleme":"As long as the OFPRA has not established the records, the beneficiary lives in a grey zone: <strong>the prefecture cannot issue the final residence permit as long as the civil status record has not been communicated to it</strong>; to this are added the opening of a full-service bank account, the signing of a lease, marriage, the family record book, certain benefits. The Conseil d'État (30 January 2025) held that the certificate of extension of processing and the status were sufficient to exercise most rights; in practice, this certificate often remains poorly known or poorly accepted at counters (banks, employers, landlords, CAF, France Travail, town halls), and the refugee has no enforceable deadline or effective channel of petition.","propositions":[["Enter an enforceable legal deadline of 4 months","Supplement Article L121-9 of the CESEDA with a maximum deadline of <strong>four months</strong> (six months for files requiring a supplementary investigation or the legalisation of foreign records) between the complete application and the issuance of the record by the OFPRA — a clear reference standard, currently non-existent."],["Attach to the exceedance a penalty payment and a simple channel of petition","Provide by decree for petitioning the judge for an order to issue subject to a penalty payment (art. L911-1 et seq. CJA); create upstream a digital complaint to the OFPRA, with acknowledgement of receipt and a response within 15 days, as well as a reasoned emergency procedure (marriage, birth, family reunification, hiring)."],["Reinforce resources and complete the digitalisation","Make permanent and increase the staffing of protection officers dedicated to civil status; generalise online filing and tracking with secure digital issuance (electronically signed, verifiable record); publish each quarter open indicators (backlog, average deadline, 9th-decile deadline)."],["Guarantee the full enforceability of the certificate","Attach to art. L561-16 of the CESEDA a text recalling that the certificate of extension of processing and the receipt serve as proof of residence and of the right to work, and issue an inter-ministerial instruction enforceable against banks (via the ACPR), landlords, employers, CAF and France Travail, prohibiting them from requiring a final record when the certificate is produced."],["Recognise the probative value of provisional documents","Specify in the CESEDA and by circular (civil status officers, prefectures) that the provisional documents and the administrative certificate issued by the OFPRA pending the final record have sufficient probative value to initiate the procedures of civil life — so that waiting no longer paralyses the exercise of rights."],["Give OFPRA the means to clear the backlog","Make permanent and increase the number of protection officers dedicated to civil status, and fund a backlog-clearance plan (nearly 60,000 pending cases), to reach an enforceable target deadline."]],"base":[["Article L121-9 of the CESEDA","The OFPRA is empowered to issue to refugees, beneficiaries of subsidiary protection and stateless persons the documents necessary for the acts of civil life, in particular the documents serving as civil status records. Its director general authenticates these records, which have the value of authentic instruments and make up for the absence of records issued in the country of origin. The text sets no establishment deadline."],["Article R121-35 of the CESEDA","Specifies the conditions for the establishment and issuance of records by the Office and confirms their value as authentic instruments, the Office being able to rectify only purely material omissions and errors. Here again, no deadline enforceable against the OFPRA is provided for."],["Article L561-16 of the CESEDA","Pending the final establishment of their civil status by the OFPRA, the protected person may claim the benefit of the rights opened by the Labour Code, the Social Security Code, the Social Action and Families Code and the Construction and Housing Code, on the basis of the family composition taken into account during the examination of the asylum application."],["Conseil d'État, 2nd-7th joint chambers, 30 January 2025, Nos. 495916 and 495917","Seized by the GISTI and the ADDE, on the one hand, and by La Cimade, the GAS, JRS France and the LDH, on the other, of the implicit refusal to take measures to reduce the OFPRA's deadlines, the Conseil d'État dismissed the applications. It noted that the deadlines had begun to decrease from the last quarter of 2023, to be brought down to less than ten months, and that protected status, combined with the certificate of extension of processing and the rights opened by art. L561-16, made it possible to exercise most of the rights attached to the status."]],"chiffres":[["59,860","civil status files pending at the OFPRA on 31 December 2024 (the backlog exceeded 31,500 at the end of 2022)"],["9.1 months","average deadline for establishing records in 2025 (275 days), compared with 10.8 months in 2024 and 11.7 months in 2023"],["—","legal deadline currently enforceable against the OFPRA to establish civil status records"]],"sources":[["Article L121-9 du CESEDA — Légifrance","https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000042777575"],["Article L561-16 du CESEDA — Légifrance","https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000042775752"],["CE, 30 janvier 2025, n° 495916 (délais d'état civil OFPRA) — Légifrance","https://www.legifrance.gouv.fr/ceta/id/CETATEXT000051105650"],["Conseil d'État — Décision n° 495916 du 30 janvier 2025","https://www.conseil-etat.fr/fr/arianeweb/CE/decision/2025-01-30/495916"],["OFPRA — Bilan 2025 : une activité record et des évolutions contrastées","https://www.ofpra.gouv.fr/actualites/bilan-2025-de-lofpra-une-activite-record-et-des-evolutions-contrastees"],["La Cimade — Rapport d'activité OFPRA 2024","https://www.lacimade.org/rapport-dactivite-ofpra-2024-cartographie-de-la-demande-dasile/"]],"chips":["L121-9 CESEDA","R121-35","L561-16","CE 30 janv. 2025, 495916"]},{"id":"p-voyage","icon":"passport","titre":"Travelling outside France (tourism, work, family)","intro":"For a business trip, a tourist trip or a visit to relatives, a protected person cannot use the passport of their country of origin.","steps":[{"ic":"plane","l":"Travel plans (tourism, work, family)"},{"ic":"passportno","l":"Country-of-origin passport unusable"},{"ic":"form","l":"Application for a travel document (TIV / TVR) on ANEF"},{"w":true,"real":"8 to 10 months<br>reported","legal":""},{"ic":"passport","l":"Travel document issued"},{"ic":"planeok","l":"Travel becomes possible"}],"constat":"The <strong>travel document for refugees</strong> (TVR), the <strong>identity and travel document</strong> (TIV) issued to beneficiaries of subsidiary protection, and the travel document for stateless persons are secure biometric documents that replace the national passport — which these persons cannot request from their country of origin. The application is exclusively digital, on the ANEF. Unlike the validity period and the fee, which are set by law, <strong>no text sets a legal deadline for production or issuance</strong>. In practice, prefectures recommend filing at least three months before departure and announce deadlines of around 30 to 60 days, without guarantee or priority processing; actual deadlines are sometimes much longer, with no organised emergency procedure.","probleme":"Without an enforceable deadline, the protected person has no guarantee as to the date on which they will actually be able to travel: visiting relatives in a third country, a business trip, a medical procedure, the death of a relative. <strong>The absence of an emergency procedure makes it impossible to take account of compelling situations.</strong> The recommendation to file « at least three months before » places on the person an uncertainty they cannot control, when, by definition, they cannot obtain a passport from their country of origin — depriving of effectiveness a right recognised by law.","propositions":[["Enter a regulatory issuance deadline in the CESEDA","Supplement the regulatory part of the CESEDA (around art. R561-8) with an enforceable maximum deadline for production and delivery of the document, set at <strong>two months</strong> from a complete application, aligned with the practice for the ordinary passport. Failing a decision, provide for a mandatory prefectural point of contact and an accelerated remedy."],["Create an emergency procedure for compelling reasons","Introduce an emergency channel with issuance within 5 to 10 business days in the event of a justified compelling reason (serious medical reason, death or illness of a relative, compelling family reason, dated professional obligation), with a list of supporting documents and a priority desk — on the model of the existing emergency procedure for the passport and the national identity card (CNI)."],["Guarantee online tracking and published deadlines","Make mandatory, on the ANEF, step-by-step time-stamped tracking (filing, processing, production, making available), and the quarterly publication, by prefecture, of the actual average issuance deadlines — to make the administration accountable and allow the management of discrepancies."],["Attach effective guarantees to exceeding the deadline","In the event of an exceedance attributable to the administration, provide for a penalty payment as of right in urgent proceedings before the administrative judge and the possibility of issuing a provisional travel document allowing an already planned trip — like the provisional documents existing in residence matters."],["Reduce or abolish the fee for the most precarious","Amend section IV of Article 953 of the CGI to exempt from the stamp duty (€45 or €40) beneficiaries of protection who have no resources or who receive minimum social benefits, or introduce a reduced rate, so that the cost is not an additional obstacle to the exercise of a fundamental right."],["Resource the document-production service properly","Provide the travel-document service with staff and biometric equipment matched to demand, to bring production down to a few weeks."]],"base":[["Article L561-9 of the CESEDA — travel document for refugees","A foreign national holding a valid residence permit who has been recognised as a refugee may be issued a « travel document for refugees », authorising them to travel outside France, except for compelling reasons of national security or public order, with the exception of the State or States in respect of which the fears of persecution have been recognised as well-founded. No production or issuance deadline is set."],["Article L561-10 of the CESEDA — identity and travel document","The beneficiary of subsidiary protection may be issued an « identity and travel document », except for compelling reasons of national security or public order. It does not allow travel to the State or States where the person concerned would be exposed to the serious harm referred to in art. L512-1. No production or issuance deadline is set."],["Articles L561-11, L561-12 and L561-13 of the CESEDA","The minor child of the protected person may be issued the travel document of art. L561-10 (L561-11). The validity period of the documents issued pursuant to art. L561-9 to L561-11 is set in section IV of Article 953 of the CGI (L561-12); no processing deadline is provided for therein. The document may be withdrawn or its renewal refused for compelling reasons of national security or public order (L561-13)."],["Article L582-7 of the CESEDA — travel document for stateless persons","A foreign national recognised as stateless and holding a valid residence permit may be issued a « travel document for stateless persons », except for compelling reasons of national security or public order, its validity period likewise being referred to section IV of Article 953 of the CGI. No production or issuance deadline is set."],["Article 953, IV, of the General Tax Code","Sets the validity period and the fee: document issued to refugees, stateless persons or beneficiaries of subsidiary protection holding a resident card — valid for 5 years, €45 fee; document issued to stateless persons or beneficiaries of subsidiary protection holding a 4-year multi-year card — valid for 4 years, €40 fee; identity and travel document issued to a foreign national who is not a beneficiary of protection (e.g. a child) — valid for 1 year, €15 fee. No provision imposes an issuance deadline."],["Article R561-8 of the CESEDA","Specifies the documents to be presented (residence permit, two regulation photographs, proof of address or declaration of domiciliation). The text sets the conditions of filing but no processing or document-delivery deadline."]],"chiffres":[["663,241","persons under the protection of the OFPRA at the end of 2024 (refugees, stateless persons, subsidiary protection) — population concerned"],["—","legal deadline for production or issuance set for the travel document: no text frames it"],["3 months","minimum period merely recommended by prefectures for filing before travel, without any guarantee of compliance"]],"sources":[["CESEDA — Section 4 : Documents de voyage (L561-9 à L561-13) — Légifrance","https://www.legifrance.gouv.fr/codes/section_lc/LEGITEXT000006070158/LEGISCTA000042772564/"],["CESEDA — Apatridie, dont L582-7 — Légifrance","https://www.legifrance.gouv.fr/codes/section_lc/LEGITEXT000006070158/LEGISCTA000042772666/"],["CGI, article 953 (validité et taxe des titres de voyage) — Légifrance","https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000041466881"],["Réfugié : titre de séjour, document de voyage et accompagnement — service-public.gouv.fr","https://www.service-public.gouv.fr/particuliers/vosdroits/F15401"],["Demander un titre de voyage (dépôt ANEF, recommandation 3 mois) — Préfecture de la Gironde","https://www.gironde.gouv.fr/Demarches/Immigration-et-integration/Demander-un-document-de-voyage-delivre-par-la-France/Refugie-Protege-subsidiaire/Demander-un-titre-de-voyage-pour-etranger-beneficiaire-de-la-protection-internationale"],["Dématérialisation via l'ANEF : des ruptures de droits graves et massives — Défenseur des droits","https://www.defenseurdesdroits.fr/dematerialisation-des-demandes-de-titres-de-sejour-lanef-des-ruptures-de-droits-graves-et-massives"]],"chips":["L561-9 (TVR)","L561-10 (TIV)","L561-12","L582-7 (apatride)","CGI art. 953-IV","R561-8"]},{"id":"p-sejour","icon":"carte","titre":"Obtaining a residence permit after protection","intro":"As soon as OFPRA or the CNDA grants protection, the prefecture must issue the residence permit. In the meantime, the allowance often stops.","steps":[{"ic":"ofpraok","l":"Favourable decision (OFPRA / CNDA)"},{"ic":"pauseada","l":"The allowance (ADA) stops — risk of a period without resources"},{"w":true,"real":"often > 3 months<br>(sometimes 7 months or more)","legal":"3 months"},{"ic":"carte","l":"Residence permit or resident card issued"}],"constat":"Once protection is granted by the OFPRA or the CNDA, the prefect has a regulatory deadline of <strong>three months</strong> to issue the residence permit. Refugees are entitled to a ten-year resident card; beneficiaries of subsidiary protection first receive a multi-year card of up to four years, then, after four years of lawful residence, a ten-year resident card. In practice, this deadline is very frequently exceeded, <strong>with no penalty attached to it</strong>. At renewal, processing via the digital platform ANEF generates interruptions of rights documented by the Defender of Rights, the Conseil d'État and associations.","probleme":"The three-month deadline is devoid of binding force: exceeding it exposes the administration to no penalty. At renewal, going through the ANEF, which has become the standard channel, causes interruptions of rights — permit expired without a certificate of extension, loss of employment, housing and benefits. <strong>The right to file the application and to a certificate covering all rights (residence, work, benefits) is not effectively guaranteed.</strong>","propositions":[["Make the three-month deadline enforceable and penalised","Supplement Articles R. 424-1 and R. 424-7 of the CESEDA: failing issuance within three months, a certificate serving as a residence permit (conferring the right to work and to benefits) is issued as of right, with an automatic penalty payment paid to the person concerned in the event of an unjustified exceedance (on the model of the urgent useful-measures application, art. L. 521-3 CJA)."],["Automatically issue a certificate covering all rights","Amend Article R. 431-15-1 of the CESEDA so that the certificate of extension of processing is generated automatically by the ANEF as soon as the complete file is submitted, expressly mentions the right to residence, to work and to benefits, and is renewed automatically — in line with the injunction of the Conseil d'État of 5 May 2026 (No. 502860)."],["Automatically extend the validity of the permit during processing","Provide by decree that the permit of a protected person who has filed their renewal application within the deadlines remains valid until the express decision of the prefecture, without any submission-window condition or additional step — removing any gap between the expiry of the permit and the certificate."],["Guarantee the right to file and access to an appointment","Make the substitute solution operational (Decree No. 2023-191 of 22 March 2023): in-person reception within 30 days where using the ANEF is impossible, time-stamped traceability of attempts, facilitated access to the urgent useful-measures judge (in the wake of CE, 18 February 2022, No. 455740)."],["Make the ANEF reliable and publish indicators","Implement the injunctions of the Conseil d'État (No. 502860): simultaneous filing on distinct grounds, correction of files, an end to refusals wrongly based on the absence of return of the previous permit. Publish for each prefecture the average deadline and the compliance rate with the three-month deadline, with a monitoring committee."],["Strengthen the prefectures' foreign-nationals services","Make permanent and expand the announced 500 extra staff: recruit established officers in prefecture 'séjour' services, with multi-year funding, to absorb the queues and meet the three-month deadline."]],"base":[["Article R424-1 of the CESEDA","The prefect issues the resident card (art. L. 424-1 or L. 424-3) within a deadline of three months from the decision recognising refugee status by the OFPRA or the CNDA. This deadline carries no penalty in the event of an exceedance."],["Article R424-7 of the CESEDA","The prefect issues the multi-year residence card (art. L. 424-9 or L. 424-11) within a deadline of three months from the decision granting subsidiary protection. As for refugees, this deadline carries no penalty."],["Articles L424-1, L424-4, L424-9, L424-13 of the CESEDA","The refugee receives a ten-year resident card (L. 424-1); L. 424-4 refers to decree the deadline for issuance (implemented by R. 424-1). The beneficiary of subsidiary protection receives a multi-year card with a maximum duration of four years (L. 424-9), then, after four years of lawful and uninterrupted residence, a ten-year resident card (L. 424-13), subject in particular to the absence of a threat to public order."],["Articles R431-15-1 and R431-5 of the CESEDA","Filing on the online service gives rise to a filing certificate which does not establish the lawfulness of residence. Where the processing of a complete application extends beyond the expiry of the permit, the prefect makes available a certificate of extension of processing (API), valid for a maximum of three months and renewable (R. 431-15-1). The renewal application must be filed between the 120th and the 60th day preceding expiry (R. 431-5); outside this window, the maintenance of rights is not guaranteed."],["CE, Section, 3 June 2022, No. 452798","The Conseil d'État annuls the decree making recourse to the ANEF mandatory insofar as it does not provide for a substitute solution: the administration must provide support and a non-digital channel where the user is unable to use the online service."],["CE, 5 May 2026, No. 502860","The Conseil d'État orders the State to remedy the malfunctions of the ANEF: within six months, ensure the making available or renewal in good time of certificates of extension of processing and that the rights attached (in particular the right to work) appear on them, allow the completion of files, put an end to refusals wrongly based on the absence of return of the previous permit; within twelve months, allow the simultaneous filing of applications on distinct grounds."]],"chiffres":[["3 months","Regulatory deadline for issuance after the OFPRA/CNDA decision (art. R. 424-1 and R. 424-7 CESEDA), without effective penalty"],["28%","Share of the 2023 complaints to the Defender of Rights falling under immigration law; more than 75% concern prefectures"],["6 to 12 months","Deadlines set for the State by the Conseil d'État (5 May 2026, No. 502860) to correct the malfunctions of the ANEF"]],"sources":[["CESEDA — Section 1 : Réfugiés (R424-1 et s.) — Légifrance","https://www.legifrance.gouv.fr/codes/section_lc/LEGITEXT000006070158/LEGISCTA000042801156/"],["CESEDA — Section 2 : Protection subsidiaire (R424-7 et s.) — Légifrance","https://www.legifrance.gouv.fr/codes/section_lc/LEGITEXT000006070158/LEGISCTA000042801170/"],["CESEDA — Titres de séjour des bénéficiaires d'une protection (L424-1 et s.) — Légifrance","https://www.legifrance.gouv.fr/codes/section_lc/LEGITEXT000006070158/LEGISCTA000042771756/"],["Décret n° 2023-191 du 22 mars 2023 — Légifrance","https://www.legifrance.gouv.fr/jorf/id/JORFTEXT000047332636"],["CE, Section, 3 juin 2022, n° 452798 — Légifrance","https://www.legifrance.gouv.fr/ceta/id/CETATEXT000045863484"],["Défenseur des droits — Rapport sur l'ANEF (11 décembre 2024)","https://www.defenseurdesdroits.fr/atteintes-aux-droits-des-etrangers-le-defenseur-des-droits-publie-un-rapport-sur-ladministration"],["Conseil d'État — Accès normal à la plateforme ANEF (5 mai 2026, n° 502860)","https://www.conseil-etat.fr/actualites/services-publics-le-conseil-d-etat-enjoint-a-l-etat-de-garantir-un-acces-normal-a-la-plateforme-en-ligne-de-l-anef"]],"chips":["R424-1 CESEDA","R424-7","L424-1 / L424-13","R431-15-1","CE 452798","CE 502860"]},{"id":"p-naturalisation","icon":"flagfr","titre":"Becoming French: naturalisation","intro":"After several years, a protected person can apply for French nationality. The law sets a deadline… but its starting point can be pushed back indefinitely.","steps":[{"ic":"form","l":"Submission of the complete file on ANEF"},{"ic":"recepisse","l":"Acknowledgement of completeness — it (theoretically) starts the clock"},{"w":true,"real":"3 to 4 years<br>(often)","legal":"18 months"},{"ic":"decision","l":"Decision — silence from the administration counts as a refusal"},{"ic":"flagfr","l":"Naturalisation"}],"constat":"Article 21-25-1 of the Code civil requires the public authority to respond to a naturalisation application within a deadline of <strong>eighteen months</strong> (twelve months for a foreign national habitually residing in France for at least ten years), which may be extended once by three months by a reasoned decision. But this deadline runs only from the submission of all the documents of a complete file, « against which a receipt is issued immediately ». Yet Article 37-1 of Decree No. 93-1362 provides that this receipt is issued « upon submission of the documents », <strong>without attaching to this obligation any specified deadline or any penalty</strong>. In practice, the issuance of the receipt is delayed, or even omitted — which the Defender of Rights (Défenseure des droits) described as a failure of the public service (decision No. 2024-025 of 19 February 2024). In 2024, 103,661 people acquired French nationality, of whom 48,494 by naturalisation.","probleme":"The legal deadline is almost always circumvented by a simple mechanism: as long as the acknowledgement of completeness has not been issued, the eighteen-month clock does not start. The applicant remains in a wait with no legal end. When the deadline finally expires, the administration's silence amounts to an <strong>implicit refusal</strong> — and not acceptance: the State's inaction is turned against the user. The only real remedy — petitioning the minister (RAPO, mandatory prior administrative appeal) then the Administrative Court of Nantes to compel a ruling — adds several months, even years, at the cost of a lawyer.","propositions":[["Start the deadline from the complete submission on the ANEF","Amend Article 21-25-1 of the Code civil so that the 18-month deadline (12 months) runs from the online submission of a complete file, the time-stamped acknowledgement of registration serving as the acknowledgement of completeness. Failing that, frame the issuance of the receipt with a short, enforceable deadline (for example 30 days) in Article 37-1 of Decree No. 93-1362."],["Make exceeding the deadline genuinely penalised","Beyond the unmet deadline, allow petitioning the urgent-applications judge (juge des référés) for an order to rule, accompanied by a penalty payment (for example €100 per day of delay), at the State's expense. Examine easing the conditions for admissibility of the appeal in the event of prolonged failure to act."],["Require an express and reasoned decision","Frame the implicit refusal: any complete application should receive an express and reasoned decision within the legal deadline. An application left without a notified decision would be deemed admissible, without prejudice to the review of the substantive conditions — removing the perverse effect of silence amounting to rejection."],["Create an accelerated procedure for deadline disputes alone","Establish before the Administrative Court of Nantes a specific and accelerated procedure (single judge, within a few months) limited to litigation over the exceeding of deadlines and the non-issuance of the receipt, distinct from litigation on the merits."],["Make the deadline transparent and tracked online","Display in the ANEF account the date of completeness, the applicable legal deadline, a countdown of the time remaining and the processing stage; publish each quarter the actual deadlines and the backlog of the SDANF, and reinforce staffing in proportion to submissions."],["Give the SDANF the means to meet the deadline","A deadline only matters if the administration can meet it. Adopt a multi-year recruitment plan for caseworkers at the sub-directorate for access to French nationality (SDANF), funded by a dedicated budget sized to the actual caseload — to clear the backlog, not just make the deadline enforceable."]],"base":[["Article 21-25-1 of the Code civil","« The public authority's response to an application for the acquisition of French nationality by naturalisation must occur at the latest eighteen months from the submission of all the documents necessary to constitute a complete file, against which a receipt is issued immediately. » This deadline is reduced to twelve months for a foreign national who can prove habitual residence in France for at least ten years, and may be extended once, by a reasoned decision, by three months. The starting point is the submission of the documents (acknowledgement of completeness), and not the date of filing."],["Article 37-1 of Decree No. 93-1362 of 30 December 1993","In its version in force (Decree No. 2024-108 of 14 February 2024, applicable to applications filed from 1 January 2026), it provides: « Upon submission of the documents provided for above, the authority with which the application was filed issues the receipt provided for in Article 21-25-1 of the Code civil. » No provision, however, sets a specified, enforceable maximum deadline for this issuance, which makes it possible to delay in practice the starting point of the legal processing deadline."],["Silence amounting to rejection — art. L. 231-4 of the CRPA","By way of derogation from the principle « silence amounts to acceptance » (art. L. 231-1 of the Code of relations between the public and the administration), silence kept on an application for naturalisation by decree amounts to an implicit decision of rejection. Likewise, silence kept for four months by the minister on the mandatory prior administrative appeal (RAPO) amounts to rejection."],["Jurisdiction and avenues of appeal","An unfavourable decision must first be challenged by a RAPO before the minister in charge of naturalisations (deadline: 2 months); its rejection may then be challenged before the Administrative Court of Nantes, which alone has nationwide jurisdiction for disputes relating to the sub-directorate for access to French nationality (SDANF), within a deadline of 2 months. The judge may compel a ruling, where appropriate subject to a penalty payment."]],"chiffres":[["18 months","Maximum legal response deadline (12 months if 10 years of residence) — art. 21-25-1 C. civ."],["3 to 4 years","Actual duration frequently observed, the starting point of the deadline being delayed (Défenseur des droits, 2022)"],["48,494","Naturalisations in 2024, out of 103,661 acquisitions of nationality (+6.6% in one year)"]],"sources":[["Article 21-25-1 du Code civil — Légifrance","https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000006419662"],["Article 37-1 du décret n° 93-1362 — Légifrance","https://www.legifrance.gouv.fr/loda/article_lc/LEGIARTI000051906775"],["Décision du Défenseur des droits n° 2024-025 du 19 février 2024","https://juridique.defenseurdesdroits.fr/index.php?lvl=notice_display&id=49828"],["Naturalisation par décret : délais et recours — service-public.gouv.fr","https://www.service-public.gouv.fr/particuliers/vosdroits/F2213"],["Intégration et accès à la nationalité — chiffres 2024 (ministère de l'Intérieur)","https://www.immigration.interieur.gouv.fr/fr/Info-ressources/Etudes-et-statistiques/Les-chiffres-de-l-immigration-en-France/Integration-et-l-acces-a-la-nationalite-francaise"],["Rapport du Défenseur des droits, « Devenir français par naturalisation » (2022)","https://www.defenseurdesdroits.fr/fr/rapports/2022/02/rapport-devenir-francais-par-naturalisation-recommandations-visant-a-faire"]],"chips":["Art. 21-25-1 C. civ.","Art. 37-1 décret 93-1362","Art. L. 231-4 CRPA","TA de Nantes"]},{"id":"reunification-familiale-dcem","icon":"family","titre":"Bringing in and enabling the movement of one's children: family reunification and travel document (DCEM)","intro":"A person granted refugee status or subsidiary protection has the right to bring in family members who remained abroad (family reunification), without any condition as to resources, housing or length of residence. Once the family is in France, a foreign minor child needs a travel document (DCEM) to travel outside France and return without a visa. On paper, these rights are clear. In practice, everything often gets stuck at the same point: civil status records. Consulates and prefectures demand recent birth certificates (sometimes \"less than 3 months old\") that the protected person cannot, by definition, request from the authorities of the country they fled. They then depend on the reconstitution of their civil status by OFPRA, whose actual processing times run into months, with no statutory deadline enforceable against the administration.","steps":[{"ic":"ofpraok","l":"Protection granted (OFPRA/CNDA status)"},{"ic":"form","l":"Application for family reunification (visa at the consulate) or for a DCEM (prefecture, online via ANEF)"},{"ic":"acte","l":"OFPRA reconstitutes the civil status and certifies the family composition"},{"ic":"warning","l":"Obstacle: a \"recent\" birth certificate required, impossible to obtain from the country of origin"},{"w":true,"real":"Family reunification: visa often issued within 3 to 8 months,<br>extended when civil status is not yet established (OFPRA reconstitution ~6 to 12 months).<br>DCEM: 2 to 4 months observed at the prefecture.","legal":"DCEM: \"Not established\" (no enforceable issuance deadline).<br>Reunification: no deadline imposed by the CESEDA."},{"ic":"check","l":"Document issued / family reunited"}],"constat":"The law is generous but access is choked by an administrative bottleneck: civil status records. Family reunification for refugees depends neither on resources nor on housing (CESEDA art. L561-2), and the DCEM is issued to the child as of right. But consulates, town halls and prefectures demand recent civil status documents that a protected person cannot obtain from their country of origin without putting themselves in danger or undermining the very meaning of their protection. They therefore depend entirely on the reconstitution of their civil status by OFPRA, whose processing times have doubled in five years (177 days in 2019, 240 days in 2021), reaching up to a year locally. Meanwhile, no statutory deadline is enforceable: the administration's silence triggers no effective sanction, and families remain separated for months on end.","probleme":"The requirement for a birth certificate \"less than 3 months old\" is in practice impossible to satisfy for a protected person: they cannot turn to the authorities of the country they fled, and their French civil status depends on an OFPRA reconstitution with long and unregulated processing times. The result is a circular deadlock: the prefecture or consulate waits for a document that only OFPRA can produce, OFPRA takes several months, and no enforceable statutory deadline makes it possible to break the impasse. Children remain separated from a parent, or can neither travel nor visit family for lack of a DCEM.","chiffres":[["—","Enforceable statutory deadline for issuing the DCEM"],["~6 to 12 months","Actual reconstitution of civil status by OFPRA"],["2 months","Period after which silence amounts to a refusal (DCEM)"]],"propositions":[["Prohibit requiring \"recent\" documents from protected persons","Issue a national instruction recalling that documents drawn up by OFPRA have the value of authentic instruments and that no recency (\"less than 3 months\") may be required of a protected person."],["Establish an enforceable deadline for OFPRA reconstitution","Set a maximum regulatory processing time for civil status records, together with a provisional attestation enforceable against prefectures and consulates in the interim."],["Strengthen the resources of OFPRA's civil status division","Increase the staff and budget dedicated to clearing the backlog and bringing processing times below 3 months, given the sharp rise in the number of protected persons."],["Recognise the provisional attestation as a sufficient document","Allow, as of right, a reunification visa or DCEM application to be processed on the basis of the provisional attestation of family composition, without waiting for the final document."],["Clear information and support","Make available, on service-public.gouv.fr and in prefectures, a single notice explaining the sequence OFPRA → consulate → prefecture and the avenues of appeal."],["Facilitate and clarify appeals","Systematically recall, in the event of a visa refusal, the obligation to refer the matter to the Commission for Appeals against Visa Refusals (CRRV) within 30 days before the Nantes administrative court."]],"base":[["CESEDA, art. L561-2","A refugee or beneficiary of subsidiary protection may be joined by their spouse/partner and their children, without any condition as to length of residence, resources or housing (except where there is a threat to public order)."],["CESEDA, art. R561-1 à R561-3","The visa application for family members is filed with the consular authority, which requests from OFPRA a certification of the family composition and the refugee's civil status."],["CESEDA, art. D414-1 à D414-4","The travel document for foreign minors (DCEM) is issued by the prefect, at the request of the person exercising parental authority, for a maximum period of 5 years."],["CESEDA, art. L121-13 / L561-2","Civil status documents drawn up by OFPRA for protected persons have the value of authentic instruments."]],"chips":["CESEDA art. L561-2","CESEDA art. R561-1","CESEDA art. R561-3","CESEDA art. D414-1","CESEDA art. D414-4"],"sources":[["Légifrance — CESEDA, family reunification (art. L561-2 to L561-5)","https://www.legifrance.gouv.fr/codes/section_lc/LEGITEXT000006070158/LEGISCTA000042772546/"],["Légifrance — CESEDA, travel documents for foreign minors (art. D414-1 to D414-4)","https://www.legifrance.gouv.fr/codes/section_lc/LEGITEXT000006070158/LEGISCTA000042800892/"],["OFPRA — Reconstitution of civil status","https://www.ofpra.gouv.fr/en/folder/institutions/civil-status-reconstitution"],["Sénat — Timelines for reconstituting and issuing civil-status documents (family reunification)","https://www.senat.fr/questions/base/2022/qSEQ220700483.html"]]},{"id":"droit-au-compte","icon":"bank","titre":"Opening a bank account: the right to a basic bank account","intro":"Having a deposit account is essential to receive the allowance, get a salary, pay rent or take out a subscription. Yet, for lack of a stable employment contract, proof of stable residence or a banking history in France, many protected persons (including beneficiaries of temporary protection from Ukraine) are refused the opening of an account by banks. French law provides a response to this situation: the \"right to an account\". Any person residing in France who is refused an account can refer the matter to the Banque de France, which then designates by default an institution required to open the account, free of charge, with basic banking services. This pathway describes the procedure, its theoretical timeframes and the gaps observed on the ground.","steps":[{"ic":"euro","l":"Need for a deposit account"},{"ic":"warning","l":"Refusal or restriction by the bank (no permanent contract / no residence)"},{"ic":"form","l":"Referral to the Banque de France under the right to an account"},{"ic":"bank","l":"Designation of an institution by default"},{"w":true,"real":"Variable: the designation is often quick, but the actual account opening sees frequent delays — requests for additional documents, postponed appointments.<br>Waiting times of several weeks are regularly reported.","legal":"1 business day for the designation, then 3 business days for the account to be opened by the designated bank (from receipt of the documents)"},{"ic":"check","l":"Account opened with free basic banking services"}],"constat":"The law is clear and protective: once the Banque de France has been referred to, opening the account is no longer a favour but an obligation for the designated bank, within short timeframes (1 business day for the designation, 3 business days for the opening). On paper, no person residing in France should be left without an account.","probleme":"In practice, the pathway remains strewn with obstacles. Many people are unaware that the right to an account even exists; branches sometimes refer them to the procedure without explaining it. At the stage of the actual opening, one observes repeated requests for supporting documents (residence, identity), postponed appointments and accounts opened to the bare minimum, sometimes closed shortly afterwards. Basic banking services, without an overdraft or a conventional chequebook, do not always make it possible to lead a normal economic life (a landlord or an employer may be reluctant). The language barrier and administrative complexity widen the gap between the statutory 3-business-day deadline and the time actually experienced.","chiffres":[["1 day","business day for the designation of a bank by the Banque de France"],["3 days","business days for the account to be opened by the designated bank"],["12","free basic banking services guaranteed"]],"propositions":[["Systematic information on the right to an account","Provide, upon any refusal to open an account, a written multilingual notice explaining the referral to the Banque de France, and establish it as a reflex in branches."],["Dedicated support for protected persons","Mobilise social workers (already authorised to refer matters to the Banque de France) and associations to assemble the files and track the timeframes through to the actual opening."],["Enforce the 3-business-day deadline","Set up monitoring of delays and a simple reporting channel (Banque de France, ACPR, Defender of Rights) when the designated bank exceeds the statutory deadline."],["Clarify the documents that may be required","Circulate a standard list of accepted supporting documents (residence permit / temporary protection, proof of domiciliation) to prevent abusive requests for documents."],["Strengthen reception capacity","Recruit and train multilingual staff and mediators at the Banque de France and in support networks, and fund domiciliation structures, to absorb the flows and reduce actual timeframes."],["Broaden the usefulness of basic services","Encourage banks to offer, beyond the minimal services, payment solutions that are genuinely usable for housing and employment."]],"base":[["CMF art. L312-1, I","Any natural or legal person residing in France has the right to open a deposit account at the credit institution of their choice."],["CMF art. L312-1, II","In the event of a refusal, the person may refer the matter to the Banque de France, which designates a credit institution within one business day from receipt of the required documents."],["CMF art. L312-1, III","The designated institution is required to open the account within three business days from receipt of all the documents."],["CMF art. D312-5","The designated institution provides the basic banking services free of charge (the twelve services laid down by decree)."]],"chips":["CMF art. L312-1","CMF art. D312-5","Charte d'accessibilité bancaire"],"sources":[["Banque de France — Exercising your right to an account","https://www.banque-france.fr/fr/a-votre-service/particuliers/faire-valoir-droit-au-compte-bancaire"],["Légifrance — Monetary and Financial Code, article L312-1","https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000044605348/"],["economie.gouv.fr — The right-to-account procedure (DAC)","https://www.economie.gouv.fr/particuliers/gerer-mon-argent/gerer-mon-budget-et-mon-epargne/comment-utiliser-la-procedure-de-droit-au-compte-dac-pour-ouvrir-un-compte-bancaire"],["ABE Infoservice — Right to an account","https://www.abe-infoservice.fr/fr/banque/droit-au-compte"]]},{"id":"se-loger-logement-social","icon":"house","titre":"Finding housing: social housing and leaving emergency accommodation","intro":"Once granted protection, many refugees live in emergency accommodation or temporary housing. To access durable housing, the main route is the social housing application, registered under a \"single registration number\". But supply falls far short of demand: the wait is often measured in months, even years, while the place in accommodation can itself be called into question. This pathway describes the steps, the actual timeframes observed and the rights that protect the person during the wait, in particular the enforceable right to housing (DALO).","steps":[{"ic":"house","l":"Need for housing / end of emergency accommodation"},{"ic":"form","l":"Social housing application (single registration number)"},{"ic":"recepisse","l":"Registration certificate (within the month)"},{"w":true,"real":"Several months to several years<br>depending on the area and the family composition","legal":"\"Abnormally long timeframe\" set by prefectoral order, varying by department (e.g. 24 months, 36 months)"},{"ic":"warning","l":"Risk of having to leave the accommodation before being rehoused"},{"ic":"check","l":"Housing offer (or DALO appeal)"}],"constat":"The social housing application rests on a clear and enforceable framework: registration, single registration number, a certificate within the month, and a right of appeal (DALO) if the wait exceeds the \"abnormally long timeframe\". On paper, being kept in emergency accommodation is guaranteed as long as no suitable solution is offered.","probleme":"In practice, the gap between the supply of and demand for social housing makes the wait very long, with no universal statutory cap. The \"abnormally long timeframe\" varies from one department to another and opens only an avenue of appeal, not immediate housing. Above all, the strain on accommodation places leads to terminations of care while the person has not been rehoused: the principle of continuity of accommodation (CASF art. L345-2-3) is weakened for lack of places, exposing people to being effectively returned to the street.","chiffres":[["1 month","statutory deadline to receive the certificate with the single registration number (CCH art. L441-2-1)"],["3 months","deadline to rehouse following a favourable DALO decision (6 months in overseas territories and large urban areas)"],["—","no guaranteed national deadline for the allocation of social housing"]],"propositions":[["Secure the continued stay in accommodation","Effectively guarantee the principle of continuity (CASF art. L345-2-3): no termination of care without a suitable solution being offered, and no return to the street."],["Information as soon as protection is granted","Support each protected person in filing the social housing application and obtaining their single registration number without delay, in a language they understand."],["Raise awareness of DALO","Systematically inform people about the amicable appeal before the mediation commission as soon as the abnormally long timeframe is reached, and about the contentious appeal."],["Harmonise the \"abnormally long timeframes\"","Reduce the disparities between departments and clearly publish the prefectoral order applicable to each area."],["Strengthen resources: supply and support","Increase the stock of housing that can be mobilised (prefectoral quota, Action Logement) and fund social workers and associations supporting people into and within housing."],["Link accommodation and rehousing","Smooth the transition from accommodation to housing (rental intermediation, sliding lease) to avoid breaks in people's pathways."]],"base":[["CCH art. L441-2-1","Every social housing application is registered and gives rise to a single national registration number; a certificate is issued within the month; no allocation without registration and a single registration number."],["CCH art. L300-1 (loi n° 2007-290 du 5 mars 2007)","The right to decent and independent housing is guaranteed by the State to any person residing lawfully who is unable to access or remain in such housing by their own means (DALO)."],["CCH art. L441-2-3","The mediation commission may be referred to without delay by an applicant who has not received a suitable offer at the end of the abnormally long timeframe set by the prefect; the prefect must then rehouse the beneficiary designated as a priority."],["CASF art. L345-2-3","Any person taken in under emergency accommodation must be able to remain there, as long as they wish, until they are directed towards a suitable solution (principle of continuity)."]],"chips":["CCH art. L441-2-1","CCH art. L300-1","CCH art. L441-2-3","Loi n° 2007-290 du 5 mars 2007","CASF art. L345-2-3","CASF art. L345-2-2"],"sources":[["Légifrance — CCH art. L441-2-1 (single registration number)","https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000033971871"],["Légifrance — Law No. 2007-290 of 5 March 2007 (DALO)","https://www.legifrance.gouv.fr/loda/id/JORFTEXT000000271094"],["ANIL — Enforceable right to housing (DALO): conditions and timelines","https://www.anil.org/votre-projet/vous-etes-locataire/locataire-en-difficulte/droit-au-logement-et-a-lhebergement-opposable/"],["Légifrance — CASF art. L345-2-2 (unconditional shelter)","https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000037670338"]]},{"id":"importer-immatriculer-vehicule","icon":"car","titre":"Importing and registering your vehicle: from foreign plates to the French registration certificate","intro":"A person who arrives in France with their car, or who buys one abroad, must have it registered in France. The pathway involves the tax authorities (tax clearance certificate), sometimes technical type-approval (DREAL), then the online registration certificate application (ANTS). In practice, it is a succession of independent counters, each with its own timeframes — with no guaranteed overall schedule. Meanwhile, the car still drives on foreign plates, which attracts police checks.","steps":[{"ic":"car","l":"Vehicle registered abroad"},{"ic":"form","l":"Tax clearance certificate at the tax office (SIE)"},{"ic":"decision","l":"DREAL type-approval / conformity if needed (RTI or COC)"},{"ic":"form","l":"Registration application on the ANTS"},{"w":true,"real":"Tax clearance certificate: 1 to 2 weeks<br>DREAL RTI (non-EU): several weeks to several months<br>ANTS registration certificate: 1 to 5 weeks after a complete file<br>Frequent total: several months","legal":"Application to be made within the month following acquisition (C. route art. R322-2). No enforceable overall completion deadline for the entire import pathway: \"Not established\""},{"ic":"check","l":"French registration certificate issued and FR plates fitted"}],"constat":"The pathway works when each document arrives: tax clearance certificate from the tax authorities, certificate of conformity (COC) or individual approval (RTI) from the DREAL, then the registration certificate from the ANTS. The law does set a one-month deadline to make the application after acquisition, but no authority is bound by an overall deadline to complete the whole process. The applicant depends on three separate administrations that do not coordinate.","probleme":"During this fragmented pathway, the vehicle remains on foreign plates and continues to be checked by the police and gendarmerie, who specifically target these plates (suspicion of failure to register, to insure or to pass the roadworthiness test). The applicant, although acting in good faith and already engaged in their procedures, is exposed to a fixed fine of €135 and to possible immobilisation — without any overall statutory deadline protecting them as long as the counters have not responded. The provisional \"WW\" certificate (valid for 4 months) exists to fill this gap, but it is little known and is only issued once the ANTS file has already been submitted.","chiffres":[["1 month","statutory deadline to file the application after acquisition (C. route R322-2)"],["—","no overall statutory deadline for the full completion of the import pathway"],["€135","fixed fine incurred for driving without French registration within the time limits"]],"propositions":[["Single import counter","Make the ANTS a single entry point that triggers, in sequence, the tax clearance certificate and, if needed, the referral to the DREAL, rather than three separate procedures to initiate yourself."],["Protection during processing","Recognise and roll out a proof of procedure in progress (such as a receipt or an automatic WW) that suspends sanctions as long as the administrations have not responded within a reasonable timeframe."],["Enforceable completion deadline","Establish a target overall completion deadline (clearance + type-approval + registration certificate) with a commitment from the administration, filling the current \"Not established\" gap."],["Targeted information for newcomers","Circulate a clear notice (FR + the languages of the main groups, including Ukrainian) on the order of the steps, the tax clearance certificate that is free for the occasion, and the provisional WW certificate."],["Guidance for law enforcement","Issue an instruction so that checks take account of proof of a procedure in progress and favour a reminder of the rules rather than an immediate fine for someone acting in good faith."],["DREAL resources for RTIs","Strengthen the staff and budgets of the DREAL vehicle units, the main bottleneck for non-EU vehicles requiring individual approval."]],"base":[["Code de la route, art. R322-1","Every motor vehicle must be fitted with a registration certificate (carte grise) in order to drive on roads open to public traffic."],["Code de la route, art. R322-2","The registration certificate in the new owner's name must be applied for within the month following acquisition; provisional circulation is possible under cover of a provisional registration certificate."],["Code général des impôts (quitus fiscal)","The registration of a vehicle acquired in the EU is subject to the production of a tax certificate (clearance) attesting to compliance with VAT requirements, issued by the tax office."],["Code de la route, art. R321-15 (réception)","Before registration, a vehicle without a valid EU type-approval must undergo an approval (in particular an individual approval) with the DREAL."]],"chips":["C. route art. R322-1","C. route art. R322-2","C. route art. R321-15","CGI quitus fiscal","RTI / DREAL"],"sources":[["impots.gouv.fr — Obtaining a tax clearance (quitus fiscal) — individuals","https://www.impots.gouv.fr/vous-etes-un-particulier-et-vous-souhaitez-obtenir-un-quitus-fiscal"],["impots.gouv.fr — Registering a vehicle and requesting a tax clearance (EU)","https://www.impots.gouv.fr/fiche-focus-immatriculer-un-vehicule-et-demander-un-quitus-fiscal-vehicule-acquis-dans-lunion"],["Légifrance — Highway Code, art. R322-2","https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000032401205"],["DRIEAT Île-de-France — Vehicle type-approval FAQ (RTI / DREAL)","https://www.drieat.ile-de-france.developpement-durable.gouv.fr/faq-reception-de-vehicules-a3246.html"]]},{"id":"echanger-permis-de-conduire","icon":"permis","titre":"Exchanging a driving licence: protected in France, yet dependent on an agreement with the country you fled","intro":"A protected person who settles in France long-term must exchange their foreign driving licence for a French one. But the exchange is only possible if a reciprocity agreement exists with the country of origin — the very country they had to flee, and whose authorities OFPRA instructs them never to contact again. Without an agreement, the application is refused, however complete the file.","steps":[{"ic":"ofpraok","l":"Subsidiary protection or refugee status granted"},{"ic":"permis","l":"Driving licence from the country of origin"},{"ic":"form","l":"Exchange application (ANTS / CERT) within one year"},{"w":true,"real":"Several months of processing,<br>then refusal on the sole ground<br>that no agreement exists","legal":"1 year to file the application (art. 11-I). No enforceable deadline for the administration."},{"ic":"warning","l":"Refusal: no reciprocity agreement with the country of origin"},{"ic":"car","l":"Retake the entire French driving test: months of waiting and high cost"}],"constat":"A licence issued by a State outside the European Union can only be exchanged in France if a reciprocity agreement exists with that State (article 5-I-A of the order of 12 January 2012, referring to article R. 222-1 of the Highway Code). Yet the order does provide a specific regime for protected persons: they are exempt from producing a certificate of driving entitlement (article 6-D) and from the residence-permit validity condition (article 11-II), and their one-year period runs from the date of the receipt establishing their status (article 11-I). But <strong>none of these provisions exempts them from the reciprocity condition</strong>. As a result, a refugee or beneficiary of subsidiary protection from a country with no agreement — Ukraine, for instance — has their application refused on that ground alone. The problem was raised in Parliament (written question to the Senate no. 03096 of 6 February 2025): the government replied that the number of people concerned was \"too small to justify\" negotiating an agreement, which would in addition require parliamentary ratification. No interim remedy has been offered.","chiffres":[["—","enforceable deadline for the administration to process the application — and no procedure or timetable for concluding the agreement on which everything depends"],["1 year","the deadline imposed on the protected person to file, running from the receipt (art. 11-I of the order of 12 January 2012)"],["≈ 98%","of protected Ukrainians in France hold subsidiary protection — precisely the status that requires exchanging the licence without making it possible"]],"probleme":"The asymmetry runs two ways. First in time: the protected person has one year, on pain of losing the right to exchange for good, while no deadline binds the administration to decide, nor the State to negotiate the agreement on which the outcome depends. Second in the underlying logic: international protection rests on severing ties with the country of origin — the OFPRA decision expressly instructs the person not to contact its authorities — yet the right to drive remains conditional on an agreement with that very country. The paradox is complete: beneficiaries of <em>temporary</em> protection, who do not have their normal residence in France (art. R. 222-2 of the Highway Code), continue to drive on their Ukrainian licence, while those granted <em>subsidiary</em> protection — a more stable status — lose that right. Meanwhile, a bilateral agreement still in force allows Russian nationals to exchange theirs. For those affected the consequence is very concrete: loss of the right to drive, and with it access to a great many jobs, plus the obligation to retake the entire French driving test, at a cost of several months and close to two thousand euros.","propositions":[["Exempt protected persons from the reciprocity condition","Amend article 11 of the order of 12 January 2012 so that the reciprocity condition in article 5-I-A does not apply to refugees, beneficiaries of subsidiary protection and stateless persons — in line with articles 6-D and 11-II, which already exempt them from other conditions precisely because their situation is not that of an ordinary foreign national."],["Recognise licences that comply with the Vienna Convention","Where no bilateral agreement exists, allow the exchange on the basis of the document's compliance with the Vienna Convention on Road Traffic of 8 November 1968, to which France and many countries of origin are parties, with documentary verification by the CERT."],["Suspend the one-year deadline during processing and appeals","Provide that the one-year period under article 11-I is suspended for as long as the administration has not decided, and during appeals, so that slow processing does not extinguish the right itself."],["Review refusals based on reciprocity alone, on the administration's own initiative","Organise a review of applications already refused solely for want of an agreement, with no new time condition, for protected persons who filed within the deadline."],["Provide a fallback scheme where no agreement exists","Where no agreement is in place, open a lighter route — verification of driving entitlement plus a practical check test — instead of retaking the full licence, whose cost and delay are prohibitive for people just settling in."],["Give the CERT the means to process, and publish its timescales","Staff the competent titles centre (CERT EPE) in proportion to the volume of applications, and publish quarterly the average processing times and the refusal rate by ground."]],"base":[["Order of 12 January 2012, art. 5-I-A","Exchanging a licence issued by a State outside the EU and EEA requires a reciprocity agreement between France and that State (referring to art. R. 222-1 of the Highway Code). This condition carries no exception for beneficiaries of international protection."],["Order of 12 January 2012, art. 11-I","For refugees, beneficiaries of subsidiary protection and stateless persons, the one-year period to apply for the exchange runs from the date of the receipt establishing their status."],["Order of 12 January 2012, art. 11-II and art. 6-D","These same persons are exempt from the residence-permit validity condition (art. 5-I-B) and from producing the certificate of driving entitlement: a specific regime therefore already exists for them, but it does not cover reciprocity."],["Highway Code, art. R. 222-2","The obligation to exchange applies only to persons whose normal residence is in France. Beneficiaries of temporary protection fall outside it and keep the use of their original licence, unlike those under long-term protection."]],"chips":["Arrêté du 12 janv. 2012, art. 5-I-A","art. 6-D","art. 11-I et 11-II","C. route art. R222-1, R222-2"],"sources":[["Order of 12 January 2012 (recognition and exchange of non-EU/EEA licences) — Légifrance","https://www.legifrance.gouv.fr/loda/id/JORFTEXT000025175223"],["Written question to the Senate no. 03096 of 6 February 2025 — impossibility of exchanging a Ukrainian licence","https://www.senat.fr/questions/base/2025/qSEQ250203096.html"],["National Assembly question no. 700 — mutual recognition of France-Ukraine driving licences","https://questions.assemblee-nationale.fr/q17/17-700QE.htm"],["GISTI — Exchanging foreign nationals' driving licences","https://www.gisti.org/spip.php?article5252"]]}]},"comparatif":{"tag":"Actual vs legal","h":"The gap between the wait and the law","sub":"For each procedure: the time actually observed, and the time the law requires (or not) of the administration.","rows":[["Reconstituting civil status (OFPRA)","≈ 9 months (up to 1.5 years)","Not set"],["Travel document","8 to 10 months","Not set"],["Residence permit","often > 3 months","3 months"],["Naturalisation","3 to 4 years","18 months (12 if 10 years)"],["Family reunification / DCEM","3 to 8 months (visa); 2 to 4 months (DCEM)","Not set"],["Opening a bank account","frequent refusals and delays","3 working days (designated bank)"],["Social housing","several months to several years","“abnormally long time” (prefectoral order)"],["Registering a vehicle","several months (fragmented process)","1 month to apply; no overall deadline"],["Exchanging a driving licence","refusal, however long the wait","1 year to apply; nothing for the administration"]]},"propositions":{"tag":"What we propose","h":"Five simple principles","sub":"The same thread runs through every journey. Here is what this website stands for.","cards":[["I","An enforceable deadline","A clear deadline for each step, with a definite starting point that cannot be pushed back by the administration."],["II","An effective penalty","An overrun that has real consequences: a penalty payment, a certificate, or a permit issued automatically by right."],["III","Continuity of rights","No gap between two permits or during processing: residence, work, resources and benefits preserved."],["IV","Transparency","A deadline counter, step-by-step online tracking, actual processing times published by prefecture."],["V","Reliable digitalisation","A platform (ANEF) that works, backed by in-person assistance for those who cannot use it."],["VI","Resources to match","A deadline is only achievable if the administration has the means. Invest in permanent recruitment and a multi-year budget, sized to the real volume of applications — not just create obligations."]]},"cadre":{"tag":"Legal framework","h":"What these processes are based on","sub":"The deadlines and obligations presented are based on the following texts. The actual processing times come from official sources and field feedback.","items":[["Reconstituting civil status (OFPRA)",["CESEDA art. L121-9","R121-35","L561-16","CE 30 janv. 2025, n° 495916 et 495917"]],["Titre de voyage",["CESEDA art. L561-9 à L561-13","L582-7 (apatride)","CGI art. 953-IV","R561-8"]],["Titre de séjour",["CESEDA art. R424-1, R424-7","L424-1 à L424-13","R431-15-1, R431-5","CE 3 juin 2022 n° 452798 ; CE 5 mai 2026 n° 502860"]],["Naturalisation",["Code civil art. 21-25-1","décret n° 93-1362 art. 37-1","CRPA art. L. 231-4","Tribunal administratif de Nantes (SDANF)"]]],"sourcesLabel":"Sources","sources":[["Légifrance — Code civil, CESEDA, CGI","https://www.legifrance.gouv.fr/"],["Conseil d'État — decisions and press releases","https://www.conseil-etat.fr/"],["Défenseur des droits — reports on ANEF and naturalisation","https://www.defenseurdesdroits.fr/"],["OFPRA — asylum data and 2024-2025 review","https://www.ofpra.gouv.fr/"],["service-public.gouv.fr — practical information sheets","https://www.service-public.gouv.fr/"],["UNHCR — global trends on refugees","https://www.unhcr.org/fr-fr/tendances-mondiales-0"]]},"cta":{"ha":"To understand is already to act.","p":"This process and these timelines concern hundreds of thousands of people. Share this page, talk about it, and support the simple idea that runs through it: clear, enforceable deadlines, and rights without interruption.","share":"Share this page","print":"Print / PDF"},"footer":{"brand":"Deadlines & Rights","disclaimer":"<strong>An information and awareness-raising document.</strong> It does not constitute individualised legal advice. For a personal procedure, contact a specialised association (La Cimade, France terre d'asile, GISTI, Forum réfugiés) or a lawyer specialising in immigration law. Figures and texts verified in June 2026 against public sources; the actual processing times are indicative and change over time.","meta":["Updated · June 2026","Sources · OFPRA · UNHCR","· Conseil d'État","· Défenseur des droits","· Légifrance · service-public.gouv.fr"]},"merci":{"tag":"A final word","h":"This is not a demand.","p1":"This website demands nothing. It respectfully suggests ways to make procedures smoother — the very procedures the administration itself is seeking to improve.","p2":"All those on whose behalf these proposals are made — and whom these journeys directly concern — wish first of all to express their deep gratitude to the French Republic. By opening its doors to those who had to flee war and persecution, France has become, for many of us, a new home. We do not forget this welcome, nor the women and men — prefecture and OFPRA staff, associations, volunteers — who make it possible every day.","p3":"If we speak of waiting times, it is not to complain but to contribute: clearer and faster procedures benefit everyone — protected persons, the administration, and the French society that welcomed us. It is in this spirit of gratitude and cooperation that these proposals are offered.","sign":"— Thank you."},"labels":{"constat":"The situation","probleme":"The problem","propositions":"Our proposals","propWord":"Proposal","fond":"Legal basis","sources":"Sources"}}
</script>

<script>
(function(){
  const $=(s,r)=>(r||document).querySelector(s);
  const esc=s=>(s==null?'':String(s));
  // ---- icon library (haute-garonne style: navy line + red accents) ----
  const B='#000091', R='#E1000F', O='#E4720B';

  const ICONS={
    form: svg('<path d="M23.8 6H12.5a3 3 0 0 0-3 3v22a3 3 0 0 0 3 3h15a3 3 0 0 0 3-3V12.7z"/><path d="M23.8 6v6.7h6.7"/><path d="M14.5 18.5h11M14.5 22.5h11M14.5 26.5h6.5"/><path d="M23 26.5l2 2 3.5-4" stroke="'+R+'"/>'),
    recepisse: svg('<path d="M23.8 6H12.5a3 3 0 0 0-3 3v22a3 3 0 0 0 3 3h15a3 3 0 0 0 3-3V12.7z"/><path d="M23.8 6v6.7h6.7"/><path d="M14.5 18.5h11M14.5 22.5h8"/><circle cx="25" cy="27.5" r="3.5" stroke="'+R+'"/>'),
