],["≈ 98 %","украинцев под защитой во Франции имеют именно дополнительную защиту — тот самый статус, который обязывает обменять права, но не позволяет этого сделать"]],"probleme":"Асимметрия здесь двойная. Во-первых, во времени: у человека под защитой есть один год — иначе он навсегда теряет право на обмен, — тогда как ни администрация не связана сроком рассмотрения, ни государство не связано сроком переговоров о соглашении, от которого зависит исход. Во-вторых, в самой логике: международная защита строится на разрыве связей со страной происхождения — решение OFPRA прямо предписывает не обращаться к её властям, — но право управлять автомобилем при этом поставлено в зависимость от соглашения именно с этой страной. Парадокс завершается тем, что получатели <em>временной</em> защиты, у которых нет обычного места жительства во Франции (ст. R. 222-2 Дорожного кодекса), продолжают ездить с украинскими правами, а те, кто получил <em>дополнительную</em> защиту — более устойчивый статус, — это право теряют. Одновременно действующее двустороннее соглашение позволяет обменивать права гражданам России. Последствия для людей очень конкретны: потеря права управления, а значит и доступа ко множеству рабочих мест, и необходимость заново сдавать на французские права — это несколько месяцев и почти две тысячи евро.","propositions":[["Освободить лиц под защитой от условия взаимности","Дополнить статью 11 приказа от 12 января 2012 года так, чтобы условие взаимности из статьи 5-I-A не применялось к беженцам, получателям дополнительной защиты и апатридам — в той же логике, что и статьи 6-D и 11-II, которые уже освобождают их от других условий, поскольку их положение не равнозначно положению обычного иностранца."],["Признавать права, соответствующие Венской конвенции","При отсутствии двустороннего соглашения допускать обмен на основании соответствия документа Венской конвенции о дорожном движении от 8 ноября 1968 года, участниками которой являются Франция и многие страны происхождения, с документальной проверкой со стороны CERT."],["Приостанавливать годичный срок на время рассмотрения и обжалования","Предусмотреть, что годичный срок по статье 11-I приостанавливается, пока администрация не вынесла решение, и на время обжалования, чтобы медлительность рассмотрения не лишала самого права."],["Пересмотреть по инициативе администрации отказы, основанные только на взаимности","Организовать пересмотр заявлений, отклонённых исключительно из-за отсутствия соглашения, без нового условия о сроке — для тех лиц под защитой, кто подал документы вовремя."],["Предусмотреть замещающий механизм при отсутствии соглашения","Если соглашения нет, открыть облегчённый путь — проверка права управления и контрольный практический экзамен — вместо полной пересдачи, стоимость и сроки которой запретительны для людей в начале обустройства."],["Дать CERT ресурсы и публиковать сроки","Обеспечить компетентный центр (CERT EPE) штатом, соразмерным объёму заявлений, и ежеквартально публиковать средние сроки рассмотрения и долю отказов по каждому основанию."]],"base":[["Приказ от 12 января 2012 года, ст. 5-I-A","Обмен прав, выданных государством вне ЕС и ЕЭП, возможен при наличии соглашения о взаимности между Францией и этим государством (отсылка к ст. R. 222-1 Дорожного кодекса). Это условие не содержит исключений для лиц, получивших международную защиту."],["Приказ от 12 января 2012 года, ст. 11-I","Для беженцев, получателей дополнительной защиты и апатридов годичный срок для подачи заявления об обмене исчисляется с даты выдачи расписки, подтверждающей статус."],["Приказ от 12 января 2012 года, ст. 11-II и ст. 6-D","Эти же лица освобождены от условия действительности вида на жительство (ст. 5-I-B) и от предоставления справки о праве управления: особый режим для них уже существует, но он не охватывает взаимность."],["Дорожный кодекс, ст. R. 222-2","Обязанность обменять права касается только тех, у кого обычное место жительства во Франции. Получатели временной защиты под неё не подпадают и сохраняют свои прежние права — в отличие от лиц, находящихся под защитой на длительный срок."]],"chips":["Arrêté du 12 janv. 2012, art. 5-I-A","art. 6-D","art. 11-I et 11-II","C. route art. R222-1, R222-2"],"sources":[["Приказ от 12 января 2012 года (признание и обмен прав, выданных вне ЕС/ЕЭП) — Légifrance","https://www.legifrance.gouv.fr/loda/id/JORFTEXT000025175223"],["Письменный вопрос в Сенат № 03096 от 6 февраля 2025 года — невозможность обменять украинские права","https://www.senat.fr/questions/base/2025/qSEQ250203096.html"],["Вопрос в Национальном собрании № 700 — взаимное признание прав Франция — Украина","https://questions.assemblee-nationale.fr/q17/17-700QE.htm"],["GISTI — обмен водительских удостоверений иностранцев","https://www.gisti.org/spip.php?article5252"]]}]},"comparatif":{"tag":"Реальность и закон","h":"Разрыв между ожиданием и законом","sub":"Для каждой процедуры: реально наблюдаемый срок и срок, который закон устанавливает (или не устанавливает) для администрации.","rows":[["Восстановить гражданское состояние (OFPRA)","≈ 9 месяцев (до 1,5 года)","Не установлен"],["Проездной документ","от 8 до 10 месяцев","Не установлен"],["Вид на жительство","часто > 3 месяцев","3 месяца"],["Натурализация","от 3 до 4 лет","18 месяцев (12 при 10 годах)"],["Воссоединение семьи / DCEM","3–8 месяцев (виза); 2–4 месяца (DCEM)","Не установлен"],["Открыть банковский счёт","частые отказы и переносы","3 рабочих дня (назначенный банк)"],["Социальное жильё","от нескольких месяцев до нескольких лет","«ненормально долгий срок» (приказ префекта)"],["Регистрация автомобиля","несколько месяцев (разрозненные этапы)","1 месяц на подачу; общего срока нет"],["Обмен водительских прав","отказ, независимо от срока ожидания","1 год на подачу; для администрации — ничего"]]},"propositions":{"tag":"Что мы предлагаем","h":"Пять простых принципов","sub":"Одна и та же нить проходит через каждый путь. Вот что отстаивает этот сайт.","cards":[["I","Обязательный для администрации срок","Чёткий срок для каждого этапа, с определённой точкой отсчёта, которую администрация не может откладывать."],["II","Действенная санкция","Превышение срока, имеющее реальные последствия: денежная санкция (astreinte), справка или титул, выдаваемый по праву."],["III","Непрерывность прав","Никакого разрыва между двумя титулами и в ходе рассмотрения: пребывание, работа, средства к существованию и пособия сохраняются."],["IV","Прозрачность","Счётчик срока, онлайн-отслеживание этап за этапом, реальные сроки, публикуемые по каждой префектуре."],["V","Надёжная цифровизация","Платформа (ANEF), которая работает, дополненная личным приёмом для тех, кто не может ею пользоваться."],["VI","Соразмерные ресурсы","Срок выполним, только если у администрации есть ресурсы. Инвестировать в постоянный наём и многолетний бюджет, рассчитанные на реальный объём заявлений, — а не только создавать обязанности."]]},"cadre":{"tag":"Правовая база","h":"На чём основаны эти пути","sub":"Представленные сроки и обязательства опираются на следующие тексты. Реальные сроки взяты из официальных источников и сведений с мест.","items":[["Восстановить гражданское состояние (OFPRA)",["CESEDA art. L121-9","R121-35","L561-16","CE 30 janv. 2025, n° 495916 et 495917"]],["Проездной документ",["CESEDA art. L561-9 à L561-13","L582-7 (apatride)","CGI art. 953-IV","R561-8"]],["Вид на жительство",["CESEDA art. R424-1, R424-7","L424-1 à L424-13","R431-15-1, R431-5","CE 3 juin 2022 n° 452798 ; CE 5 mai 2026 n° 502860"]],["Натурализация",["Code civil art. 21-25-1","décret n° 93-1362 art. 37-1","CRPA art. L. 231-4","Tribunal administratif de Nantes (SDANF)"]]],"sourcesLabel":"Источники","sources":[["Légifrance — Гражданский кодекс (Code civil), CESEDA, CGI","https://www.legifrance.gouv.fr/"],["Conseil d'État — решения и сообщения","https://www.conseil-etat.fr/"],["Défenseur des droits — доклады об ANEF и натурализации","https://www.defenseurdesdroits.fr/"],["OFPRA — данные об убежище и итоги 2024-2025 годов","https://www.ofpra.gouv.fr/"],["service-public.gouv.fr — практические памятки","https://www.service-public.gouv.fr/"],["УВКБ ООН (UNHCR) — мировые тенденции по беженцам","https://www.unhcr.org/fr-fr/tendances-mondiales-0"]]},"cta":{"ha":"Понять — это уже начать действовать.","p":"Этот путь и эти сроки касаются сотен тысяч людей. Поделитесь этой страницей, расскажите о ней и поддержите простую идею, которая через неё проходит: чёткие, обязательные сроки и права без разрывов.","share":"Поделиться этой страницей","print":"Печать / PDF"},"footer":{"brand":"Сроки и права","disclaimer":"<strong>Информационно-просветительский документ.</strong> Он не является индивидуальной юридической консультацией. Для личного обращения свяжитесь со специализированной организацией (La Cimade, France terre d'asile, GISTI, Forum réfugiés) или с адвокатом по праву иностранцев. Цифры и тексты проверены в июне 2026 года по публичным источникам; реальные сроки являются ориентировочными и меняются.","meta":["Обновлено · июнь 2026","Источники · OFPRA · HCR","· Conseil d'État","· Défenseur des droits","· Légifrance · service-public.gouv.fr"]},"merci":{"tag":"Несколько слов в завершение","h":"Это не требование.","p1":"Этот сайт ничего не требует. Он с уважением предлагает пути к тому, чтобы сделать процедуры удобнее — те самые, которые и сама администрация стремится улучшить.","p2":"Все, от чьего имени сформулированы эти предложения — и кого эти процедуры касаются напрямую, — прежде всего хотят выразить глубокую благодарность Французской Республике. Открыв двери тем, кто был вынужден бежать от войны и преследований, Франция стала для многих из нас новым домом. Мы помним и об этом приёме, и о людях — сотрудниках префектур, OFPRA, ассоциаций, волонтёрах, — благодаря которым он возможен каждый день.","p3":"Если мы говорим о сроках, то не чтобы жаловаться, а чтобы помочь: более понятные и быстрые процедуры выгодны всем — и людям под защитой, и администрации, и французскому обществу, которое нас приняло. Именно в духе признательности и сотрудничества и предлагаются эти идеи.","sign":"— Спасибо."},"labels":{"constat":"Констатация","probleme":"Проблема","propositions":"Наши предложения","propWord":"Предложение","fond":"Правовое основание","sources":"Источники"}}

{"meta":{"title":"Біженці у Франції: процедура та строки","desc":"Зрозуміти, крок за кроком, адміністративну процедуру для осіб, які отримали захист у Франції."},"ui":{"brand":"Строки і права","nav":[["chiffres","Цифри"],["parcours","Процедура"],["comparatif","Реальність vs закон"],["propositions","Наші пропозиції"],["cadre","Правова база"]],"ctaPrimary":"Переглянути процедуру","ctaSecondary":"Друк / PDF","share":"Поділитися","print":"Друк / PDF","linkCopied":"Посилання скопійовано ✓","realLabel":"Реальний строк","lawLabel":"Строк, передбачений законом","notSet":"Законом не встановлено"},"hero":{"eyebrow":"Зрозуміти процедуру для осіб, які отримали захист","h1a":"Захист надано.","h1b":"А далі — очікування.","lead":"Коли особа отримує притулок у Франції, її адміністративна процедура лише починається. Цей сайт показує, крок за кроком, що мають пройти біженці та особи з додатковим захистом — і розрив між реально зафіксованим строком та строком, передбаченим законом.","note":"Дані перевірено у червні 2026 року — OFPRA, Державна рада (Conseil d'État), Захисник прав (Défenseur des droits), УВКБ ООН (HCR), Légifrance — доповнено відгуками з місць."},"stats":{"tag":"Цифри","h":"Франція та біженці — коротко","sub":"Кілька орієнтирів, щоб окреслити реальність, часто маловідому широкому загалу.","cards":[["≈ 663 000","осіб під захистом OFPRA","на кінець 2024 року — біженці, додатковий захист, апатриди"],["153 596","заяв про надання притулку, зареєстрованих у 2024 році","рекордний рівень (+7,7 % за рік)"],["54 430","наданих захистів у 2024 році","тобто ≈ 39 % рішень OFPRA"],["3-тя","країна прийому в Європейському Союзі","за кількістю біженців — але 21-ша у перерахунку на населення"]],"context":{"h":"Реальність, яку часто погано знають","p":"У світовому масштабі приблизно троє біженців із чотирьох приймаються країнами з низьким або середнім рівнем доходу, найчастіше сусідніми із зонами конфліктів. Із майже 43 мільйонів біженців у світі Франція приймає лише незначну їх частку. А щойно захист надано, починається інша процедура: процедура формальностей та очікування."}},"parcours":{"tag":"Процедура, крок за кроком","h":"Кожна ситуація — крок за кроком","sub":"Для кожної ситуації: етапи, які потрібно пройти, реально зафіксований строк (⏱ помаранчевим) та строк, який закон встановлює для адміністрації (⚖ синім — або «не встановлено», коли закон жодного не визначає).","items":[{"id":"p-etatcivil","icon":"acte","titre":"Відновлення актів цивільного стану після позитивного рішення","intro":"Особа, яка отримала захист, більше не може звертатися до органів влади своєї країни походження. Саме OFPRA має відновити її акти цивільного стану — і без цих актів майже нічого неможливо зробити.","steps":[{"ic":"ofpraok","l":"Позитивне рішення OFPRA або CNDA"},{"ic":"actebarre","l":"Акти країни походження більше не можна використовувати"},{"ic":"form","l":"Заява про відновлення, подана до OFPRA"},{"w":true,"real":"≈ 9 місяців<br>(від 8 місяців до 1,5 року)","legal":""},{"ic":"acte","l":"Видані акти цивільного стану (мають силу автентичних документів)"},{"ic":"unlock","l":"Постійний документ, шлюб, банк… нарешті можливі"}],"constat":"Особа під захистом більше не може звертатися до органів країни свого походження. Саме OFPRA через свій підрозділ захисту <strong>оформлює, відновлює та підтримує в актуальному стані її цивільний стан</strong> і видає документи, що мають силу актів (свідоцтво про народження, про шлюб, сімейну книжку) — документи, які мають силу автентичних актів. Строки значно зросли: зі 141 дня у 2017 році до 240 днів у 2021 році, потім обсяг невирішених справ перевищив 31 500 наприкінці 2022 року. Ситуація поліпшилася з кінця 2023 року, але середній строк залишався на рівні 11,7 місяця у 2023 році, 10,8 місяця у 2024 році та 9,1 місяця у 2025 році, причому наприкінці 2024 року ще 59 860 справ очікували на розгляд. <strong>Жоден строк не є законодавчо обов'язковим для OFPRA</strong> для виконання цього завдання.","probleme":"Доки OFPRA не оформило акти, особа під захистом живе в сірій зоні: <strong>префектура не може видати остаточну посвідку на проживання, доки їй не передано акт цивільного стану</strong>; до цього додаються відкриття повноцінного банківського рахунку, підписання договору оренди, шлюб, сімейна книжка, окремі виплати. Державна рада (30 січня 2025 року) визнала, що довідки про продовження розгляду та статусу достатньо для здійснення основної частини прав; на практиці ж ця довідка часто залишається маловідомою чи погано прийнятою на стійках обслуговування (банки, роботодавці, орендодавці, CAF, France Travail, мерії), а біженець не має ані чіткого строку, ані дієвого шляху звернення.","propositions":[["Закріпити чіткий законний строк у 4 місяці","Доповнити статтю L121-9 CESEDA максимальним строком у <strong>чотири місяці</strong> (шість місяців для справ, що потребують додаткового розслідування чи легалізації іноземних актів) між повною заявою та видачею акта OFPRA — чіткий орієнтир, якого сьогодні не існує."],["Супроводити перевищення штрафною пенею та простим зверненням","Передбачити декретом звернення до суду для отримання припису про видачу зі штрафною пенею (ст. L911-1 і наст. CJA); створити на попередньому етапі цифрову скаргу до OFPRA, із підтвердженням отримання та відповіддю впродовж 15 днів, а також процедуру термінового розгляду з обґрунтованої причини (шлюб, народження, возз'єднання сім'ї, працевлаштування)."],["Посилити ресурси та завершити переведення в цифрову форму","Закріпити та збільшити штат офіцерів захисту, призначених для цивільного стану; узагальнити онлайн-подання та відстеження із захищеною цифровою видачею (акт із електронним підписом, що піддається перевірці); публікувати щокварталу відкриті показники (обсяг невирішених справ, середній строк, строк на рівні 9-го дециля)."],["Гарантувати повну обов'язковість довідки","Долучити до ст. L561-16 CESEDA текст, що нагадує: довідка про продовження розгляду та розписка мають силу підтвердження проживання та права на працю, і поширити міжвідомчу інструкцію, обов'язкову для банків (через ACPR), орендодавців, роботодавців, CAF і France Travail, що забороняє їм вимагати остаточний акт, коли надано довідку."],["Визнати доказову силу тимчасових документів","Уточнити в CESEDA та циркуляром (офіцери цивільного стану, префектури), що тимчасові документи та адміністративна довідка, видані OFPRA в очікуванні остаточного акта, мають достатню доказову силу для початку процедур цивільного життя — щоб очікування більше не паралізувало здійснення прав."],["Дати OFPRA ресурси для ліквідації черги","Зробити постійним і збільшити кількість офіцерів захисту, що опікуються актами цивільного стану, та профінансувати план ліквідації черги (майже 60 000 справ в очікуванні), щоб досягти обов'язкового цільового строку."]],"base":[["Стаття L121-9 CESEDA","OFPRA уповноважене видавати біженцям, особам, які користуються субсидіарним захистом, та особам без громадянства документи, необхідні для актів цивільного життя, зокрема документи, що мають силу актів цивільного стану. Його генеральний директор засвідчує ці акти, які мають силу автентичних актів і замінюють відсутність актів, виданих у країні походження. Текст не встановлює жодного строку оформлення."],["Стаття R121-35 CESEDA","Уточнює умови оформлення та видачі актів Управлінням і підтверджує їхню силу автентичних актів, причому Управління може виправляти лише суто матеріальні упущення та помилки. І тут жодного обов'язкового для OFPRA строку не передбачено."],["Стаття L561-16 CESEDA","В очікуванні остаточного встановлення свого цивільного стану OFPRA особа під захистом може просити надання прав, відкритих кодексами праці, соціального забезпечення, соціальної дії та сім'ї, а також будівництва та житла, на підставі складу сім'ї, врахованого під час розгляду заяви про надання притулку."],["Державна рада, об'єднані 2-а і 7-а палати, 30 січня 2025 року, № 495916 і 495917","Розглядаючи звернення GISTI та ADDE, з одного боку, та La Cimade, GAS, JRS France і LDH, з іншого боку, щодо мовчазної відмови вжити заходів для скорочення строків OFPRA, Державна рада відхилила позови. Вона зазначила, що строки почали зменшуватися від останнього кварталу 2023 року, скоротившись до менш ніж десяти місяців, і що статус особи під захистом у поєднанні з довідкою про продовження розгляду та правами, відкритими ст. L561-16, дозволяв здійснювати основну частину прав, прив'язаних до статусу."]],"chiffres":[["59 860","справ цивільного стану, що очікували на розгляд в OFPRA станом на 31 грудня 2024 року (обсяг невирішених справ перевищував 31 500 наприкінці 2022 року)"],["9,1 місяця","середній строк оформлення актів у 2025 році (275 днів), проти 10,8 місяця у 2024 році та 11,7 місяця у 2023 році"],["—","законний строк, обов'язковий сьогодні для OFPRA для оформлення актів цивільного стану"]],"sources":[["Article L121-9 du CESEDA — Légifrance","https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000042777575"],["Article L561-16 du CESEDA — Légifrance","https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000042775752"],["CE, 30 janvier 2025, n° 495916 (délais d'état civil OFPRA) — Légifrance","https://www.legifrance.gouv.fr/ceta/id/CETATEXT000051105650"],["Conseil d'État — Décision n° 495916 du 30 janvier 2025","https://www.conseil-etat.fr/fr/arianeweb/CE/decision/2025-01-30/495916"],["OFPRA — Bilan 2025 : une activité record et des évolutions contrastées","https://www.ofpra.gouv.fr/actualites/bilan-2025-de-lofpra-une-activite-record-et-des-evolutions-contrastees"],["La Cimade — Rapport d'activité OFPRA 2024","https://www.lacimade.org/rapport-dactivite-ofpra-2024-cartographie-de-la-demande-dasile/"]],"chips":["L121-9 CESEDA","R121-35","L561-16","CE 30 janv. 2025, 495916"]},{"id":"p-voyage","icon":"passport","titre":"Подорожі за межі Франції (туризм, відрядження, родина)","intro":"Для службового відрядження, туристичної подорожі чи відвідування близьких особа, яка отримала захист, не може використовувати паспорт своєї країни походження.","steps":[{"ic":"plane","l":"Намір подорожі (туризм, відрядження, родина)"},{"ic":"passportno","l":"Паспорт країни походження непридатний"},{"ic":"form","l":"Заява на проїзний документ (TIV / TVR) через ANEF"},{"w":true,"real":"8–10 місяців<br>за відгуками","legal":""},{"ic":"passport","l":"Проїзний документ видано"},{"ic":"planeok","l":"Подорож стає можливою"}],"constat":"<strong>Проїзний документ біженця</strong> (TVR), <strong>посвідчення особи та проїзний документ</strong> (TIV), що видається особам, які користуються субсидіарним захистом, і проїзний документ особи без громадянства — це захищені біометричні документи, які заміняють національний паспорт, який ці особи не можуть просити в країни свого походження. Заява подається виключно в цифровому вигляді, через ANEF. На відміну від строку дії та збору, встановлених законом, <strong>жоден текст не встановлює законного строку виготовлення чи видачі</strong>. На практиці префектури рекомендують подавати щонайменше за три місяці до виїзду й оголошують строки порядку 30–60 днів, без гарантій чи пріоритетного опрацювання; реальні строки подеколи значно більші, без організованої процедури термінового розгляду.","probleme":"Без чіткого строку особа під захистом не має жодної гарантії щодо дати, коли вона реально зможе подорожувати: відвідини близьких у третій країні, відрядження, медична потреба, смерть близької людини. <strong>Відсутність процедури термінового розгляду унеможливлює врахування невідкладних ситуацій.</strong> Рекомендація подавати «щонайменше за три місяці» покладає на особу ризик, який вона не контролює, тоді як вона за визначенням не може отримати паспорт країни свого походження — позбавляючи дієвості право, визнане законом.","propositions":[["Закріпити нормативний строк видачі в CESEDA","Доповнити нормативну частину CESEDA (довкола ст. R561-8) максимальним чітким строком виготовлення та видачі документа, встановленим у <strong>два місяці</strong> від подання повної заяви, узгодженим із практикою звичайного паспорта. За відсутності рішення передбачити обов'язкову точку контакту в префектурі та прискорене оскарження."],["Створити процедуру термінового розгляду з невідкладної причини","Запровадити терміновий шлях із видачею впродовж 5–10 робочих днів у разі обґрунтованої невідкладної причини (серйозна медична причина, смерть чи хвороба близького, невідкладна сімейна причина, датоване професійне зобов'язання), із переліком підтвердних документів і пріоритетним вікном — за моделлю термінового розгляду, що вже існує для паспорта та посвідчення особи (CNI)."],["Гарантувати онлайн-відстеження та опубліковані строки","Зробити обов'язковим в ANEF поетапне відстеження (подання, розгляд, виготовлення, надання) з позначкою часу та щоквартальну публікацію по кожній префектурі реальних середніх строків видачі — щоб зробити адміністрацію підзвітною та уможливити управління відхиленнями."],["Супроводити перевищення строку дієвими гарантіями","У разі перевищення з вини адміністрації передбачити штрафну пеню за повним правом у невідкладному провадженні перед адміністративним судом і можливість видати тимчасовий проїзний документ, що дозволяє вже заплановану подорож — на кшталт тимчасових документів, що існують у сфері проживання."],["Зменшити чи скасувати збір для найбільш незахищених","Внести зміни до пункту IV статті 953 CGI, щоб звільнити від гербового збору (45 € чи 40 €) осіб під захистом без ресурсів чи одержувачів соціального мінімуму, або запровадити знижений тариф, щоб вартість не була додатковою перешкодою для здійснення основоположного права."],["Забезпечити службу виготовлення достатніми ресурсами","Виділити службі, відповідальній за проїзні документи, персонал і біометричне обладнання, співмірні з попитом, щоб скоротити виготовлення до кількох тижнів."]],"base":[["Стаття L561-9 CESEDA — проїзний документ біженця","Іноземець, який має чинну посвідку на проживання та якому визнано статус біженця, може отримати «проїзний документ біженця», що дозволяє йому подорожувати за межами Франції, окрім невідкладних причин національної безпеки чи публічного порядку, за винятком держави чи держав, щодо яких побоювання переслідування визнано обґрунтованими. Жодного строку виготовлення чи видачі не встановлено."],["Стаття L561-10 CESEDA — посвідчення особи та проїзний документ","Особа, яка користується субсидіарним захистом, може отримати «посвідчення особи та проїзний документ», окрім невідкладних причин національної безпеки чи публічного порядку. Воно не дозволяє відвідувати державу чи держави, де заінтересована особа зазнала б серйозних посягань, зазначених у ст. L512-1. Жодного строку виготовлення чи видачі не встановлено."],["Статті L561-11, L561-12 і L561-13 CESEDA","Неповнолітня дитина особи під захистом може отримати проїзний документ за ст. L561-10 (L561-11). Строк дії документів, виданих на підставі ст. L561-9 — L561-11, встановлено в пункті IV статті 953 CGI (L561-12); жодного строку опрацювання там не передбачено. Документ може бути вилучено чи в його поновленні відмовлено з невідкладних причин національної безпеки чи публічного порядку (L561-13)."],["Стаття L582-7 CESEDA — проїзний документ особи без громадянства","Іноземець, визнаний особою без громадянства та власник чинної посвідки на проживання, може отримати «проїзний документ особи без громадянства», окрім невідкладних причин національної безпеки чи публічного порядку, причому строк його дії так само відсилається до пункту IV статті 953 CGI. Жодного строку виготовлення чи видачі не встановлено."],["Стаття 953, IV, Загального податкового кодексу","Встановлює строк дії та збір: документ, виданий біженцям, особам без громадянства чи особам, які користуються субсидіарним захистом та мають карту резидента, — дійсний 5 років, збір 45 €; документ, виданий особам без громадянства чи особам, які користуються субсидіарним захистом та мають чотирирічну багаторічну карту, — дійсний 4 роки, збір 40 €; посвідчення особи та проїзний документ, виданий іноземцю, який не користується захистом (напр., дитині), — дійсний 1 рік, збір 15 €. Жодне положення не встановлює строку видачі."],["Стаття R561-8 CESEDA","Уточнює документи, які слід подати (посвідка на проживання, дві регламентні фотографії, підтвердження місця проживання чи декларація про місце проживання). Текст встановлює умови подання, але жодного строку розгляду чи видачі документа."]],"chiffres":[["663 241","осіб під захистом OFPRA на кінець 2024 року (біженці, особи без громадянства, субсидіарний захист) — охоплена категорія"],["—","законний строк виготовлення чи видачі, встановлений для проїзного документа: жоден текст його не регламентує"],["3 місяці","мінімальний строк, лише рекомендований префектурами для подання до подорожі, без гарантії дотримання"]],"sources":[["CESEDA — Section 4 : Documents de voyage (L561-9 à L561-13) — Légifrance","https://www.legifrance.gouv.fr/codes/section_lc/LEGITEXT000006070158/LEGISCTA000042772564/"],["CESEDA — Apatridie, dont L582-7 — Légifrance","https://www.legifrance.gouv.fr/codes/section_lc/LEGITEXT000006070158/LEGISCTA000042772666/"],["CGI, article 953 (validité et taxe des titres de voyage) — Légifrance","https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000041466881"],["Réfugié : titre de séjour, document de voyage et accompagnement — service-public.gouv.fr","https://www.service-public.gouv.fr/particuliers/vosdroits/F15401"],["Demander un titre de voyage (dépôt ANEF, recommandation 3 mois) — Préfecture de la Gironde","https://www.gironde.gouv.fr/Demarches/Immigration-et-integration/Demander-un-document-de-voyage-delivre-par-la-France/Refugie-Protege-subsidiaire/Demander-un-titre-de-voyage-pour-etranger-beneficiaire-de-la-protection-internationale"],["Dématérialisation via l'ANEF : des ruptures de droits graves et massives — Défenseur des droits","https://www.defenseurdesdroits.fr/dematerialisation-des-demandes-de-titres-de-sejour-lanef-des-ruptures-de-droits-graves-et-massives"]],"chips":["L561-9 (TVR)","L561-10 (TIV)","L561-12","L582-7 (apatride)","CGI art. 953-IV","R561-8"]},{"id":"p-sejour","icon":"carte","titre":"Отримання посвідки на проживання після надання захисту","intro":"Одразу після рішення OFPRA або CNDA префектура має видати посвідку на проживання. Тим часом виплата допомоги часто припиняється.","steps":[{"ic":"ofpraok","l":"Позитивне рішення (OFPRA / CNDA)"},{"ic":"pauseada","l":"Допомога (ADA) припиняється — ризик періоду без засобів до існування"},{"w":true,"real":"часто > 3 місяців<br>(іноді 7 місяців і більше)","legal":"3 місяці"},{"ic":"carte","l":"Видано посвідку на проживання або картку резидента"}],"constat":"Щойно OFPRA чи CNDA надає захист, префект має нормативний строк <strong>три місяці</strong> для видачі посвідки на проживання. Біженці мають право на десятирічну карту резидента; особи, які користуються субсидіарним захистом, спершу отримують багаторічну карту строком щонайбільше чотири роки, а потім, після чотирьох років легального проживання, — десятирічну карту резидента. На практиці цей строк дуже часто перевищується, <strong>без жодної прив'язаної до цього санкції</strong>. Під час поновлення опрацювання через цифрову платформу ANEF породжує перерви в правах, задокументовані Захисником прав, Державною радою та об'єднаннями.","probleme":"Тримісячний строк позбавлений примусової сили: його перевищення не наражає адміністрацію на жодні санкції. Під час поновлення проходження через ANEF, яке стало загальним каналом за замовчуванням, спричиняє перерви в правах — посвідка, строк якої сплив, без довідки про продовження, втрата роботи, житла та виплат. <strong>Право подати заяву та право на довідку, що покриває всю сукупність прав (проживання, праця, виплати), не гарантовано дієвим чином.</strong>","propositions":[["Зробити тримісячний строк чітким і караним","Доповнити статті R. 424-1 і R. 424-7 CESEDA: за відсутності видачі впродовж трьох місяців довідка, що має силу посвідки на проживання (відкриваючи право на працю та виплати), видається за повним правом, з автоматичною штрафною пенею, що сплачується заінтересованій особі в разі невиправданого перевищення (за моделлю невідкладного провадження щодо корисних заходів, ст. L. 521-3 CJA)."],["Автоматично видавати довідку, що покриває всі права","Внести зміни до статті R. 431-15-1 CESEDA, щоб довідка про продовження розгляду генерувалася автоматично системою ANEF одразу після подання повного комплекту, прямо зазначала право на проживання, працю та виплати й автоматично поновлювалася — відповідно до припису Державної ради від 5 травня 2026 року (№ 502860)."],["Автоматично продовжувати дійсність посвідки на час розгляду","Передбачити декретом, що посвідка особи під захистом, яка подала заяву про поновлення у строк, залишається дійсною до прямо вираженого рішення префектури, без умови щодо вікна подання чи додаткових дій — усуваючи будь-який розрив між закінченням строку посвідки та довідкою."],["Гарантувати право подати заяву та доступ до запису на прийом","Зробити дієвим альтернативне рішення (декрет № 2023-191 від 22 березня 2023 року): особистий прийом упродовж 30 днів у разі неможливості скористатися ANEF, позначена часом простежуваність спроб, полегшений доступ до судді невідкладного провадження щодо корисних заходів (у руслі CE, 18 лютого 2022 року, № 455740)."],["Зробити ANEF надійним і публікувати показники","Виконати приписи Державної ради (№ 502860): одночасне подання на різних підставах, виправлення справ, припинення відмов, безпідставно обґрунтованих неповерненням попередньої посвідки. Публікувати по кожній префектурі середній строк і рівень дотримання тримісячного строку, із комітетом моніторингу."],["Посилити відділи у справах іноземців у префектурах","Зробити постійним і розширити оголошений план на 500 працівників: найняти штатних співробітників до відділів «séjour» префектур із багаторічним фінансуванням, щоб розвантажити черги та дотримуватися тримісячного строку."]],"base":[["Стаття R424-1 CESEDA","Префект здійснює видачу карти резидента (ст. L. 424-1 або L. 424-3) у строк три місяці від рішення про визнання статусу біженця OFPRA чи CNDA. Цей строк не супроводжується жодною санкцією в разі перевищення."],["Стаття R424-7 CESEDA","Префект здійснює видачу багаторічної посвідки на проживання (ст. L. 424-9 або L. 424-11) у строк три місяці від рішення про надання субсидіарного захисту. Як і для біженців, цей строк не супроводжується жодною санкцією."],["Статті L424-1, L424-4, L424-9, L424-13 CESEDA","Біженець отримує десятирічну карту резидента (L. 424-1); L. 424-4 відсилає до декрету щодо строку видачі (конкретизованого в R. 424-1). Особа, яка користується субсидіарним захистом, отримує багаторічну карту максимальною тривалістю чотири роки (L. 424-9), а потім, після чотирьох років легального та безперервного проживання, — десятирічну карту резидента (L. 424-13), за умови, зокрема, відсутності загрози публічному порядку."],["Статті R431-15-1 і R431-5 CESEDA","Подання через електронну послугу зумовлює видачу довідки про подання, яка не підтверджує законності проживання. Коли розгляд повної заяви триває довше за закінчення строку посвідки, префект надає довідку про продовження розгляду (API), дійсну щонайбільше три місяці та з можливістю поновлення (R. 431-15-1). Заяву про поновлення слід подати між 120-м і 60-м днем до закінчення строку (R. 431-5); поза цим вікном збереження прав не гарантовано."],["CE, Секція, 3 червня 2022 року, № 452798","Державна рада скасовує декрет, що робить обов'язковим звернення до ANEF, оскільки він не передбачає альтернативного рішення: адміністрація має передбачити супровід і нецифровий шлях, коли користувач опиняється в неможливості скористатися електронною послугою."],["CE, 5 травня 2026 року, № 502860","Державна рада зобов'язує державу усунути збої ANEF: упродовж шести місяців — забезпечити своєчасне надання чи поновлення довідок про продовження розгляду та зазначити в них прив'язані права (зокрема право на працю), уможливити доповнення справ, припинити відмови, безпідставно обґрунтовані неповерненням попередньої посвідки; упродовж дванадцяти місяців — уможливити одночасне подання заяв на різних підставах."]],"chiffres":[["3 місяці","Нормативний строк видачі після рішення OFPRA/CNDA (ст. R. 424-1 і R. 424-7 CESEDA), без дієвих санкцій"],["28 %","Частка скарг 2023 року до Захисника прав, що стосуються права іноземців; понад 75 % спрямовані проти префектур"],["6–12 місяців","Строки, надані державі Державною радою (5 травня 2026 року, № 502860) для усунення збоїв ANEF"]],"sources":[["CESEDA — Section 1 : Réfugiés (R424-1 et s.) — Légifrance","https://www.legifrance.gouv.fr/codes/section_lc/LEGITEXT000006070158/LEGISCTA000042801156/"],["CESEDA — Section 2 : Protection subsidiaire (R424-7 et s.) — Légifrance","https://www.legifrance.gouv.fr/codes/section_lc/LEGITEXT000006070158/LEGISCTA000042801170/"],["CESEDA — Titres de séjour des bénéficiaires d'une protection (L424-1 et s.) — Légifrance","https://www.legifrance.gouv.fr/codes/section_lc/LEGITEXT000006070158/LEGISCTA000042771756/"],["Décret n° 2023-191 du 22 mars 2023 — Légifrance","https://www.legifrance.gouv.fr/jorf/id/JORFTEXT000047332636"],["CE, Section, 3 juin 2022, n° 452798 — Légifrance","https://www.legifrance.gouv.fr/ceta/id/CETATEXT000045863484"],["Défenseur des droits — Rapport sur l'ANEF (11 décembre 2024)","https://www.defenseurdesdroits.fr/atteintes-aux-droits-des-etrangers-le-defenseur-des-droits-publie-un-rapport-sur-ladministration"],["Conseil d'État — Accès normal à la plateforme ANEF (5 mai 2026, n° 502860)","https://www.conseil-etat.fr/actualites/services-publics-le-conseil-d-etat-enjoint-a-l-etat-de-garantir-un-acces-normal-a-la-plateforme-en-ligne-de-l-anef"]],"chips":["R424-1 CESEDA","R424-7","L424-1 / L424-13","R431-15-1","CE 452798","CE 502860"]},{"id":"p-naturalisation","icon":"flagfr","titre":"Стати французом: натуралізація","intro":"Через кілька років особа, яка отримала захист, може подати заяву на французьке громадянство. Закон встановлює строк… але момент його відліку можна відкладати безкінечно.","steps":[{"ic":"form","l":"Подання повного пакета документів через ANEF"},{"ic":"recepisse","l":"Розписка про повноту документів — вона (теоретично) запускає відлік строку"},{"w":true,"real":"3–4 роки<br>(часто)","legal":"18 місяців"},{"ic":"decision","l":"Рішення — мовчання адміністрації означає відмову"},{"ic":"flagfr","l":"Натуралізація"}],"constat":"Стаття 21-25-1 Цивільного кодексу зобов'язує орган публічної влади відповісти на заяву про натуралізацію у строк <strong>вісімнадцять місяців</strong> (дванадцять місяців для іноземця, який постійно проживає у Франції щонайменше десять років), який може бути продовжено лише один раз на три місяці вмотивованим рішенням. Але цей строк відлічується лише від моменту подання всіх документів повного комплекту, «проти якого негайно видається розписка». Натомість стаття 37-1 декрету № 93-1362 передбачає, що ця розписка видається «одразу після подання документів», <strong>не супроводжуючи цей обов'язок жодним кількісно визначеним строком чи санкцією</strong>. На практиці видачу розписки відтерміновують або й узагалі не здійснюють — що Захисниця прав кваліфікувала як неналежне функціонування публічної служби (рішення № 2024-025 від 19 лютого 2024 року). У 2024 році французьке громадянство набули 103 661 особа, з них 48 494 шляхом натуралізації.","probleme":"Законний строк майже завжди обходиться за допомогою простого механізму: доки розписку про повноту комплекту не видано, відлік вісімнадцяти місяців не починається. Заявник залишається в очікуванні без юридичного завершення. Коли строк нарешті спливає, мовчання адміністрації означає <strong>мовчазну відмову</strong> — а не згоду: бездіяльність держави обертається проти користувача. Єдиний реальний засіб захисту — звернутися до міністра (RAPO), а потім до адміністративного суду Нанта (Tribunal administratif de Nantes), щоб зобов'язати ухвалити рішення — додає кілька місяців, а то й років, та потребує оплати адвоката.","propositions":[["Запустити відлік строку від подання повного комплекту на ANEF","Внести зміни до статті 21-25-1 Цивільного кодексу, щоб строк у 18 місяців (12 місяців) відлічувався від онлайн-подання повного комплекту документів, причому позначене часом підтвердження реєстрації мало б силу розписки про повноту комплекту. За відсутності цього — обмежити видачу розписки коротким і чітким строком (наприклад, 30 днів) у статті 37-1 декрету № 93-1362."],["Зробити перевищення строку справді караним","Понад недотриманий строк, дозволити звернення до судді невідкладного провадження для отримання припису ухвалити рішення з накладенням штрафної пені (наприклад, 100 € за кожен день прострочення), за рахунок держави. Розглянути пом'якшення умов прийнятності позову в разі тривалої бездіяльності."],["Запровадити обов'язкове прямо виражене та вмотивоване рішення","Обмежити застосування мовчазної відмови: кожна повна заява мала б отримати прямо виражене та вмотивоване рішення в межах законного строку. Заява, що залишилася без повідомленого рішення, вважалася б прийнятною, без шкоди для перевірки умов по суті — усуваючи шкідливий ефект мовчання, що означає відмову."],["Створити прискорену процедуру лише для спорів щодо строків","Запровадити в адміністративному суді Нанта окрему та прискорену процедуру (одноосібний суддя, упродовж кількох місяців), обмежену спорами щодо перевищення строків і невидачі розписки, відмінну від спорів по суті."],["Зробити строк прозорим і відстежуваним онлайн","Відображати в особистому кабінеті ANEF дату повноти комплекту, застосовний законний строк, лічильник часу, що залишився, та етап розгляду; публікувати щокварталу реальні строки та обсяг невирішених справ SDANF, а також збільшувати штат пропорційно кількості поданих заяв."],["Дати SDANF ресурси, щоб дотримуватися строку","Строк має сенс лише тоді, коли адміністрація здатна його дотримати. Ухвалити багаторічний план найму інструкторів до підвідділу доступу до французького громадянства (SDANF) з окремим фінансуванням, розрахованим на реальну кількість справ, — щоб ліквідувати чергу, а не лише зробити строк обов'язковим."]],"base":[["Стаття 21-25-1 Цивільного кодексу","«Відповідь органу публічної влади на заяву про набуття французького громадянства шляхом натуралізації має надійти не пізніше ніж за вісімнадцять місяців від моменту подання всіх документів, необхідних для формування повного комплекту, проти якого негайно видається розписка.» Цей строк скорочується до дванадцяти місяців для іноземця, який підтверджує постійне проживання у Франції щонайменше десять років, і може бути продовжено лише один раз, вмотивованим рішенням, на три місяці. Точкою відліку є подання документів (розписка про повноту комплекту), а не дата подання."],["Стаття 37-1 декрету № 93-1362 від 30 грудня 1993 року","У чинній редакції (декрет № 2024-108 від 14 лютого 2024 року, застосовний до заяв, поданих від 1 січня 2026 року) вона передбачає: «Одразу після подання передбачених вище документів орган, до якого подано заяву, видає розписку, передбачену статтею 21-25-1 Цивільного кодексу.» Проте жодне положення не встановлює максимального кількісно визначеного та чіткого строку для цієї видачі, що дозволяє фактично відтерміновувати точку відліку законного строку розгляду."],["Мовчання, що означає відмову — ст. L. 231-4 CRPA","Як виняток із принципу «мовчання означає згоду» (ст. L. 231-1 Кодексу відносин між населенням та адміністрацією), мовчання щодо заяви про натуралізацію декретом означає мовчазне рішення про відмову. Так само мовчання міністра впродовж чотирьох місяців щодо обов'язкового попереднього адміністративного оскарження (RAPO) означає відмову."],["Юрисдикція та засоби оскарження","Несприятливе рішення спершу слід оскаржити через RAPO до міністра, відповідального за натуралізації (строк: 2 місяці); його відмову потім можна оскаржити в адміністративному суді Нанта, єдиному компетентному на національному рівні щодо спорів, пов'язаних з Підрозділом доступу до французького громадянства (SDANF), у строк 2 місяці. Суд може зобов'язати ухвалити рішення, за потреби — з накладенням штрафної пені."]],"chiffres":[["18 місяців","Максимальний законний строк відповіді (12 місяців за наявності 10 років проживання) — ст. 21-25-1 Цив. кодексу"],["3–4 роки","Реальна тривалість, що часто спостерігається, оскільки точку відліку строку відтерміновано (Захисник прав, 2022)"],["48 494","Натуралізацій у 2024 році, із 103 661 набуттів громадянства (+6,6 % за рік)"]],"sources":[["Article 21-25-1 du Code civil — Légifrance","https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000006419662"],["Article 37-1 du décret n° 93-1362 — Légifrance","https://www.legifrance.gouv.fr/loda/article_lc/LEGIARTI000051906775"],["Décision du Défenseur des droits n° 2024-025 du 19 février 2024","https://juridique.defenseurdesdroits.fr/index.php?lvl=notice_display&id=49828"],["Naturalisation par décret : délais et recours — service-public.gouv.fr","https://www.service-public.gouv.fr/particuliers/vosdroits/F2213"],["Intégration et accès à la nationalité — chiffres 2024 (ministère de l'Intérieur)","https://www.immigration.interieur.gouv.fr/fr/Info-ressources/Etudes-et-statistiques/Les-chiffres-de-l-immigration-en-France/Integration-et-l-acces-a-la-nationalite-francaise"],["Rapport du Défenseur des droits, « Devenir français par naturalisation » (2022)","https://www.defenseurdesdroits.fr/fr/rapports/2022/02/rapport-devenir-francais-par-naturalisation-recommandations-visant-a-faire"]],"chips":["Art. 21-25-1 C. civ.","Art. 37-1 décret 93-1362","Art. L. 231-4 CRPA","TA de Nantes"]},{"id":"reunification-familiale-dcem","icon":"family","titre":"Привезти своїх дітей і забезпечити їм можливість пересуватися: возз'єднання сім'ї та проїзний документ (DCEM)","intro":"Особа, визнана біженцем або яка отримала додатковий захист, має право привезти свою родину, що залишилася за кордоном (возз'єднання сім'ї), без умов щодо доходів, житла чи тривалості перебування. Щойно родина опиняється у Франції, неповнолітня дитина-іноземець потребує проїзного документа (DCEM), щоб виїжджати за межі Франції та повертатися без візи. На папері ці права є чіткими. На практиці все часто застрягає в одному й тому ж місці: на цивільному стані. Консульства та префектури вимагають свіжі свідоцтва про народження (іноді «не старші 3 місяців»), які захищена особа за визначенням не може запросити в органів країни, з якої вона втекла. Тож вона залежить від відновлення свого цивільного стану OFPRA, реальні строки якого обчислюються місяцями, при цьому жоден законний строк не є обов'язковим для адміністрації.","steps":[{"ic":"ofpraok","l":"Захист надано (статус OFPRA/CNDA)"},{"ic":"form","l":"Заява на возз'єднання сім'ї (віза в консульстві) або на DCEM (префектура, онлайн через ANEF)"},{"ic":"acte","l":"OFPRA відновлює цивільний стан і засвідчує склад сім'ї"},{"ic":"warning","l":"Перешкода: вимагається «свіже» свідоцтво про народження, яке неможливо отримати від країни походження"},{"w":true,"real":"Возз'єднання сім'ї: візу часто видають за 3–8 місяців,<br>строк збільшується, коли цивільний стан ще не встановлено (відновлення OFPRA ~6–12 місяців).<br>DCEM: 2–4 місяці за фактичними спостереженнями в префектурі.","legal":"DCEM: «Не встановлено» (жодного обов'язкового строку видачі).<br>Возз'єднання: жодного строку, встановленого CESEDA."},{"ic":"check","l":"Документ видано / родину возз'єднано"}],"constat":"Право є щедрим, але доступ задушений адміністративним вузьким місцем: цивільним станом. Возз'єднання сім'ї біженців не залежить ні від доходів, ні від житла (CESEDA ст. L561-2), а DCEM видається дитині за правом. Але консульства, мерії та префектури вимагають свіжі акти цивільного стану, які захищена особа не може отримати від країни свого походження, не наражаючись на небезпеку та не втрачаючи самого сенсу свого захисту. Тож вона повністю залежить від відновлення свого цивільного стану OFPRA, строки якого подвоїлися за п'ять років (177 днів у 2019 році, 240 днів у 2021 році), сягаючи місцями до одного року. Тим часом жоден законний строк не є обов'язковим: мовчання адміністрації не тягне за собою жодної дієвої санкції, а родини залишаються розділеними місяцями.","probleme":"Вимога свідоцтва про народження «не старшого 3 місяців» на практиці неможлива для виконання захищеною особою: вона не може звернутися до органів країни, з якої втекла, а її французький цивільний стан залежить від відновлення OFPRA з довгими й нерегламентованими строками. Результатом є замкнене блокування: префектура чи консульство чекає документ, який може видати лише OFPRA, OFPRA витрачає кілька місяців, і жоден обов'язковий законний строк не дозволяє розблокувати ситуацію. Діти залишаються розділеними з одним із батьків або не можуть ні подорожувати, ні відвідувати родину через відсутність DCEM.","chiffres":[["—","Обов'язковий законний строк видачі DCEM"],["~6–12 місяців","Реальне відновлення цивільного стану OFPRA"],["2 місяці","Строк, після якого мовчання означає відмову (DCEM)"]],"propositions":[["Заборонити вимогу «свіжих» актів до захищених осіб","Поширити національну інструкцію, що нагадує: акти, складені OFPRA, мають силу автентичних документів і жодна свіжість («менше 3 місяців») не може вимагатися від захищеної особи."],["Запровадити обов'язковий строк для відновлення OFPRA","Встановити максимальний регламентний строк опрацювання цивільного стану з тимчасовою довідкою, обов'язковою для префектур і консульств у цей проміжок."],["Посилити ресурси відділу цивільного стану OFPRA","Збільшити штат і виділений бюджет, щоб ліквідувати чергу та повернути строки нижче 3 місяців, оскільки кількість захищених осіб значно зросла."],["Визнати тимчасову довідку достатнім документом","Дозволити за правом розгляд заяви на візу для возз'єднання або на DCEM на підставі тимчасової довідки про склад сім'ї, не чекаючи остаточного акта."],["Чітка інформація та супровід","Надати на service-public.gouv.fr та в префектурах єдину пам'ятку, що пояснює послідовність OFPRA → консульство → префектура та шляхи оскарження."],["Полегшити та роз'яснити оскарження","Систематично нагадувати у разі відмови у візі про обов'язок звернутися до Комісії з оскарження відмов у видачі віз (CRRV) протягом 30 днів перед адміністративним судом Нанта."]],"base":[["CESEDA, ст. L561-2","До біженця або бенефіціара додаткового захисту можуть приєднатися його чоловік/дружина/партнер і діти, без умов щодо тривалості перебування, доходів чи житла (окрім загрози громадському порядку)."],["CESEDA, ст. R561-1 — R561-3","Заява на візу для членів сім'ї подається до консульського органу, який запитує в OFPRA засвідчення складу сім'ї та цивільного стану біженця."],["CESEDA, ст. D414-1 — D414-4","Проїзний документ для неповнолітнього іноземця (DCEM) видається префектом за заявою особи, яка здійснює батьківські права, на строк не більше 5 років."],["CESEDA, ст. L121-13 / L561-2","Акти цивільного стану, складені OFPRA для захищених осіб, мають силу автентичних документів."]],"chips":["CESEDA art. L561-2","CESEDA art. R561-1","CESEDA art. R561-3","CESEDA art. D414-1","CESEDA art. D414-4"],"sources":[["Légifrance — CESEDA, возз'єднання сім'ї (ст. L561-2 — L561-5)","https://www.legifrance.gouv.fr/codes/section_lc/LEGITEXT000006070158/LEGISCTA000042772546/"],["Légifrance — CESEDA, проїзні документи для неповнолітніх іноземців (ст. D414-1 — D414-4)","https://www.legifrance.gouv.fr/codes/section_lc/LEGITEXT000006070158/LEGISCTA000042800892/"],["OFPRA — відновлення актів цивільного стану","https://www.ofpra.gouv.fr/en/folder/institutions/civil-status-reconstitution"],["Sénat — строки відновлення та видачі актів цивільного стану (возз'єднання сім'ї)","https://www.senat.fr/questions/base/2022/qSEQ220700483.html"]]},{"id":"droit-au-compte","icon":"bank","titre":"Відкрити банківський рахунок: право на рахунок","intro":"Мати поточний рахунок необхідно для отримання допомоги, зарплати, оплати оренди чи оформлення підписки. Проте через відсутність стабільного трудового договору, підтвердження постійного місця проживання чи банківської історії у Франції багатьом захищеним особам (зокрема бенефіціарам тимчасового захисту з України) банки відмовляють у відкритті рахунку. Французьке право передбачає відповідь на цю ситуацію: «право на рахунок». Будь-яка особа, що проживає у Франції та якій відмовлено у відкритті рахунку, може звернутися до Banque de France, яка тоді в обов'язковому порядку призначає установу, зобов'язану відкрити рахунок безкоштовно з базовими банківськими послугами. Цей маршрут описує процедуру, її теоретичні строки та розбіжності, що спостерігаються на практиці.","steps":[{"ic":"euro","l":"Потреба в поточному рахунку"},{"ic":"warning","l":"Відмова або обмеження з боку банку (немає безстрокового договору / місця проживання)"},{"ic":"form","l":"Звернення до Banque de France у межах права на рахунок"},{"ic":"bank","l":"Призначення установи в обов'язковому порядку"},{"w":true,"real":"Змінно: призначення часто відбувається швидко, але фактичне відкриття зазнає частих відтермінувань — запити додаткових документів, перенесені зустрічі.<br>Регулярно повідомляється про строки очікування в кілька тижнів.","legal":"1 робочий день на призначення, потім 3 робочі дні на відкриття рахунку призначеним банком (з моменту отримання документів)"},{"ic":"check","l":"Рахунок відкрито з безкоштовними базовими банківськими послугами"}],"constat":"Закон чіткий і захисний: щойно до Banque de France звернулися, відкриття рахунку — це вже не послуга, а обов'язок для призначеного банку, у короткі строки (1 робочий день на призначення, 3 робочі дні на відкриття). На папері жодна особа, що проживає у Франції, не повинна залишатися без рахунку.","probleme":"Насправді ж маршрут залишається сповненим перешкод. Багато людей навіть не знають про існування права на рахунок; відділення іноді відсилають до процедури, не пояснюючи її. На етапі фактичного відкриття спостерігаються повторювані запити підтвердних документів (місце проживання, особа), перенесені зустрічі та рахунки, відкриті за мінімумом, іноді закриті невдовзі по тому. Базові банківські послуги, без овердрафту чи звичайної чекової книжки, не завжди дозволяють вести нормальне економічне життя (орендодавець чи роботодавець може бути насторожений). Мовний бар'єр і адміністративна складність поглиблюють розрив між законним строком у 3 робочі дні та строком, пережитим насправді.","chiffres":[["1 день","робочий — на призначення банку з боку Banque de France"],["3 дні","робочі — на відкриття рахунку призначеним банком"],["12","безкоштовних базових банківських послуг гарантовано"]],"propositions":[["Систематичне інформування про право на рахунок","Видавати при будь-якій відмові у відкритті письмову багатомовну пам'ятку, що пояснює звернення до Banque de France, і зробити це рефлексом у відділенні."],["Спеціальний супровід для захищених осіб","Залучати соціальних працівників (вже уповноважених звертатися до Banque de France) та асоціації для формування справ і відстеження строків аж до фактичного відкриття."],["Забезпечити дотримання строку в 3 робочі дні","Запровадити відстеження відтермінувань і простий механізм сигналізування (Banque de France, ACPR, Захисник прав), коли призначений банк затримує понад законний строк."],["Роз'яснити перелік необхідних документів","Поширити типовий перелік прийнятних підтвердних документів (посвідка на проживання / тимчасовий захист, довідка про місце проживання), щоб уникнути необґрунтованих вимог документів."],["Посилити ресурси прийому","Найняти та навчити багатомовних співробітників і медіаторів у Banque de France та в мережах допомоги, а також фінансувати структури реєстрації місця проживання, щоб опрацьовувати потоки та зменшувати реальні строки."],["Розширити корисність базових послуг","Заохочувати банки пропонувати, окрім мінімальних послуг, платіжні рішення, реально придатні для житла та працевлаштування."]],"base":[["CMF ст. L312-1, I","Будь-яка фізична або юридична особа, що проживає у Франції, має право на відкриття поточного рахунку в кредитній установі за своїм вибором."],["CMF ст. L312-1, II","У разі відмови особа може звернутися до Banque de France, яка призначає кредитну установу протягом одного робочого дня з моменту отримання необхідних документів."],["CMF ст. L312-1, III","Призначена установа зобов'язана відкрити рахунок протягом трьох робочих днів з моменту отримання всіх документів."],["CMF ст. D312-5","Призначена установа безкоштовно надає базові банківські послуги (дванадцять послуг, передбачених декретом)."]],"chips":["CMF art. L312-1","CMF art. D312-5","Charte d'accessibilité bancaire"],"sources":[["Banque de France — як реалізувати право на рахунок","https://www.banque-france.fr/fr/a-votre-service/particuliers/faire-valoir-droit-au-compte-bancaire"],["Légifrance — Валютно-фінансовий кодекс, стаття L312-1","https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000044605348/"],["economie.gouv.fr — процедура права на рахунок (DAC)","https://www.economie.gouv.fr/particuliers/gerer-mon-argent/gerer-mon-budget-et-mon-epargne/comment-utiliser-la-procedure-de-droit-au-compte-dac-pour-ouvrir-un-compte-bancaire"],["ABE Infoservice — право на рахунок","https://www.abe-infoservice.fr/fr/banque/droit-au-compte"]]},{"id":"se-loger-logement-social","icon":"house","titre":"Знайти житло: соціальне житло та вихід із притулку","intro":"Отримавши захист, багато біженців живуть в екстреному притулку чи тимчасовому житлі. Щоб отримати доступ до постійного житла, основний шлях — це заява на соціальне житло, зареєстрована під «єдиним номером». Але пропозиція значно менша за попит: очікування часто обчислюється місяцями, а то й роками, тоді як місце в притулку, своєю чергою, може бути поставлене під сумнів. Цей маршрут описує етапи, реальні спостережувані строки та права, що захищають особу під час очікування, зокрема право на житло, що підлягає примусовому виконанню (DALO).","steps":[{"ic":"house","l":"Потреба в житлі / завершення екстреного притулку"},{"ic":"form","l":"Заява на соціальне житло (єдиний номер)"},{"ic":"recepisse","l":"Довідка про реєстрацію (протягом місяця)"},{"w":true,"real":"Від кількох місяців до кількох років<br>залежно від території та складу сім'ї","legal":"«Аномально довгий строк», встановлений наказом префекта, варіюється залежно від департаменту (напр. 24 місяці, 36 місяців)"},{"ic":"warning","l":"Ризик змушеного виходу з притулку до переселення"},{"ic":"check","l":"Пропозиція житла (або звернення DALO)"}],"constat":"Заява на соціальне житло спирається на чіткий механізм, що підлягає примусовому виконанню: реєстрація, єдиний номер, довідка протягом місяця та право на звернення (DALO), якщо очікування перевищує «аномально довгий строк». На папері збереження місця в екстреному притулку гарантоване доти, доки не запропоновано жодного придатного рішення.","probleme":"На практиці розрив між пропозицією та попитом на соціальне житло робить очікування дуже довгим, без універсального законного граничного строку. «Аномально довгий строк» варіюється від департаменту до департаменту й відкриває лише право на звернення, а не негайне житло. Передусім напруга з місцями в притулках призводить до припинення опіки, коли особу ще не переселено: принцип безперервності притулку (CASF ст. L345-2-3) є хитким через брак місць, наражаючи на фактичне повернення на вулицю.","chiffres":[["1 місяць","законний строк для отримання довідки з єдиним номером (CCH ст. L441-2-1)"],["3 місяці","строк для переселення після позитивного рішення DALO (6 місяців у заморських територіях та великих агломераціях)"],["—","жодного гарантованого національного строку надання соціального житла"]],"propositions":[["Убезпечити збереження місця в притулку","Дієво гарантувати принцип безперервності (CASF ст. L345-2-3): жодного припинення опіки без запропонованого придатного рішення та без повернення на вулицю."],["Інформування з моменту надання захисту","Супроводжувати кожну захищену особу при поданні заяви на соціальне житло та отриманні єдиного номера без зволікань, зрозумілою мовою."],["Краще ознайомлювати з DALO","Систематично інформувати про мирне звернення до комісії з медіації, щойно досягнуто аномально довгого строку, та про судове оскарження."],["Уніфікувати «аномально довгі строки»","Зменшити розбіжності між департаментами та чітко публікувати наказ префекта, застосовний до кожної території."],["Посилити ресурси: пропозицію та супровід","Збільшити квоту мобілізовуваного житла (префектурна квота, Action Logement) та фінансувати соціальних працівників і асоціації супроводу до житла та в житлі."],["Поєднати притулок і переселення","Спростити перехід від притулку до житла (орендне посередництво, перехідний договір оренди), щоб уникнути розривів у маршруті."]],"base":[["CCH ст. L441-2-1","Будь-яка заява на соціальне житло реєструється та породжує єдиний національний номер; довідка видається протягом місяця; жодного надання житла без реєстрації та єдиного номера."],["CCH ст. L300-1 (закон № 2007-290 від 5 березня 2007 року)","Право на гідне та незалежне житло гарантується державою кожній особі, що проживає на законних підставах і не може отримати доступ до нього чи зберегти його власними засобами (DALO)."],["CCH ст. L441-2-3","До комісії з медіації може без зволікань звернутися заявник, який не отримав придатної пропозиції по закінченні аномально довгого строку, встановленого префектом; після цього префект зобов'язаний переселити бенефіціара, визнаного пріоритетним."],["CASF ст. L345-2-3","Будь-яка особа, прийнята в екстрений притулок, має мати змогу залишатися в ньому, доки вона того бажає, до спрямування до придатного рішення (принцип безперервності)."]],"chips":["CCH art. L441-2-1","CCH art. L300-1","CCH art. L441-2-3","Loi n° 2007-290 du 5 mars 2007","CASF art. L345-2-3","CASF art. L345-2-2"],"sources":[["Légifrance — CCH ст. L441-2-1 (єдиний номер)","https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000033971871"],["Légifrance — Закон № 2007-290 від 5 березня 2007 р. (DALO)","https://www.legifrance.gouv.fr/loda/id/JORFTEXT000000271094"],["ANIL — право на житло, забезпечене судовим захистом (DALO): умови та строки","https://www.anil.org/votre-projet/vous-etes-locataire/locataire-en-difficulte/droit-au-logement-et-a-lhebergement-opposable/"],["Légifrance — CASF ст. L345-2-2 (безумовний прийом)","https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000037670338"]]},{"id":"importer-immatriculer-vehicule","icon":"car","titre":"Ввезти та зареєструвати свій автомобіль: від іноземного номерного знака до французького техпаспорта","intro":"Особа, яка прибула до Франції зі своїм автомобілем або купує його за кордоном, має зареєструвати його у Франції. Маршрут поєднує податкову (податкове підтвердження quitus fiscal), іноді технічне затвердження (DREAL), а потім онлайн-заяву на техпаспорт (ANTS). На практиці це низка незалежних інстанцій, кожна зі своїми строками, без гарантованого загального графіка. Тим часом автомобіль усе ще їздить з іноземним номерним знаком, що привертає поліцейські перевірки.","steps":[{"ic":"car","l":"Автомобіль, зареєстрований за кордоном"},{"ic":"form","l":"Податкове підтвердження (quitus fiscal) у податковій службі (SIE)"},{"ic":"decision","l":"Затвердження / відповідність DREAL за потреби (RTI або COC)"},{"ic":"form","l":"Заява на реєстрацію через ANTS"},{"w":true,"real":"Quitus fiscal: 1–2 тижні<br>RTI DREAL (поза ЄС): від кількох тижнів до кількох місяців<br>Техпаспорт ANTS: 1–5 тижнів після укомплектування справи<br>Часто загалом: кілька місяців","legal":"Заяву слід подати протягом місяця після придбання (C. route ст. R322-2). Жодного обов'язкового загального строку завершення всього маршруту ввезення: «Не встановлено»"},{"ic":"check","l":"Французький техпаспорт видано та номерний знак FR встановлено"}],"constat":"Маршрут працює, коли надходить кожен документ: податкове підтвердження (quitus fiscal) від податкової, сертифікат відповідності (COC) чи окреме затвердження (RTI) від DREAL, потім техпаспорт від ANTS. Закон таки встановлює строк в один місяць для подання заяви після придбання, але жоден орган не зобов'язаний дотримуватися загального строку для завершення всього процесу. Заявник залежить від трьох окремих адміністрацій, які між собою не координуються.","probleme":"Протягом цього роздробленого маршруту автомобіль залишається з іноземним номерним знаком і надалі перевіряється поліцією та жандармерією, які цілеспрямовано виявляють саме такі знаки (підозра у відсутності реєстрації, страхування чи техогляду). Заявник, попри свою добросовісність та вже розпочаті ним кроки, наражається на фіксований штраф у 135 € та можливе затримання автомобіля — без жодного загального законного строку, що захищав би його, доки інстанції не дали відповіді. Тимчасовий сертифікат «WW» (дійсний 4 місяці) існує, щоб заповнити цю прогалину, але про нього мало хто знає, і він видається лише після того, як справу в ANTS уже подано.","chiffres":[["1 місяць","законний строк для подання заяви після придбання (C. route R322-2)"],["—","жодного загального законного строку для повного завершення маршруту ввезення"],["135 €","фіксований штраф, що загрожує у разі руху без французької реєстрації у встановлені строки"]],"propositions":[["Єдина інстанція для ввезення","Зробити ANTS єдиною точкою входу, яка ланцюгово запускає податкове підтвердження (quitus fiscal) і, за потреби, звернення до DREAL, замість трьох окремих кроків, які треба ініціювати самостійно."],["Захист під час розгляду","Визнати та узагальнити підтвердження поточного звернення (на кшталт довідки або автоматичного WW), яке призупиняє санкції, доки адміністрації не дали відповіді в розумний строк."],["Обов'язковий строк завершення","Запровадити цільовий строк загального завершення (quitus + затвердження + техпаспорт) із зобов'язанням адміністрації, заповнюючи нинішнє «Не встановлено»."],["Цільове інформування новоприбулих","Поширити чітку пам'ятку (французькою + мовами основних аудиторій, зокрема українською) про порядок етапів, безкоштовний quitus для цього випадку та тимчасовий сертифікат WW."],["Вказівки правоохоронним органам","Поширити інструкцію, щоб перевірки враховували підтвердження поточного звернення та віддавали перевагу нагадуванню про правило, а не негайному штрафу для добросовісної особи."],["Ресурси DREAL для RTI","Посилити штат і бюджети підрозділів з автомобілів DREAL, головного вузького місця для автомобілів поза ЄС, що потребують окремого затвердження."]],"base":[["Code de la route, ст. R322-1","Будь-який моторний транспортний засіб має бути забезпечений свідоцтвом про реєстрацію (техпаспортом), щоб рухатися дорогами, відкритими для громадського руху."],["Code de la route, ст. R322-2","Свідоцтво про реєстрацію на ім'я нового власника має бути запитане протягом місяця після придбання; тимчасовий рух можливий за наявності тимчасового свідоцтва про реєстрацію."],["Code général des impôts (quitus fiscal)","Реєстрація автомобіля, придбаного в ЄС, обумовлена наданням податкового сертифіката (quitus), що засвідчує дотримання правил щодо ПДВ, виданого податковою службою."],["Code de la route, ст. R321-15 (затвердження)","Перед реєстрацією транспортний засіб без дійсного загальноєвропейського затвердження має пройти затвердження (зокрема окреме) у DREAL."]],"chips":["C. route art. R322-1","C. route art. R322-2","C. route art. R321-15","CGI quitus fiscal","RTI / DREAL"],"sources":[["impots.gouv.fr — отримання податкового квитуса (фізособа)","https://www.impots.gouv.fr/vous-etes-un-particulier-et-vous-souhaitez-obtenir-un-quitus-fiscal"],["impots.gouv.fr — реєстрація автомобіля та запит податкового квитуса (ЄС)","https://www.impots.gouv.fr/fiche-focus-immatriculer-un-vehicule-et-demander-un-quitus-fiscal-vehicule-acquis-dans-lunion"],["Légifrance — Дорожній кодекс, ст. R322-2","https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000032401205"],["DRIEAT Île-de-France — FAQ щодо приймання (омологації) транспортних засобів (RTI / DREAL)","https://www.drieat.ile-de-france.developpement-durable.gouv.fr/faq-reception-de-vehicules-a3246.html"]]},{"id":"echanger-permis-de-conduire","icon":"permis","titre":"Обмін водійського посвідчення: захист у Франції є, але все залежить від угоди з країною, з якої довелося тікати","intro":"Особа під захистом, яка надовго залишається у Франції, зобов'язана обміняти іноземне посвідчення на французьке. Але обмін можливий лише за наявності угоди про взаємність із країною походження — тією самою, з якої вона була змушена тікати і з органами влади якої OFPRA приписує не контактувати. Без угоди заяву відхиляють, яким би бездоганним не було досьє.","steps":[{"ic":"ofpraok","l":"Надано додатковий захист або статус біженця"},{"ic":"permis","l":"Водійське посвідчення країни походження"},{"ic":"form","l":"Заява на обмін (ANTS / CERT) протягом одного року"},{"w":true,"real":"Кілька місяців розгляду,<br>потім відмова — єдина причина:<br>відсутність угоди","legal":"1 рік на подання заяви (ст. 11-I). Для адміністрації обов'язкового строку немає."},{"ic":"warning","l":"Відмова: немає угоди про взаємність із країною походження"},{"ic":"car","l":"Складати французьке посвідчення заново: місяці очікування й висока вартість"}],"constat":"Посвідчення, видане державою за межами Євросоюзу, можна обміняти у Франції лише за наявності угоди про взаємність із цією державою (стаття 5-I-A наказу від 12 січня 2012 року з відсиланням до статті R. 222-1 Дорожного кодексу). Водночас наказ передбачає особливий режим для осіб під захистом: вони звільнені від подання довідки про наявність права керування (стаття 6-D) та від умови дійсності посвідки на проживання (стаття 11-II), а річний строк для них обчислюється з дати видачі розписки, що підтверджує статус (стаття 11-I). Проте <strong>жодна з цих норм не звільняє їх від умови взаємності</strong>. У результаті біженець або отримувач додаткового захисту з країни без угоди — наприклад, з України — отримує відмову виключно на цій підставі. Проблему порушували в парламенті (письмове запитання до Сенату № 03096 від 6 лютого 2025 року): уряд відповів, що кількість осіб, яких це стосується, «надто мала, щоб виправдати» переговори про угоду, яка до того ж потребувала б парламентської ратифікації. Жодного проміжного механізму врегулювання не запропоновано.","chiffres":[["—","обов'язковий для адміністрації строк розгляду заяви — як і процедура чи графік укладення угоди, від якої все залежить"],["1 рік","строк, відведений особі під захистом на подання заяви, рахуючи від дати розписки (ст. 11-I наказу від 12 січня 2012 року)"],["≈ 98 %","українців під захистом у Франції мають саме додатковий захист — той самий статус, який зобов'язує обміняти посвідчення, але не дозволяє цього зробити"]],"probleme":"Асиметрія тут подвійна. По-перше, у часі: особа під захистом має один рік — інакше вона назавжди втрачає право на обмін, — тоді як ані адміністрація не зв'язана строком розгляду, ані держава не зв'язана строком переговорів про угоду, від якої залежить результат. По-друге, у самій логіці: міжнародний захист будується на розриві зв'язків із країною походження — рішення OFPRA прямо приписує не звертатися до її органів влади, — але право керувати автомобілем поставлене в залежність від угоди саме з цією країною. Парадокс довершує те, що отримувачі <em>тимчасового</em> захисту, які не мають звичайного місця проживання у Франції (ст. R. 222-2 Дорожного кодексу), продовжують їздити з українським посвідченням, а ті, хто отримав <em>додатковий</em> захист — більш стабільний статус, — це право втрачають. Водночас чинна двостороння угода дозволяє обмінювати посвідчення громадянам Росії. Наслідки для людей дуже конкретні: втрата права керування, а отже й доступу до багатьох робочих місць, і потреба заново складати іспити на французьке посвідчення — це кілька місяців і майже дві тисячі євро.","propositions":[["Звільнити осіб під захистом від умови взаємності","Доповнити статтю 11 наказу від 12 січня 2012 року так, щоб умова взаємності зі статті 5-I-A не застосовувалася до біженців, отримувачів додаткового захисту та апатридів — у тій самій логіці, що й статті 6-D і 11-II, які вже звільняють їх від інших умов, оскільки їхнє становище не тотожне становищу звичайного іноземця."],["Визнавати посвідчення, що відповідають Віденській конвенції","За відсутності двосторонньої угоди допускати обмін на підставі відповідності документа Віденській конвенції про дорожній рух від 8 листопада 1968 року, учасницями якої є Франція та багато країн походження, з документальною перевіркою з боку CERT."],["Зупиняти річний строк на час розгляду та оскарження","Передбачити, що річний строк за статтею 11-I зупиняється, доки адміністрація не ухвалила рішення, та на час оскарження, аби повільність розгляду не позбавляла самого права."],["Переглянути з ініціативи адміністрації відмови, обґрунтовані лише взаємністю","Організувати перегляд заяв, відхилених виключно через відсутність угоди, без нової умови щодо строку — для тих осіб під захистом, хто подав документи вчасно."],["Передбачити замісний механізм за відсутності угоди","Якщо угоди немає, відкрити спрощений шлях — перевірка права керування та контрольний практичний іспит — замість повного перескладання, вартість і строки якого є заборонними для людей на початку облаштування."],["Дати CERT ресурси та публікувати строки","Забезпечити компетентний центр (CERT EPE) штатом, співмірним з обсягом заяв, і щоквартально публікувати середні строки розгляду та частку відмов за кожною підставою."]],"base":[["Наказ від 12 січня 2012 року, ст. 5-I-A","Обмін посвідчення, виданого державою поза ЄС та ЄЕП, можливий за наявності угоди про взаємність між Францією і цією державою (відсилання до ст. R. 222-1 Дорожного кодексу). Ця умова не містить винятків для осіб, які отримали міжнародний захист."],["Наказ від 12 січня 2012 року, ст. 11-I","Для біженців, отримувачів додаткового захисту та апатридів річний строк для подання заяви про обмін обчислюється з дати видачі розписки, що підтверджує статус."],["Наказ від 12 січня 2012 року, ст. 11-II і ст. 6-D","Ці самі особи звільнені від умови дійсності посвідки на проживання (ст. 5-I-B) та від подання довідки про право керування: особливий режим для них уже існує, але він не охоплює взаємність."],["Дорожний кодекс, ст. R. 222-2","Обов'язок обміняти посвідчення стосується лише тих, хто має звичайне місце проживання у Франції. Отримувачі тимчасового захисту під нього не підпадають і зберігають свої попередні права — на відміну від осіб, які перебувають під захистом тривалий час."]],"chips":["Arrêté du 12 janv. 2012, art. 5-I-A","art. 6-D","art. 11-I et 11-II","C. route art. R222-1, R222-2"],"sources":[["Наказ від 12 січня 2012 року (визнання та обмін посвідчень, виданих поза ЄС/ЄЕП) — Légifrance","https://www.legifrance.gouv.fr/loda/id/JORFTEXT000025175223"],["Письмове запитання до Сенату № 03096 від 6 лютого 2025 року — неможливість обміняти українське посвідчення","https://www.senat.fr/questions/base/2025/qSEQ250203096.html"],["Запитання в Національних зборах № 700 — взаємне визнання посвідчень Франція — Україна","https://questions.assemblee-nationale.fr/q17/17-700QE.htm"],["GISTI — обмін водійських посвідчень іноземців","https://www.gisti.org/spip.php?article5252"]]}]},"comparatif":{"tag":"Реальність vs закон","h":"Розрив між очікуванням і законом","sub":"Для кожної процедури: реально зафіксований строк та строк, який закон встановлює (чи ні) для адміністрації.","rows":[["Відновлення актів цивільного стану (OFPRA)","≈ 9 місяців (до 1,5 року)","Не встановлено"],["Проїзний документ","8–10 місяців","Не встановлено"],["Посвідка на проживання","часто > 3 місяців","3 місяці"],["Натуралізація","3–4 роки","18 місяців (12, якщо 10 років)"],["Возз'єднання сім'ї / DCEM","3–8 місяців (віза); 2–4 місяці (DCEM)","Не встановлено"],["Відкрити банківський рахунок","часті відмови та перенесення","3 робочі дні (призначений банк)"],["Соціальне житло","від кількох місяців до кількох років","«ненормально довгий строк» (наказ префекта)"],["Реєстрація автомобіля","кілька місяців (розрізнені етапи)","1 місяць на подання; загального строку немає"],["Обмін водійського посвідчення","відмова, незалежно від строку очікування","1 рік на подання; для адміністрації — нічого"]]},"propositions":{"tag":"Що ми пропонуємо","h":"П'ять простих принципів","sub":"Один спільний лейтмотив проходить через кожну процедуру. Ось що відстоює цей сайт.","cards":[["I","Обов'язковий строк","Чіткий строк для кожного етапу, з певним моментом відліку, який адміністрація не може відкладати."],["II","Дієва санкція","Перевищення строку, що має реальні наслідки: пеня, довідка або документ, виданий за правом."],["III","Безперервність прав","Жодного розриву між двома документами чи під час розгляду: проживання, праця, засоби до існування та виплати збережені."],["IV","Прозорість","Лічильник строку, онлайн-відстеження крок за кроком, реальні строки, опубліковані по кожній префектурі."],["V","Надійна цифровізація","Платформа (ANEF), яка працює, доповнена живим прийомом для тих, хто не може нею користуватися."],["VI","Співмірні ресурси","Строк можна дотримати, лише якщо адміністрація має ресурси. Інвестувати в постійний найм і багаторічний бюджет, розраховані на реальний обсяг заяв, — а не лише створювати обов'язки."]]},"cadre":{"tag":"Правова база","h":"На чому ґрунтуються ці процедури","sub":"Наведені строки та обов'язки спираються на викладені нижче нормативні акти. Реальні строки походять з офіційних джерел та відгуків з місць.","items":[["Відновлення актів цивільного стану (OFPRA)",["CESEDA art. L121-9","R121-35","L561-16","CE 30 janv. 2025, n° 495916 et 495917"]],["Титул для подорожей",["CESEDA art. L561-9 à L561-13","L582-7 (apatride)","CGI art. 953-IV","R561-8"]],["Посвідка на проживання",["CESEDA art. R424-1, R424-7","L424-1 à L424-13","R431-15-1, R431-5","CE 3 juin 2022 n° 452798 ; CE 5 mai 2026 n° 502860"]],["Натуралізація",["Code civil art. 21-25-1","décret n° 93-1362 art. 37-1","CRPA art. L. 231-4","Tribunal administratif de Nantes (SDANF)"]]],"sourcesLabel":"Джерела","sources":[["Légifrance — Цивільний кодекс (Code civil), CESEDA, CGI","https://www.legifrance.gouv.fr/"],["Conseil d'État (Державна рада) — рішення та комюніке","https://www.conseil-etat.fr/"],["Défenseur des droits (Захисник прав) — звіти про ANEF та натуралізацію","https://www.defenseurdesdroits.fr/"],["OFPRA — дані щодо притулку та звіт за 2024–2025 роки","https://www.ofpra.gouv.fr/"],["service-public.gouv.fr — практичні довідки","https://www.service-public.gouv.fr/"],["УВКБ ООН (HCR / UNHCR) — світові тенденції щодо біженців","https://www.unhcr.org/fr-fr/tendances-mondiales-0"]]},"cta":{"ha":"Зрозуміти — це вже діяти.","p":"Ця процедура та ці строки стосуються сотень тисяч людей. Поділіться цією сторінкою, говоріть про неї та підтримайте просту ідею, яка через неї проходить: чіткі, обов'язкові строки та права без розривів.","share":"Поділитися цією сторінкою","print":"Друк / PDF"},"footer":{"brand":"Строки і права","disclaimer":"<strong>Інформаційно-просвітницький документ.</strong> Він не є індивідуальною юридичною консультацією. Для особистих дій зверніться до спеціалізованої асоціації (La Cimade, France terre d'asile, GISTI, Forum réfugiés) або до адвоката з права іноземців. Цифри та нормативні акти перевірено у червні 2026 року за публічними джерелами; реальні строки є орієнтовними та змінюються.","meta":["Оновлено · червень 2026","Джерела · OFPRA · HCR","· Conseil d'État","· Défenseur des droits","· Légifrance · service-public.gouv.fr"]},"merci":{"tag":"Кілька слів наостанок","h":"Це не вимога.","p1":"Цей сайт нічого не вимагає. Він із повагою пропонує шляхи, щоб зробити процедури зручнішими — ті самі, які й сама адміністрація прагне покращити.","p2":"Усі, від імені кого сформульовані ці пропозиції — і кого ці процедури стосуються безпосередньо, — насамперед хочуть висловити глибоку вдячність Французькій Республіці. Відчинивши двері тим, хто був змушений тікати від війни та переслідувань, Франція стала для багатьох із нас новим домом. Ми пам'ятаємо і про цей прийом, і про людей — працівників префектур, OFPRA, асоціацій, волонтерів, — завдяки яким він можливий щодня.","p3":"Якщо ми говоримо про строки, то не щоб скаржитися, а щоб допомогти: зрозуміліші та швидші процедури вигідні всім — і людям під захистом, і адміністрації, і французькому суспільству, яке нас прийняло. Саме в дусі вдячності та співпраці й пропонуються ці ідеї.","sign":"— Дякуємо."},"labels":{"constat":"Констатація стану справ","probleme":"Проблема","propositions":"Наші пропозиції","propWord":"Пропозиція","fond":"Правова основа","sources":"Джерела"}}
</script>
<script type="application/json" id="SITE-en">
