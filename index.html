<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Réfugiés en France : le parcours et les délais</title>
<meta name="description" content="Comprendre, étape par étape, le parcours administratif des personnes protégées en France — et l'écart entre le délai réellement constaté et le délai prévu par la loi.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bleu:#000091;--bleu-d:#00006b;--rouge:#E1000F;--orange:#E4720B;--orange-d:#c2600a;
    --ink:#16161e;--muted:#5b5b6b;--line:#e7e7f1;
    --blue-l:#eef0ff;--red-l:#fff0f0;--orange-l:#fff4e8;--grey-l:#f5f6fb;
    --radius:18px;--maxw:1200px;
    --body:"Manrope",system-ui,sans-serif;--disp:"Unbounded","Manrope",sans-serif;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0;background:#fff;color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
  ::selection{background:var(--bleu);color:#fff;}
  a{color:var(--bleu);}
  h1,h2,h3,h4{font-family:var(--disp);font-weight:700;line-height:1.08;letter-spacing:-.01em;margin:0;}
  p{margin:0 0 1em;}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 26px;}
  .progress{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--bleu),var(--rouge));z-index:10000;transition:width .12s linear;}
  .tricolore{display:inline-flex;height:6px;width:54px;border-radius:3px;overflow:hidden;vertical-align:middle;}
  .tricolore i{flex:1;}.tricolore i:nth-child(1){background:var(--bleu);}.tricolore i:nth-child(2){background:#fff;border-top:1px solid var(--line);border-bottom:1px solid var(--line);}.tricolore i:nth-child(3){background:var(--rouge);}

  header.site{position:sticky;top:0;z-index:8000;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
  .nav{display:flex;align-items:center;justify-content:space-between;gap:18px;height:64px;}
  .brand{display:flex;align-items:center;gap:11px;text-decoration:none;color:var(--ink);font-family:var(--disp);font-weight:700;font-size:16px;white-space:nowrap;}
  .brand .mk{width:30px;height:20px;border-radius:4px;overflow:hidden;display:flex;box-shadow:0 1px 3px rgba(0,0,145,.25);}
  .brand .mk i{flex:1;}.brand .mk i:nth-child(1){background:var(--bleu);}.brand .mk i:nth-child(2){background:#fff;}.brand .mk i:nth-child(3){background:var(--rouge);}
  .nav .links{display:flex;gap:2px;list-style:none;margin:0;padding:0;}
  .nav a.link{font-size:14px;font-weight:600;color:var(--muted);text-decoration:none;padding:8px 13px;border-radius:10px;transition:all .2s;white-space:nowrap;}
  .nav a.link:hover{color:var(--bleu);background:var(--blue-l);}
  .nav a.link.active{color:var(--bleu);background:var(--blue-l);}
  .right{display:flex;align-items:center;gap:14px;}
  .langswitch{display:flex;gap:2px;background:var(--grey-l);border-radius:999px;padding:3px;}
  .langswitch button{font-family:var(--body);font-size:12px;font-weight:700;border:0;background:transparent;color:var(--muted);padding:6px 9px;border-radius:999px;cursor:pointer;transition:all .2s;}
  .langswitch button.active{background:var(--bleu);color:#fff;}
  .langswitch button:hover:not(.active){color:var(--bleu);}
  @media(max-width:1040px){.nav .links{display:none;}}

  .btn{font-family:var(--body);font-weight:700;font-size:14px;text-decoration:none;padding:13px 22px;border-radius:12px;border:2px solid var(--bleu);color:var(--bleu);background:#fff;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:8px;}
  .btn:hover{background:var(--blue-l);transform:translateY(-1px);}
  .btn.primary{background:var(--bleu);color:#fff;}
  .btn.primary:hover{background:var(--bleu-d);}

  .hero{padding:74px 0 56px;position:relative;overflow:hidden;}
  .hero::before{content:"";position:absolute;top:-180px;right:-160px;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(0,0,145,.07),transparent 65%);}
  .hero::after{content:"";position:absolute;bottom:-200px;left:-120px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(225,0,15,.06),transparent 65%);}
  .hero .wrap{position:relative;}
  .eyebrow{display:flex;align-items:center;gap:12px;font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--rouge);margin-bottom:24px;}
  .hero h1{font-size:clamp(2.3rem,5.4vw,4rem);font-weight:800;color:var(--bleu);max-width:18ch;letter-spacing:-.02em;}
  .hero h1 .r{color:var(--rouge);}
  .hero .lead{font-size:clamp(1.05rem,1.7vw,1.3rem);color:var(--muted);max-width:62ch;margin-top:24px;font-weight:500;}
  .hero .cta-row{display:flex;flex-wrap:wrap;gap:13px;margin-top:32px;}
  .hero .note{font-size:13px;color:var(--muted);margin-top:26px;}

  section{scroll-margin-top:78px;}
  .sec{padding:76px 0;}
  .sec.alt{background:var(--grey-l);}
  .section-tag{display:inline-flex;align-items:center;gap:9px;font-size:13px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--rouge);margin-bottom:16px;}
  .section-tag::before{content:"";width:24px;height:2px;background:var(--rouge);}
  .sec h2{font-size:clamp(1.7rem,3.3vw,2.5rem);font-weight:800;color:var(--bleu);max-width:20ch;letter-spacing:-.02em;}
  .sec .sub{font-size:1.05rem;color:var(--muted);max-width:64ch;margin-top:16px;font-weight:500;}

  /* stats */
  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:42px;}
  .stat{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:28px 24px;position:relative;overflow:hidden;transition:transform .25s,box-shadow .25s;}
  .stat:hover{transform:translateY(-4px);box-shadow:0 18px 40px -22px rgba(0,0,145,.4);}
  .stat::after{content:"";position:absolute;left:24px;right:24px;bottom:0;height:4px;background:var(--bleu);border-radius:4px 4px 0 0;}
  .stat .sn{font-family:var(--disp);font-size:clamp(1.75rem,2.9vw,2.35rem);overflow-wrap:break-word;font-weight:800;color:var(--bleu);line-height:1;letter-spacing:-.02em;}
  .stat .sl{font-size:14.5px;font-weight:700;color:var(--ink);margin-top:14px;line-height:1.3;}
  .stat .ss{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.4;}
  .stat:nth-child(4)::after{background:var(--rouge);}
  .stat:nth-child(4) .sn{color:var(--rouge);}
  .context{margin-top:24px;background:var(--blue-l);border-radius:var(--radius);padding:30px 32px;border-left:5px solid var(--bleu);}
  .context h3{font-family:var(--disp);font-size:1.2rem;color:var(--bleu);margin-bottom:10px;}
  .context p{color:#2a2a4a;margin:0;font-weight:500;}
  @media(max-width:900px){.stat-grid{grid-template-columns:1fr 1fr;}}
  @media(max-width:520px){.stat-grid{grid-template-columns:1fr;}}

  /* parcours */
  .parcours{background:#fff;border:1px solid var(--line);border-radius:22px;padding:30px 30px 34px;margin-top:26px;box-shadow:0 1px 2px rgba(0,0,0,.03);}
  .pc-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:8px;}
  .pc-head .pc-ic{flex:0 0 auto;width:56px;height:56px;border-radius:15px;background:var(--blue-l);display:flex;align-items:center;justify-content:center;}
  .pc-head .pc-ic svg{width:32px;height:32px;}
  .pc-head h3{font-family:var(--disp);font-size:1.22rem;color:var(--bleu);font-weight:700;}
  .pc-head p{font-size:14.5px;color:var(--muted);margin:6px 0 0;font-weight:500;}
  .flow-wrap{margin-top:24px;padding:6px 2px 2px;}
  .flow{display:flex;flex-direction:column;gap:0;}
  .flow-row{display:flex;align-items:flex-start;justify-content:center;flex-wrap:nowrap;}
  .flow.vert{align-items:center;}
  .node{flex:0 0 auto;width:134px;text-align:center;padding:0 3px 12px;}
  .node .ic{width:66px;height:66px;margin:0 auto 11px;border-radius:18px;background:var(--blue-l);display:flex;align-items:center;justify-content:center;}
  .node .ic svg{width:38px;height:38px;}
  .node .cap{font-size:12px;line-height:1.32;color:var(--ink);font-weight:600;}
  .node.warn .ic{background:var(--red-l);}
  .conn{flex:0 0 auto;width:44px;display:flex;justify-content:center;padding-top:13px;}
  .conn svg{width:48px;height:40px;}
  .conn.down{width:100%;padding:0;margin:6px 0 18px;justify-content:center;align-items:center;}
  .conn.down svg{transform:rotate(90deg);width:38px;height:30px;}
  .flow.vert .node{margin-bottom:0;}
  .node.wait{width:134px;}
  .node.wait .real,.node.wait .legalbadge{max-width:100%;}
  .flow.vert .node.wait{width:300px;}
  .legalstrip{display:flex;justify-content:center;margin-top:4px;}
  .legalstrip .legalbadge{margin-top:0;max-width:560px;}
  .node.wait .ic{background:var(--orange-l);}
  .node.wait .ic svg{width:36px;height:36px;}
  .node.wait .real{font-size:13px;color:var(--orange-d);font-weight:700;line-height:1.3;}
  .node.wait .real .lbl{display:block;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--orange);margin-bottom:2px;}
  .legalbadge{margin-top:10px;display:inline-flex;align-items:flex-start;gap:7px;background:var(--blue-l);border:1px solid #d7daff;border-radius:11px;padding:8px 11px;text-align:left;}
  .legalbadge svg{width:18px;height:18px;flex:0 0 auto;margin-top:1px;}
  .legalbadge .lt{font-size:11.5px;line-height:1.3;color:var(--bleu);font-weight:600;}
  .legalbadge .lt .lbl{display:block;font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);}
  .legalbadge.none{background:var(--red-l);border-color:#ffd4d4;}
  .legalbadge.none .lt{color:var(--rouge);}
  @media(max-width:520px){
    .node{width:172px;}
    .node.wait{width:200px;}
  }

  /* parcours detail (texte complémentaire) */
  .pc-detail{margin-top:30px;padding-top:26px;border-top:1px solid var(--line);}
  .pc-detail .blk{margin-bottom:24px;}
  .pc-detail .blabel{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--bleu);margin-bottom:11px;}
  .pc-detail .prose{font-size:1.01rem;color:#34343f;font-weight:500;margin:0;line-height:1.62;max-width:74ch;}
  .pc-detail .prose strong,.pc-detail .probleme strong{color:var(--ink);font-weight:700;}
  .pc-detail .chiffres{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:0 0 24px;}
  .pc-detail .stat2{background:var(--grey-l);border-radius:12px;padding:16px 18px;border-left:3px solid var(--orange);}
  .pc-detail .stat2 .sn{font-family:var(--disp);font-weight:700;font-size:1.22rem;color:var(--ink);line-height:1.05;letter-spacing:-.01em;}
  .pc-detail .stat2 .sl{font-size:12.5px;color:var(--muted);margin-top:8px;line-height:1.4;}
  .pc-detail .probleme{background:var(--red-l);border-left:4px solid var(--rouge);border-radius:0 12px 12px 0;padding:18px 22px;margin-bottom:24px;}
  .pc-detail .probleme .blabel{color:var(--rouge);}
  .pc-detail .probleme p{margin:0;color:#3a2226;font-weight:500;line-height:1.55;}
  .pc-detail .props{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .pc-detail .prop{background:#fff;border:1px solid var(--line);border-radius:13px;padding:20px 22px;transition:box-shadow .25s,transform .25s;}
  .pc-detail .prop:hover{box-shadow:0 14px 34px -22px rgba(0,0,145,.4);transform:translateY(-2px);}
  .pc-detail .prop .pn{font-size:11px;font-weight:800;letter-spacing:.04em;color:var(--bleu);background:var(--blue-l);padding:4px 10px;border-radius:7px;display:inline-block;margin-bottom:11px;}
  .pc-detail .prop h4{font-size:1.02rem;font-weight:800;font-family:var(--body);margin-bottom:8px;color:var(--ink);line-height:1.25;}
  .pc-detail .prop p{font-size:13.5px;color:var(--muted);margin:0;line-height:1.5;font-weight:500;}
  .pc-detail details.fw{margin-top:22px;background:var(--grey-l);}
  .legal-item{padding:14px 0;border-top:1px solid var(--line);}
  .legal-item:first-child{border-top:0;}
  .legal-item .lref{font-size:12.5px;font-weight:800;color:var(--bleu-d);margin-bottom:6px;}
  .legal-item .ltext{font-size:13.5px;color:var(--muted);line-height:1.55;}
  @media(max-width:760px){.pc-detail .props{grid-template-columns:1fr;}.pc-detail .chiffres{grid-template-columns:1fr;}}

  /* comparatif */
  .cmp-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-top:40px;}
  .cmp{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:24px 26px;}
  .cmp h4{font-family:var(--disp);font-size:1.1rem;color:var(--bleu);margin-bottom:18px;}
  .cmp .bars{display:flex;flex-direction:column;gap:14px;}
  .cmp .line{display:block;margin-bottom:14px;}
  .cmp .line:last-child{margin-bottom:0;}
  .cmp .line .tg{display:block;font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;margin-bottom:3px;}
  .cmp .line.real .tg{color:var(--orange);}
  .cmp .line.law .tg{color:var(--bleu);}
  .cmp .val{font-family:var(--disp);font-weight:700;font-size:1.05rem;}
  .cmp .line.real .val{color:var(--orange-d);}
  .cmp .line.law .val{color:var(--bleu);}
  .cmp .line.law .val.none{color:var(--rouge);}
  @media(max-width:760px){.cmp-grid{grid-template-columns:1fr;}}

  /* propositions */
  .pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-top:42px;}
  .pcard{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:28px 24px;transition:transform .25s,box-shadow .25s;}
  .pcard:hover{transform:translateY(-4px);box-shadow:0 18px 40px -24px rgba(0,0,145,.35);}
  .pcard .pi{width:38px;height:38px;border-radius:11px;background:var(--bleu);color:#fff;font-family:var(--disp);font-weight:700;display:flex;align-items:center;justify-content:center;margin-bottom:16px;}
  .pcard h4{font-size:1.08rem;font-weight:800;font-family:var(--body);margin-bottom:9px;color:var(--ink);}
  .pcard p{font-size:14px;color:var(--muted);margin:0;line-height:1.5;font-weight:500;}

  /* framework / sources */
  details.fw{background:#fff;border:1px solid var(--line);border-radius:var(--radius);margin-top:18px;overflow:hidden;}
  details.fw>summary{cursor:pointer;list-style:none;padding:20px 24px;font-family:var(--disp);font-weight:600;font-size:1rem;color:var(--bleu);display:flex;align-items:center;flex-wrap:wrap;gap:10px;}
  details.fw>summary::-webkit-details-marker{display:none;}
  details.fw>summary .chev{margin-left:auto;transition:transform .3s;font-family:var(--body);}
  details.fw[open]>summary .chev{transform:rotate(180deg);}
  .fw-body{padding:4px 24px 26px;}
  .fw-item{padding:16px 0;border-top:1px solid var(--line);}
  .fw-item h5{font-family:var(--body);font-size:14px;font-weight:800;color:var(--ink);margin:0 0 10px;}
  .fw-item .chips{display:flex;flex-wrap:wrap;gap:7px;}
  .chip{font-size:12px;font-weight:600;color:var(--bleu);background:var(--blue-l);border-radius:8px;padding:5px 10px;}
  .src-list{list-style:none;margin:16px 0 0;padding:16px 0 0;border-top:1px solid var(--line);}
  .src-list li{font-size:13.5px;padding:6px 0;}
  .src-list a{color:var(--bleu);text-decoration:none;border-bottom:1px solid #c9cdff;word-break:break-word;}
  .src-list a:hover{border-color:var(--bleu);}

  /* cta */
  .cta{background:var(--bleu);color:#fff;text-align:center;padding:84px 0;}
  .cta h2{color:#fff;font-size:clamp(1.9rem,4vw,3rem);max-width:20ch;margin:0 auto 20px;}
  .cta h2 .r{color:#ff8a93;}
  .cta p{color:#c8caf5;max-width:54ch;margin:0 auto 32px;font-size:1.05rem;font-weight:500;}
  .cta .btn{border-color:#fff;color:#fff;background:transparent;}
  .cta .btn:hover{background:rgba(255,255,255,.12);}
  .cta .btn.primary{background:#fff;color:var(--bleu);}
  .cta .btn.primary:hover{background:#eef0ff;}
  .cta .cta-row{display:flex;gap:13px;justify-content:center;flex-wrap:wrap;}

  .merci{padding:84px 0 92px;background:linear-gradient(180deg,#ffffff,#eef0ff);text-align:center;}
  .merci .inner{max-width:760px;margin:0 auto;}
  .merci .tricolore{margin-bottom:22px;height:7px;width:64px;}
  .merci .mtag{font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--rouge);margin-bottom:14px;}
  .merci h2{font-size:clamp(1.55rem,3vw,2.25rem);color:var(--bleu);margin-bottom:24px;letter-spacing:-.01em;}
  .merci p{color:#2f2f4d;font-size:1.05rem;font-weight:500;margin-bottom:16px;line-height:1.62;}
  .merci .sign{font-family:var(--disp);font-weight:700;color:var(--bleu);font-size:1.15rem;margin-top:20px;}
  footer.site{background:#0b0b3b;color:#c8caf5;padding:54px 0 60px;}
  footer .fgrid{display:grid;grid-template-columns:2fr 1fr;gap:40px;}
  footer .fbrand{font-family:var(--disp);font-weight:700;font-size:1.2rem;color:#fff;margin-bottom:16px;display:flex;align-items:center;gap:10px;}
  footer .disclaimer{font-size:13.5px;line-height:1.6;max-width:62ch;}
  footer .disclaimer strong{color:#fff;}
  footer .fmeta{font-size:12.5px;line-height:2;color:#9a9cd8;}
  @media(max-width:760px){footer .fgrid{grid-template-columns:1fr;}}

  .reveal{opacity:0;transform:translateY(20px);transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1);}
  .reveal.in{opacity:1;transform:none;}
  @media(prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none;}}
  @media print{
    @page{margin:14mm 12mm;}
    header.site,.progress,.langswitch,[data-share],.hero .cta-row,.cta .cta-row{display:none!important;}
    body{font-size:11.5pt;}
    .hero{padding:6px 0 18px;}
    .reveal{opacity:1!important;transform:none!important;}
    .sec,.parcours,.cta,.merci{padding-top:22px;padding-bottom:22px;}
    .sec.alt,.cta,.merci{background:#fff!important;color:var(--ink)!important;}
    .cta h2,.cta p{color:var(--ink)!important;}
    .cta .cta-row{display:none!important;}
    details.fw>summary{cursor:default;}
    details.fw[open]>summary .chev,details.fw>summary .chev{display:none;}
    details>*{display:block!important;}
    .node,.pc-head,.pcard,.cmp,.stat,.field-card,.angle,.pc-detail .prop,.pc-detail .stat2,.context,.disclaimer-box,details.fw{break-inside:avoid;}
    .pc-detail .probleme,.legalbadge{break-inside:avoid;}
    .parcours{border:1px solid var(--line);}
    footer.site{background:#fff!important;color:var(--ink)!important;border-top:2px solid var(--bleu);}
    footer .fbrand,footer .disclaimer strong{color:var(--ink)!important;}
    footer .fmeta{color:var(--muted)!important;}
    a{color:var(--bleu)!important;text-decoration:none;}
  }
</style>
</head>
<body>
<div class="progress" id="progress"></div>
<header class="site">
  <div class="wrap nav">
    <a href="#top" class="brand"><span class="mk"><i></i><i></i><i></i></span><span id="brandText">Délais &amp; Droits</span></a>
    <ul class="links" id="navLinks"></ul>
    <div class="right">
      <div class="langswitch" id="langswitch">
        <button data-lang="fr" class="active">FR</button>
        <button data-lang="ru">RU</button>
        <button data-lang="uk">UK</button>
        <button data-lang="en">EN</button>
      </div>
    </div>
  </div>
</header>

<script type="application/json" id="SITE-fr">
{"meta":{"title":"Réfugiés en France : le parcours et les délais","desc":"Comprendre, étape par étape, le parcours administratif des personnes protégées en France."},"ui":{"brand":"Délais & Droits","nav":[["chiffres","Les chiffres"],["parcours","Le parcours"],["comparatif","Réel vs légal"],["propositions","Nos propositions"],["cadre","Cadre juridique"]],"ctaPrimary":"Voir le parcours","ctaSecondary":"Imprimer / PDF","share":"Partager","print":"Imprimer / PDF","linkCopied":"Lien copié ✓","realLabel":"Délai réel","lawLabel":"Délai prévu par la loi","notSet":"Non établi par la loi"},"hero":{"eyebrow":"Comprendre le parcours des personnes protégées","h1a":"Une protection accordée.","h1b":"Puis l'attente.","lead":"Lorsqu'une personne obtient l'asile en France, son parcours administratif ne fait que commencer. Ce site montre, étape par étape, ce que doivent accomplir les réfugiés et bénéficiaires de la protection subsidiaire — et l'écart entre le délai réellement constaté et le délai prévu par la loi.","note":"Données vérifiées en juin 2026 — OFPRA, Conseil d'État, Défenseur des droits, HCR, Légifrance — complétées par des retours de terrain."},"stats":{"tag":"Les chiffres","h":"La France et les réfugiés, en bref","sub":"Quelques repères pour situer la réalité, souvent mal connue du grand public.","cards":[["≈ 663 000","personnes sous la protection de l'OFPRA","fin 2024 — réfugiés, protection subsidiaire, apatrides"],["153 596","demandes d'asile enregistrées en 2024","niveau record (+7,7 % en un an)"],["54 430","protections accordées en 2024","soit ≈ 39 % des décisions de l'OFPRA"],["3ᵉ","pays d'accueil de l'Union européenne","en nombre de réfugiés — mais 21ᵉ rapporté à la population"]],"context":{"h":"Une réalité souvent mal connue","p":"Au niveau mondial, environ trois réfugiés sur quatre sont accueillis par des pays à revenu faible ou intermédiaire, le plus souvent voisins des zones de conflit. Sur près de 43 millions de réfugiés dans le monde, la France n'en accueille qu'une part modeste. Et une fois la protection accordée, c'est un autre parcours qui commence : celui des démarches et de l'attente."}},"parcours":{"tag":"Le parcours, étape par étape","h":"Chaque situation, étape par étape","sub":"Pour chaque situation : les étapes à franchir, le délai réellement constaté (⏱ en orange) et le délai que la loi impose à l'administration (⚖ en bleu — ou « non établi » lorsque la loi n'en fixe aucun).","items":[{"id":"p-etatcivil","icon":"acte","titre":"Refaire son état civil après une décision favorable","intro":"Une personne protégée ne peut plus s'adresser aux autorités de son pays d'origine. C'est l'OFPRA qui doit reconstituer son état civil — et sans ces actes, presque rien n'est possible.","steps":[{"ic":"ofpraok","l":"Décision favorable de l'OFPRA ou de la CNDA"},{"ic":"actebarre","l":"Les actes du pays d'origine ne sont plus utilisables"},{"ic":"form","l":"Demande de reconstitution adressée à l'OFPRA"},{"w":true,"real":"≈ 9 mois<br>(de 8 mois à 1 an et demi)","legal":""},{"ic":"acte","l":"Actes d'état civil délivrés (valeur d'actes authentiques)"},{"ic":"unlock","l":"Titre définitif, mariage, banque… enfin possibles"}],"constat":"Lorsqu'une personne se voit reconnaître la qualité de réfugié, le bénéfice de la protection subsidiaire ou le statut d'apatride, elle ne peut plus solliciter les autorités de son pays d'origine. C'est l'OFPRA qui, par sa division de la protection, établit, reconstitue et tient à jour son état civil et délivre les pièces tenant lieu d'actes d'état civil (certificat de naissance, certificat de mariage, livret de famille). Ces pièces ont la valeur d'actes authentiques. Pendant plusieurs années, les délais ont fortement augmenté : le délai moyen d'établissement est passé de 141 jours en 2017 à 240 jours en 2021, puis le stock a dépassé 31 500 demandes en attente fin 2022, pour un délai moyen d'environ dix mois. La situation s'est améliorée depuis le dernier trimestre 2023, mais le délai moyen restait de 11,7 mois en 2023, de 10,8 mois en 2024 et de 9,1 mois (275 jours) en 2025, avec un stock encore élevé (59 860 dossiers en attente au 31 décembre 2024). Aucun délai n'est légalement opposable à l'OFPRA pour accomplir cette mission.","probleme":"Tant que l'OFPRA n'a pas établi les actes d'état civil, le bénéficiaire d'une protection vit dans une zone grise : il dispose certes du statut et, en principe, d'une attestation de prolongation d'instruction qui ouvre les droits sociaux et autorise à travailler, mais l'absence d'acte de naissance ou de mariage authentifié bloque concrètement de nombreuses démarches. La préfecture ne peut ainsi délivrer le titre de séjour définitif tant que l'OFPRA ne lui a pas communiqué l'acte d'état civil ; s'y ajoutent l'ouverture d'un compte bancaire de plein exercice, la signature d'un bail, la célébration ou la transcription d'un mariage, l'établissement d'un livret de famille, ainsi que certaines prestations familiales et droits sociaux. La décision du Conseil d'État de janvier 2025 a estimé que l'attestation de prolongation d'instruction et le statut suffisaient à exercer l'essentiel des droits ; en pratique, cette attestation provisoire reste souvent mal connue ou mal acceptée par les guichets (banques, employeurs, bailleurs, CAF, France Travail, mairies), et l'attente de plusieurs mois retarde l'intégration des personnes protégées. Surtout, le réfugié ne dispose d'aucun délai opposable ni d'aucune voie de saisine efficace pour faire accélérer le traitement de son dossier.","propositions":[["Inscrire un délai légal opposable de 4 mois dans le CESEDA","Compléter l'article L121-9 du CESEDA par un alinéa fixant un délai maximal de quatre mois (six mois pour les dossiers nécessitant une enquête complémentaire ou la légalisation d'actes étrangers) entre la demande complète d'établissement de l'acte et sa délivrance par l'OFPRA, à compter de la reconnaissance définitive de la protection. Ce délai, aujourd'hui inexistant, donnerait une norme de référence claire aux personnes protégées comme à l'administration."],["Assortir le dépassement du délai d'une astreinte et d'une voie de saisine simple","Prévoir par décret qu'en cas de dépassement du délai, l'intéressé peut saisir le juge administratif pour obtenir une injonction de délivrance sous astreinte (sur le modèle des articles L911-1 et suivants du code de justice administrative), et créer en amont une procédure de réclamation dématérialisée auprès de l'OFPRA, avec accusé de réception et délai de réponse de quinze jours, ainsi qu'une procédure d'urgence motivée (mariage, naissance, réunification familiale, embauche)."],["Renforcer les moyens et achever la dématérialisation de la division de la protection","Pérenniser et augmenter les effectifs d'officiers de protection dédiés à l'état civil, généraliser le dépôt et le suivi en ligne des demandes d'actes avec une délivrance dématérialisée sécurisée (acte signé électroniquement, vérifiable par les administrations), et publier chaque trimestre des indicateurs ouverts (stock, délai moyen et délai au 9e décile) afin de garantir la transparence et le pilotage de la résorption du stock."],["Garantir la pleine opposabilité de l'attestation de prolongation d'instruction","Adosser à l'article L561-16 du CESEDA un texte d'application rappelant expressément que l'attestation de prolongation d'instruction et le récépissé valent justificatif de la régularité du séjour et du droit au travail, et diffuser une instruction interministérielle opposable aux banques (via l'ACPR et la Banque de France), aux bailleurs, aux employeurs, à la CAF et à France Travail, leur interdisant d'exiger un acte d'état civil définitif lorsque l'attestation provisoire de l'OFPRA ou l'attestation préfectorale est produite."],["Reconnaître la valeur probante des pièces provisoires de l'OFPRA","Préciser dans le CESEDA et par circulaire adressée aux officiers d'état civil et aux préfectures que les pièces provisoires et le certificat administratif délivrés par l'OFPRA dans l'attente de l'acte définitif ont une valeur probante suffisante pour engager les démarches de la vie civile (mariage, scolarisation, prestations, titre de séjour), afin que l'attente d'un acte définitif ne paralyse plus l'exercice des droits."],["Donner à l'OFPRA les moyens de résorber le stock","Pérenniser et augmenter les effectifs d'officiers de protection dédiés à l'état civil et financer un plan de résorption du stock (près de 60 000 dossiers en attente), pour atteindre un délai cible opposable."]],"base":[["Article L121-9 du CESEDA","L'OFPRA est habilité à délivrer aux réfugiés, aux bénéficiaires de la protection subsidiaire et aux apatrides les pièces nécessaires aux actes de la vie civile, notamment les pièces tenant lieu d'actes d'état civil. Son directeur général authentifie ces actes et documents, qui ont la valeur d'actes authentiques et suppléent à l'absence d'actes délivrés dans le pays d'origine. Le texte ne fixe aucun délai d'établissement."],["Article R121-35 du CESEDA","Précise les conditions d'établissement et de délivrance des actes par l'office et confirme leur valeur d'actes authentiques, l'office ne pouvant rectifier que les omissions et erreurs purement matérielles. Le texte ne prévoit, là encore, aucun délai opposable à l'OFPRA."],["Article L561-16 du CESEDA","Dans l'attente de la fixation définitive de son état civil par l'OFPRA, le réfugié ou le bénéficiaire de la protection subsidiaire peut solliciter le bénéfice des droits qui lui sont ouverts en application du code du travail, du code de la sécurité sociale, du code de l'action sociale et des familles et du code de la construction et de l'habitation, sur la base de la composition familiale prise en compte dans le cadre de l'examen de la demande d'asile."],["Conseil d'État, 2e-7e ch. réunies, 30 janvier 2025, nos 495916 et 495917","Saisi par le GISTI et l'ADDE, d'une part, et par La Cimade, le Groupe accueil et solidarité (GAS), JRS France et la LDH, d'autre part, du refus implicite de prendre des mesures pour réduire les délais d'établissement des actes par l'OFPRA, le Conseil d'État a rejeté les requêtes. Il a relevé que les délais avaient commencé à décroître à compter du dernier trimestre 2023, pour être ramenés à moins de dix mois, et que la seule qualité de réfugié ou de protégé subsidiaire, combinée à l'attestation de prolongation d'instruction délivrée par le préfet et aux droits ouverts par l'article L561-16, permettait d'exercer l'essentiel des droits et libertés attachés au statut."]],"chiffres":[["59 860","dossiers d'état civil en attente à l'OFPRA au 31 décembre 2024 (le stock dépassait déjà 31 500 demandes fin 2022)"],["9,1 mois","délai moyen d'établissement des actes en 2025 (275 jours), contre 10,8 mois en 2024 et 11,7 mois en 2023"],["—","délai légal aujourd'hui opposable à l'OFPRA pour établir les actes d'état civil"]],"sources":[["Légifrance — Article L121-9 du CESEDA","https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000042777575"],["Légifrance — Article L561-16 du CESEDA","https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000042775752"],["Légifrance — Conseil d'État, 30 janvier 2025, n° 495916 (délais d'établissement des actes d'état civil par l'OFPRA)","https://www.legifrance.gouv.fr/ceta/id/CETATEXT000051105650"],["Conseil d'État — Décision n° 495916 du 30 janvier 2025","https://www.conseil-etat.fr/fr/arianeweb/CE/decision/2025-01-30/495916"],["OFPRA — Bilan 2025 : une activité record et des évolutions contrastées","https://www.ofpra.gouv.fr/actualites/bilan-2025-de-lofpra-une-activite-record-et-des-evolutions-contrastees"],["La Cimade — Rapport d'activité OFPRA 2024 : cartographie de la demande d'asile","https://www.lacimade.org/rapport-dactivite-ofpra-2024-cartographie-de-la-demande-dasile/"]],"chips":["L121-9 CESEDA","R121-35","L561-16","CE 30 janv. 2025, 495916"]},{"id":"p-voyage","icon":"passport","titre":"Voyager hors de France (tourisme, mission, famille)","intro":"Pour un déplacement professionnel, un voyage touristique ou une visite à des proches, la personne protégée ne peut pas utiliser le passeport de son pays d'origine.","steps":[{"ic":"plane","l":"Projet de voyage (tourisme, mission, famille)"},{"ic":"passportno","l":"Passeport du pays d'origine inutilisable"},{"ic":"form","l":"Demande de titre de voyage (TIV / TVR) sur l'ANEF"},{"w":true,"real":"8 à 10 mois<br>rapportés","legal":""},{"ic":"passport","l":"Titre de voyage délivré"},{"ic":"planeok","l":"Le voyage devient possible"}],"constat":"Le titre de voyage pour réfugié (TVR), le titre d'identité et de voyage (TIV) délivré aux bénéficiaires de la protection subsidiaire, et le titre de voyage pour apatride sont des documents biométriques sécurisés qui se substituent au passeport national, que ces personnes ne peuvent pas solliciter auprès de leur pays d'origine. La demande est dématérialisée et déposée exclusivement en ligne sur le portail de l'Administration numérique des étrangers en France (ANEF), les demandes par courrier ou courriel n'étant pas acceptées. À la différence de la durée de validité et de la taxe, fixées par la loi, aucun texte ne fixe de délai légal de fabrication ni de délivrance de ces titres. En pratique, les préfectures se bornent à recommander de déposer la demande au moins trois mois avant le départ et annoncent des délais de traitement de l'ordre de 30 à 60 jours, sans garantie ni traitement prioritaire, et les délais réels sont parfois bien supérieurs, sans qu'existe de procédure d'urgence clairement organisée.","probleme":"Sans délai opposable, le réfugié, l'apatride ou le bénéficiaire de la protection subsidiaire ne dispose d'aucune garantie sur la date à laquelle il pourra réellement voyager : visite à des proches restés dans un pays tiers, déplacement professionnel, démarche médicale ou décès d'un membre de la famille. L'absence de procédure d'urgence rend impossible la prise en compte des situations impérieuses. La recommandation préfectorale de déposer « au moins trois mois avant » fait peser sur la personne un aléa qu'elle ne maîtrise pas, alors qu'elle ne peut, par définition, se procurer un passeport auprès de son pays d'origine. Cette incertitude est aggravée par les dysfonctionnements de la plateforme ANEF, dénoncés par le Défenseur des droits, et prive un droit reconnu par la loi de son effectivité.","propositions":[["Inscrire un délai réglementaire de délivrance dans le CESEDA","Compléter la partie réglementaire du CESEDA (section relative aux documents de voyage, autour de l'article R561-8) par un délai maximal opposable de fabrication et de remise du titre de voyage, fixé à deux mois à compter du dépôt d'une demande complète, aligné sur la pratique du passeport ordinaire. À défaut de décision dans ce délai, prévoir un point de contact préfectoral obligatoire et la possibilité d'un recours accéléré."],["Créer une procédure d'urgence pour motif impérieux","Instaurer une voie d'urgence avec délivrance sous 5 à 10 jours ouvrés en cas de motif impérieux dûment justifié : raison médicale grave, décès ou maladie grave d'un proche, motif familial impérieux ou obligation professionnelle datée. Définir une liste de justificatifs et un guichet de traitement prioritaire dans chaque préfecture, sur le modèle de la procédure d'urgence existant pour le passeport et la carte nationale d'identité."],["Garantir un suivi en ligne et des délais publiés sur l'ANEF","Rendre obligatoire, dans le téléservice ANEF, un suivi d'avancement étape par étape (dépôt, instruction, fabrication, mise à disposition) avec horodatage, et la publication trimestrielle par préfecture des délais moyens réels de délivrance des titres de voyage, afin de rendre l'administration redevable et de permettre le pilotage des écarts. Cette mesure répond directement aux recommandations du Défenseur des droits sur l'amélioration de l'information et le suivi des demandes via l'ANEF."],["Assortir le dépassement de délai de garanties effectives","Prévoir, en cas de dépassement du délai réglementaire imputable à l'administration, une astreinte de plein droit en référé devant le juge administratif et la possibilité de la délivrance d'un titre de voyage provisoire permettant un déplacement déjà programmé, à l'image des documents provisoires existant en matière de séjour."],["Réduire ou supprimer la taxe pour les personnes les plus précaires","Modifier le IV de l'article 953 du CGI pour exonérer du droit de timbre (45 € ou 40 €) les bénéficiaires de protection sans ressources ou allocataires de minima sociaux, ou instaurer un tarif réduit, afin que le coût ne constitue pas un obstacle supplémentaire à l'exercice d'un droit fondamental."],["Doter le service de fabrication de moyens suffisants","Affecter au service chargé des titres de voyage le personnel et les équipements biométriques proportionnés à la demande, pour ramener la fabrication à quelques semaines."]],"base":[["Article L561-9 du CESEDA","L'étranger titulaire d'un titre de séjour en cours de validité auquel la qualité de réfugié a été reconnue peut se voir délivrer un document de voyage dénommé « titre de voyage pour réfugié », l'autorisant à voyager hors de France, sauf si des raisons impérieuses de sécurité nationale ou d'ordre public s'y opposent. Ce titre permet de se rendre dans tout État, à l'exception de celui ou de ceux à l'égard desquels les craintes de persécution ont été reconnues fondées. Aucun délai de fabrication ou de délivrance n'est fixé."],["Article L561-10 du CESEDA","L'étranger titulaire d'un titre de séjour en cours de validité auquel le bénéfice de la protection subsidiaire a été accordé peut se voir délivrer un « titre d'identité et de voyage », sauf raisons impérieuses de sécurité nationale ou d'ordre public. Ce titre ne permet pas de se rendre dans le ou les États à l'égard desquels il est établi que l'intéressé y serait exposé à l'une des atteintes graves mentionnées à l'article L512-1. Aucun délai de fabrication ou de délivrance n'est fixé."],["Article L561-11 du CESEDA","L'enfant étranger mineur du réfugié ou du bénéficiaire de la protection subsidiaire qui ne peut bénéficier d'une protection au titre de l'asile peut se voir délivrer le document de voyage prévu à l'article L561-10 (titre d'identité et de voyage)."],["Article L561-12 du CESEDA","La durée de validité des documents de voyage délivrés en application des articles L561-9 à L561-11 est fixée au IV de l'article 953 du code général des impôts. Aucun délai de traitement administratif de la demande n'y est prévu."],["Article L561-13 du CESEDA","Le document de voyage peut être retiré ou son renouvellement refusé lorsque des raisons impérieuses de sécurité nationale ou d'ordre public le justifient."],["Article L582-7 du CESEDA","Distinct des titres délivrés aux réfugiés et aux bénéficiaires de la protection subsidiaire, ce texte prévoit que l'étranger reconnu apatride et titulaire d'un titre de séjour en cours de validité peut se voir délivrer un document de voyage dénommé « titre de voyage pour apatride », sauf raisons impérieuses de sécurité nationale ou d'ordre public, sa durée de validité étant elle aussi renvoyée au IV de l'article 953 du code général des impôts. Aucun délai de fabrication ou de délivrance n'est fixé."],["Article 953, IV, du Code général des impôts","Fixe à la fois la durée de validité et la taxe des titres de voyage biométriques : titre délivré aux réfugiés, apatrides ou bénéficiaires de la protection subsidiaire titulaires d'une carte de résident : valable 5 ans, taxe de 45 € ; titre délivré aux apatrides ou bénéficiaires de la protection subsidiaire titulaires d'une carte de séjour pluriannuelle de 4 ans : valable 4 ans, taxe de 40 € ; titre d'identité et de voyage délivré à un étranger non bénéficiaire d'une protection internationale (ex. enfant) : valable 1 an, taxe de 15 €. Aucune disposition n'impose de délai de délivrance."],["Article R561-8 du CESEDA","Précise les pièces à présenter à l'appui de la demande de titre de voyage : le titre de séjour dont l'intéressé est titulaire, deux photographies de face, tête nue, au format réglementaire (3,5 cm × 4,5 cm), récentes et ressemblantes, ainsi qu'un justificatif de domicile ou une déclaration de domiciliation. Le texte fixe les conditions de dépôt mais aucun délai d'instruction ni de remise du titre."]],"chiffres":[["663 241","personnes placées sous la protection de l'OFPRA fin 2024 (réfugiés, apatrides, protection subsidiaire), public concerné par ces titres"],["—","délai légal de fabrication ou de délivrance fixé pour le titre de voyage : aucun texte ne l'encadre"],["3 mois","délai minimal seulement recommandé par les préfectures pour déposer la demande avant le voyage, sans garantie de respect"]],"sources":[["CESEDA, Section 4 : Documents de voyage (articles L561-9 à L561-13) — Légifrance","https://www.legifrance.gouv.fr/codes/section_lc/LEGITEXT000006070158/LEGISCTA000042772564/"],["CESEDA, Chapitre II : Apatridie, dont l'article L582-7 (titre de voyage pour apatride) — Légifrance","https://www.legifrance.gouv.fr/codes/section_lc/LEGITEXT000006070158/LEGISCTA000042772666/"],["Code général des impôts, article 953 (validité et taxe des titres de voyage) — Légifrance","https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000041466881"],["Réfugié : titre de séjour, document de voyage et accompagnement (TVR, validité 5 ans, 45 €, ANEF) — service-public.gouv.fr","https://www.service-public.gouv.fr/particuliers/vosdroits/F15401"],["Demander un titre de voyage pour étranger bénéficiaire de la protection internationale (dépôt ANEF, recommandation 3 mois avant) — Préfecture de la Gironde","https://www.gironde.gouv.fr/Demarches/Immigration-et-integration/Demander-un-document-de-voyage-delivre-par-la-France/Refugie-Protege-subsidiaire/Demander-un-titre-de-voyage-pour-etranger-beneficiaire-de-la-protection-internationale"],["Dématérialisation des demandes via l'ANEF : des ruptures de droits graves et massives — Défenseur des droits","https://www.defenseurdesdroits.fr/dematerialisation-des-demandes-de-titres-de-sejour-lanef-des-ruptures-de-droits-graves-et-massives"]],"chips":["L561-9 (TVR)","L561-10 (TIV)","L561-12","L582-7 (apatride)","CGI art. 953-IV","R561-8"]},{"id":"p-sejour","icon":"carte","titre":"Obtenir son titre de séjour après la protection","intro":"Dès l'accord de l'OFPRA ou de la CNDA, la préfecture doit délivrer le titre de séjour. Entre-temps, l'allocation s'arrête souvent.","steps":[{"ic":"ofpraok","l":"Décision favorable (OFPRA / CNDA)"},{"ic":"pauseada","l":"L'allocation (ADA) s'arrête — risque de période sans ressources"},{"w":true,"real":"souvent > 3 mois<br>(parfois 7 mois et plus)","legal":"3 mois"},{"ic":"carte","l":"Carte de séjour ou de résident délivrée"}],"constat":"Une fois la protection accordée par l'OFPRA ou la CNDA, le préfet dispose d'un délai réglementaire de trois mois pour délivrer le titre de séjour. Les réfugiés ont droit à une carte de résident de dix ans ; les bénéficiaires de la protection subsidiaire reçoivent d'abord une carte de séjour pluriannuelle d'une durée maximale de quatre ans, puis, après quatre années de résidence régulière, une carte de résident de dix ans. En pratique, ce délai de trois mois est très fréquemment dépassé, sans qu'aucune sanction n'y soit attachée. Au renouvellement, le traitement via la plateforme dématérialisée ANEF génère des ruptures de droits documentées par le Défenseur des droits, le Conseil d'État et les associations.","probleme":"Le délai de trois mois est dépourvu de force contraignante : son dépassement n'expose l'administration à aucune sanction, et les protégés attendent souvent bien au-delà la délivrance de leur premier titre. Au renouvellement, le passage par l'ANEF, devenu le canal de droit commun, provoque des ruptures de droits : titre arrivé à expiration sans attestation de prolongation, perte de l'emploi, du logement et des prestations sociales pour des personnes qui ont pourtant pleinement le droit de séjourner. Le droit au dépôt de la demande et à l'obtention d'une attestation couvrant l'ensemble des droits (séjour, travail, prestations) n'est pas garanti de façon effective.","propositions":[["Rendre le délai de trois mois opposable et sanctionné","Compléter les articles R. 424-1 et R. 424-7 du CESEDA pour prévoir qu'à défaut de délivrance du titre dans les trois mois, une attestation valant titre de séjour (ouvrant droit au travail et aux prestations) est délivrée de plein droit, et instaurer une astreinte automatique versée à l'intéressé en cas de dépassement non justifié, sur le modèle des astreintes prononcées par le juge administratif dans le cadre du référé mesures utiles (art. L. 521-3 du code de justice administrative)."],["Délivrer automatiquement une attestation couvrant tous les droits, sans rupture","Modifier l'article R. 431-15-1 du CESEDA pour que l'attestation de prolongation d'instruction (API) soit générée automatiquement par l'ANEF dès le dépôt complet du dossier, mentionne expressément le droit au séjour, au travail et aux prestations sociales, et soit renouvelée automatiquement tant que l'instruction se poursuit, conformément à l'injonction du Conseil d'État du 5 mai 2026 (n° 502860)."],["Prolonger automatiquement la validité du titre pendant l'instruction du renouvellement","Prévoir, par décret, que le titre de séjour d'un protégé ayant déposé sa demande de renouvellement dans les délais demeure valide jusqu'à la décision expresse de la préfecture, sans condition de fenêtre de dépôt et sans démarche supplémentaire de l'usager, afin de supprimer toute période de carence administrative entre l'expiration du titre et la délivrance de l'attestation de prolongation."],["Garantir effectivement le droit au dépôt et l'accès à un rendez-vous","Rendre pleinement opérationnelle la solution de substitution prévue par le décret n° 2023-191 du 22 mars 2023 et l'arrêté du 1er août 2023 : obligation pour chaque préfecture de proposer un créneau d'accueil physique sous 30 jours en cas d'impossibilité d'utiliser l'ANEF, traçabilité horodatée de chaque tentative, et accès facilité au juge du référé mesures utiles permettant d'obtenir la délivrance d'un rendez-vous sous un mois (dans le sillage de CE, 18 février 2022, n° 455740)."],["Fiabiliser l'ANEF et publier des indicateurs de délais","Mettre en œuvre intégralement les injonctions du Conseil d'État (CE, 5 mai 2026, n° 502860) : dépôt simultané de demandes sur des fondements distincts, correction et mise à jour des dossiers déposés, fin des refus fondés à tort sur l'absence de restitution du titre antérieur, accusé de réception horodaté. Publier trimestriellement, par préfecture, le délai moyen de délivrance et de renouvellement des titres des protégés et le taux de respect du délai de trois mois, avec un comité de suivi associant le Défenseur des droits et les associations."],["Renforcer les services « étrangers » des préfectures","Pérenniser et amplifier le plan de 500 renforts annoncé : recruter des agents titulaires dans les services « séjour » des préfectures, avec un financement pluriannuel, afin d'absorber les files d'attente et de respecter le délai de trois mois."]],"base":[["Article R424-1 du CESEDA","Le préfet procède à la délivrance de la carte de résident (prévue aux articles L. 424-1 ou L. 424-3) dans un délai de trois mois à compter de la décision de reconnaissance de la qualité de réfugié par l'OFPRA ou la CNDA. Ce délai ne s'applique pas aux membres de famille visés à l'article L. 561-2 et n'est assorti d'aucune sanction en cas de dépassement."],["Article R424-7 du CESEDA","Le préfet procède à la délivrance de la carte de séjour pluriannuelle (prévue aux articles L. 424-9 ou L. 424-11) dans un délai de trois mois à compter de la décision d'octroi de la protection subsidiaire par l'OFPRA ou la CNDA. Comme pour les réfugiés, ce délai n'est assorti d'aucune sanction."],["Articles L424-1 et L424-4 du CESEDA","Le réfugié se voit délivrer une carte de résident d'une durée de dix ans (L. 424-1). L'article L. 424-4 renvoie à un décret en Conseil d'État le soin de fixer le délai de délivrance de cette carte, concrétisé par l'article R. 424-1."],["Articles L424-9 et L424-13 du CESEDA","Le bénéficiaire de la protection subsidiaire reçoit une carte de séjour pluriannuelle portant la mention « bénéficiaire de la protection subsidiaire », d'une durée maximale de quatre ans (L. 424-9). Après quatre années de résidence régulière et ininterrompue en France, il se voit délivrer une carte de résident de dix ans, sous réserve des conditions prévues (notamment l'absence de menace pour l'ordre public) (L. 424-13)."],["Articles R431-15-1 et R431-5 du CESEDA","En procédure dématérialisée, le dépôt d'une demande sur le téléservice (ANEF) donne lieu à la délivrance immédiate d'une attestation de dépôt en ligne, qui ne justifie pas de la régularité du séjour. Lorsque l'instruction d'une demande complète, déposée dans les délais, se prolonge au-delà de l'expiration du titre, le préfet met à disposition une attestation de prolongation d'instruction (API) d'une durée de validité maximale de trois mois, renouvelable (R. 431-15-1). La demande de renouvellement doit en principe être déposée entre le 120e et le 60e jour précédant l'expiration du titre (R. 431-5). Hors de cette fenêtre ou en cas de dysfonctionnement, le maintien des droits n'est pas garanti de façon effective."],["CE, Section, 3 juin 2022, n° 452798","Le Conseil d'État annule le décret rendant obligatoire le recours au téléservice ANEF en tant qu'il ne prévoit pas de solution de substitution : l'administration doit prévoir un accompagnement et une voie non dématérialisée lorsque l'usager se trouve dans l'impossibilité d'utiliser le téléservice pour des raisons tenant à sa conception ou à son mode de fonctionnement."],["Décret n° 2023-191 du 22 mars 2023 (et arrêté du 1er août 2023)","Pris en exécution de la décision du 3 juin 2022, il crée une solution de substitution (accueil physique permettant l'enregistrement de la demande) en cas d'impossibilité constatée d'utiliser le téléservice pour des raisons tenant à sa conception ou à son fonctionnement ; l'arrêté du 1er août 2023 en précise les modalités d'accompagnement et de mise en œuvre."],["CE, 5 mai 2026, n° 502860","Le Conseil d'État enjoint à l'État de remédier aux dysfonctionnements de l'ANEF : sous six mois, assurer la mise à disposition ou le renouvellement en temps utile des attestations de prolongation d'instruction et faire figurer sur les attestations les droits qui y sont attachés (notamment le droit au travail) ; permettre la mise à jour et la complétude des dossiers ; mettre fin aux refus de renouvellement fondés à tort sur l'absence de restitution du titre antérieur ; sous douze mois, permettre le dépôt simultané de demandes sur des fondements juridiques distincts."]],"chiffres":[["3 mois","Délai réglementaire de délivrance du titre après la décision OFPRA/CNDA (art. R. 424-1 et R. 424-7 du CESEDA), aujourd'hui sans sanction effective"],["28 %","Part des réclamations reçues par le Défenseur des droits en 2023 relevant du droit des étrangers, dont plus de 75 % portent sur les difficultés avec les préfectures (rapport ANEF du 11 décembre 2024)"],["6 à 12 mois","Délais impartis à l'État par le Conseil d'État le 5 mai 2026 (n° 502860) pour corriger les dysfonctionnements de l'ANEF"]],"sources":[["Légifrance — CESEDA, Section 1 : Réfugiés (R424-1 à R424-6)","https://www.legifrance.gouv.fr/codes/section_lc/LEGITEXT000006070158/LEGISCTA000042801156/"],["Légifrance — CESEDA, Section 2 : Bénéficiaires de la protection subsidiaire (R424-7 à R424-12)","https://www.legifrance.gouv.fr/codes/section_lc/LEGITEXT000006070158/LEGISCTA000042801170/"],["Légifrance — CESEDA, Titres de séjour des bénéficiaires d'une protection internationale (L424-1 à L424-21)","https://www.legifrance.gouv.fr/codes/section_lc/LEGITEXT000006070158/LEGISCTA000042771756/"],["Légifrance — Décret n° 2023-191 du 22 mars 2023 créant une solution de substitution au téléservice","https://www.legifrance.gouv.fr/jorf/id/JORFTEXT000047332636"],["Légifrance — CE, Section, 3 juin 2022, n° 452798 (téléservice obligatoire et solution de substitution)","https://www.legifrance.gouv.fr/ceta/id/CETATEXT000045863484"],["Défenseur des droits — Rapport sur l'ANEF (11 décembre 2024)","https://www.defenseurdesdroits.fr/atteintes-aux-droits-des-etrangers-le-defenseur-des-droits-publie-un-rapport-sur-ladministration"],["Conseil d'État — L'État enjoint de garantir un accès normal à la plateforme ANEF (5 mai 2026, n° 502860)","https://www.conseil-etat.fr/actualites/services-publics-le-conseil-d-etat-enjoint-a-l-etat-de-garantir-un-acces-normal-a-la-plateforme-en-ligne-de-l-anef"]],"chips":["R424-1 CESEDA","R424-7","L424-1 / L424-13","R431-15-1","CE 452798","CE 502860"]},{"id":"p-naturalisation","icon":"flagfr","titre":"Devenir français : la naturalisation","intro":"Après plusieurs années, une personne protégée peut demander la nationalité française. La loi fixe un délai… mais son point de départ peut être repoussé indéfiniment.","steps":[{"ic":"form","l":"Dépôt du dossier complet sur l'ANEF"},{"ic":"recepisse","l":"Récépissé de complétude — il fait (théoriquement) démarrer le délai"},{"w":true,"real":"3 à 4 ans<br>(souvent)","legal":"18 mois"},{"ic":"decision","l":"Décision — le silence de l'administration vaut refus"},{"ic":"flagfr","l":"Naturalisation"}],"constat":"L'article 21-25-1 du Code civil impose à l'autorité publique de répondre à une demande de naturalisation dans un délai de dix-huit mois (douze mois pour l'étranger résidant habituellement en France depuis au moins dix ans), prorogeable une seule fois de trois mois par décision motivée. Mais ce délai ne court qu'à compter de la remise de toutes les pièces d'un dossier complet, « contre laquelle un récépissé est délivré immédiatement ». Or l'article 37-1 du décret n° 93-1362 du 30 décembre 1993 prévoit que ce récépissé est délivré « dès la remise des pièces », sans assortir cette obligation d'aucun délai chiffré ni d'aucune sanction. En pratique, la remise du récépissé est différée, voire omise, ce que la Défenseure des droits a qualifié de défaillance du service public (décision n° 2024-025 du 19 février 2024). En 2024, 103 661 personnes ont acquis la nationalité française (+6,6 % sur un an), dont 48 494 par naturalisation et 48 829 acquisitions par décret (soit près d'une sur deux). La dématérialisation via la plateforme ANEF a accru le volume de dépôts sans résorber les délais d'instruction.","probleme":"Le délai légal de réponse est presque toujours contourné par un mécanisme simple : tant que le récépissé de complétude n'est pas délivré, le compteur des dix-huit mois (ou douze mois) ne démarre pas. Le demandeur reste donc dans une attente sans terme juridique, parfois plusieurs années, sans pouvoir invoquer utilement le dépassement du délai. Lorsque le délai finit par expirer, le silence de l'administration vaut refus implicite (et non acceptation), si bien que l'inaction de l'État se retourne contre l'usager. Le seul recours réel — saisir le ministre par un RAPO puis le tribunal administratif de Nantes pour faire enjoindre à l'État de statuer — ajoute plusieurs mois, voire plusieurs années de procédure, au prix d'un avocat et d'une grande incertitude.","propositions":[["Faire courir le délai dès le dépôt complet sur l'ANEF","Modifier l'article 21-25-1 du Code civil pour que le délai de dix-huit mois (douze mois) coure à compter du dépôt en ligne d'un dossier complet sur la plateforme ANEF, l'accusé d'enregistrement horodaté de la téléprocédure valant récépissé de complétude. À défaut, encadrer la délivrance du récépissé par un délai maximal bref et opposable (par exemple trente jours après réception des pièces), à inscrire à l'article 37-1 du décret n° 93-1362."],["Rendre effectif le dépassement du délai par une sanction","Prévoir qu'au-delà du délai légal non respecté, le demandeur puisse saisir le juge des référés d'une injonction de statuer assortie d'une astreinte (par exemple 100 € par jour de retard), et que l'État supporte les frais de procédure. À terme, étudier l'allègement des conditions de recevabilité du recours en cas de carence prolongée (silence au-delà du délai et de sa prorogation valant obligation de motiver expressément tout refus)."],["Imposer une décision expresse et motivée dans le délai légal","Encadrer le mécanisme du refus implicite pour la naturalisation : toute demande complète devrait recevoir une décision expresse et motivée dans le délai légal. Une demande restée sans décision notifiée dans le délai serait réputée recevable (sans préjudice du contrôle des conditions de fond), ce qui supprime l'attente sans réponse indéfinie et l'effet pervers du silence valant rejet."],["Créer une procédure accélérée pour les seuls litiges de délai","Instituer devant le tribunal administratif de Nantes une procédure spécifique et accélérée (jugement à juge unique sous quelques mois) limitée au contentieux du dépassement des délais et de la non-délivrance du récépissé, distincte du contentieux au fond portant sur l'appréciation de la demande de naturalisation."],["Transparence : suivi en ligne avec compteur du délai légal","Afficher dans l'espace ANEF de chaque demandeur la date de complétude, le délai légal applicable (douze ou dix-huit mois), un compteur du temps restant, l'étape d'instruction en cours et un délai prévisionnel ; publier chaque trimestre les délais moyens réels et le stock de dossiers de la SDANF, et renforcer les effectifs instructeurs proportionnellement au volume de dépôts."],["Donner à la SDANF les moyens de tenir le délai","Un délai n'a de sens que si l'administration peut l'honorer. Adopter un plan pluriannuel de recrutement d'instructeurs à la sous-direction de l'accès à la nationalité française (SDANF), financé par un budget dédié et dimensionné sur le nombre réel de dossiers — pour résorber le stock, pas seulement rendre le délai opposable."]],"base":[["Article 21-25-1 du Code civil","« La réponse de l'autorité publique à une demande d'acquisition de la nationalité française par naturalisation doit intervenir au plus tard dix-huit mois à compter de la remise de toutes les pièces nécessaires à la constitution d'un dossier complet contre laquelle un récépissé est délivré immédiatement. » Ce délai est réduit à douze mois pour l'étranger justifiant d'une résidence habituelle en France depuis au moins dix ans, et peut être prolongé une seule fois, par décision motivée, pour trois mois. Le point de départ du délai est la remise des pièces (matérialisée par le récépissé de complétude), et non la simple date de dépôt de la demande."],["Article 37-1 du décret n° 93-1362 du 30 décembre 1993","Dans sa rédaction en vigueur (issue notamment du décret n° 2024-108 du 14 février 2024 et applicable aux demandes déposées à compter du 1er janvier 2026), cet article énumère les pièces du dossier et dispose : « Dès la remise des pièces prévues ci-dessus, l'autorité auprès de laquelle la demande a été déposée délivre le récépissé prévu à l'article 21-25-1 du code civil. » Aucune disposition ne fixe toutefois de délai maximal chiffré et opposable pour cette délivrance : les termes « immédiatement »/« dès la remise » ne sont assortis d'aucune sanction, ce qui permet de retarder de fait le point de départ du délai légal d'instruction."],["Silence de l'administration valant rejet (art. L. 231-4 du CRPA)","Par dérogation au principe « silence vaut acceptation » (art. L. 231-1 du Code des relations entre le public et l'administration), le silence gardé par l'administration sur une demande de naturalisation par décret vaut décision implicite de REJET, et non d'acceptation. De même, le silence gardé pendant quatre mois par le ministre chargé des naturalisations sur le recours administratif préalable obligatoire (RAPO) vaut décision implicite de rejet."],["Compétence juridictionnelle exclusive et voies de recours","Une décision défavorable (irrecevabilité, ajournement, rejet) doit d'abord être contestée par un recours administratif préalable obligatoire (RAPO) devant le ministre chargé des naturalisations, dans un délai de deux mois ; son rejet (exprès ou implicite après quatre mois de silence) peut ensuite être attaqué devant le tribunal administratif de Nantes, seul compétent au plan national pour les litiges relatifs aux décisions de la sous-direction de l'accès à la nationalité française (SDANF), dans un délai de deux mois. Le juge administratif peut enjoindre à l'administration de statuer, le cas échéant sous astreinte. L'illégalité d'un refus de délivrer le récépissé fondé sur l'article 21-25-1 a notamment été reconnue par le juge administratif (voir, par exemple, TA Lyon, 22 déc. 2022, n° 2109861)."]],"chiffres":[["18 mois","Délai légal maximal de réponse (12 mois si 10 ans de résidence), à compter du récépissé de complétude — art. 21-25-1 C. civ."],["3 à 4 ans","Durée réelle souvent constatée jusqu'à la réponse, le délai de délivrance du récépissé n'étant pas encadré (point de départ retardé) — rapport du Défenseur des droits, 2022"],["48 494","Naturalisations en 2024 (sur 103 661 acquisitions de la nationalité, +6,6 % sur un an) ; près d'une acquisition sur deux par décret"]],"sources":[["Article 21-25-1 du Code civil — Légifrance","https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000006419662"],["Article 37-1 du décret n° 93-1362 du 30 décembre 1993 (récépissé prévu à l'art. 21-25-1) — Légifrance","https://www.legifrance.gouv.fr/loda/article_lc/LEGIARTI000051906775"],["Décision du Défenseur des droits n° 2024-025 du 19 février 2024 (non-délivrance du récépissé de complétude, art. 21-25-1)","https://juridique.defenseurdesdroits.fr/index.php?lvl=notice_display&id=49828"],["Naturalisation par décret : délais et recours (tribunal administratif de Nantes) — service-public.gouv.fr","https://www.service-public.gouv.fr/particuliers/vosdroits/F2213"],["Intégration et accès à la nationalité française — chiffres 2024, Direction générale des étrangers en France (ministère de l'Intérieur)","https://www.immigration.interieur.gouv.fr/fr/Info-ressources/Etudes-et-statistiques/Les-chiffres-de-l-immigration-en-France/Integration-et-l-acces-a-la-nationalite-francaise"],["Rapport du Défenseur des droits, « Devenir français par naturalisation » (février 2022)","https://www.defenseurdesdroits.fr/fr/rapports/2022/02/rapport-devenir-francais-par-naturalisation-recommandations-visant-a-faire"]],"chips":["Art. 21-25-1 C. civ.","Art. 37-1 décret 93-1362","Art. L. 231-4 CRPA","TA de Nantes"]},{"id":"reunification-familiale-dcem","icon":"family","titre":"Faire venir et faire circuler ses enfants : réunification familiale et document de circulation (DCEM)","intro":"Une personne reconnue réfugiée ou bénéficiaire de la protection subsidiaire a le droit de faire venir sa famille restée à l'étranger (réunification familiale), sans condition de ressources, de logement ni de durée de séjour. Une fois la famille en France, l'enfant mineur étranger a besoin d'un document de circulation (DCEM) pour voyager hors de France et revenir sans visa. Sur le papier, ces droits sont clairs. En pratique, tout se bloque souvent au même endroit : l'état civil. Les consulats et les préfectures réclament des actes de naissance récents (parfois « de moins de 3 mois ») que la personne protégée ne peut, par définition, pas demander aux autorités du pays qu'elle a fui. Elle dépend alors de la reconstitution de son état civil par l'OFPRA, dont les délais réels se comptent en mois, sans qu'aucun délai légal ne soit opposable à l'administration.","steps":[{"ic":"ofpraok","l":"Protection accordée (statut OFPRA/CNDA)"},{"ic":"form","l":"Demande de réunification familiale (visa au consulat) ou de DCEM (préfecture, en ligne ANEF)"},{"ic":"acte","l":"L'OFPRA reconstitue l'état civil et certifie la composition familiale"},{"ic":"warning","l":"Obstacle : acte de naissance « récent » exigé, impossible à obtenir du pays d'origine"},{"w":true,"real":"Réunification familiale : visa souvent délivré en 3 à 8 mois,<br>allongé quand l'état civil n'est pas encore établi (reconstitution OFPRA ~6 à 12 mois).<br>DCEM : 2 à 4 mois constatés en préfecture.","legal":"DCEM : « Non établi » (aucun délai opposable de délivrance).<br>Réunification : aucun délai imposé par le CESEDA."},{"ic":"check","l":"Document délivré / famille réunie"}],"constat":"Le droit est généreux mais l'accès est étranglé par un goulot administratif : l'état civil. La réunification familiale des réfugiés ne dépend ni des ressources ni du logement (CESEDA art. L561-2), et le DCEM est délivré de plein droit à l'enfant. Mais consulats, mairies et préfectures réclament des actes d'état civil récents qu'une personne protégée ne peut pas obtenir de son pays d'origine sans se mettre en danger ni perdre le sens même de sa protection. Elle dépend donc entièrement de la reconstitution de son état civil par l'OFPRA, dont les délais ont doublé en cinq ans (177 jours en 2019, 240 jours en 2021), atteignant localement jusqu'à un an. Pendant ce temps, aucun délai légal n'est opposable : le silence de l'administration ne fait courir aucune sanction efficace, et les familles restent séparées des mois durant.","probleme":"L'exigence d'un acte de naissance « de moins de 3 mois » est en pratique impossible à satisfaire pour une personne protégée : elle ne peut pas s'adresser aux autorités du pays qu'elle a fui, et son état civil français dépend d'une reconstitution OFPRA aux délais longs et non encadrés. Le résultat est un blocage circulaire : la préfecture ou le consulat attend un document que seul l'OFPRA peut produire, l'OFPRA prend plusieurs mois, et aucun délai légal opposable ne permet de débloquer la situation. Les enfants restent séparés d'un parent, ou ne peuvent ni voyager ni rendre visite à la famille faute de DCEM.","chiffres":[["—","Délai légal opposable de délivrance du DCEM"],["~6 à 12 mois","Reconstitution réelle de l'état civil par l'OFPRA"],["2 mois","Délai au terme duquel le silence vaut refus (DCEM)"]],"propositions":[["Interdire l'exigence d'actes « récents » aux personnes protégées","Diffuser une instruction nationale rappelant que les actes établis par l'OFPRA ont valeur d'actes authentiques et qu'aucune fraîcheur (« moins de 3 mois ») ne peut être exigée d'une personne protégée."],["Instaurer un délai opposable pour la reconstitution OFPRA","Fixer un délai maximal réglementaire de traitement de l'état civil, assorti d'une attestation provisoire opposable aux préfectures et consulats dans l'intervalle."],["Renforcer les moyens de la division de l'état civil de l'OFPRA","Augmenter les effectifs et le budget dédiés afin de résorber le stock et de ramener les délais sous 3 mois, le volume de personnes protégées ayant fortement crû."],["Reconnaître l'attestation provisoire comme pièce suffisante","Permettre, de droit, l'instruction d'une demande de visa de réunification ou de DCEM sur la base de l'attestation provisoire de composition familiale, sans attendre l'acte définitif."],["Information claire et accompagnement","Mettre à disposition, sur service-public.gouv.fr et dans les préfectures, une notice unique expliquant l'enchaînement OFPRA → consulat → préfecture et les voies de recours."],["Faciliter et clarifier le recours","Rappeler systématiquement, en cas de refus de visa, l'obligation de saisir la Commission de recours contre les refus de visa (CRRV) dans les 30 jours avant le tribunal administratif de Nantes."]],"base":[["CESEDA, art. L561-2","Le réfugié ou bénéficiaire de la protection subsidiaire peut être rejoint par son conjoint/partenaire et ses enfants, sans condition de durée de séjour, de ressources ni de logement (sauf menace pour l'ordre public)."],["CESEDA, art. R561-1 à R561-3","La demande de visa des membres de la famille est déposée auprès de l'autorité consulaire, qui sollicite auprès de l'OFPRA une certification de la composition familiale et de l'état civil du réfugié."],["CESEDA, art. D414-1 à D414-4","Le document de circulation pour étranger mineur (DCEM) est délivré par le préfet, sur demande de la personne exerçant l'autorité parentale, pour une durée maximale de 5 ans."],["CESEDA, art. L121-13 / L561-2","Les actes d'état civil établis par l'OFPRA pour les personnes protégées ont la valeur d'actes authentiques."]],"chips":["CESEDA art. L561-2","CESEDA art. R561-1","CESEDA art. R561-3","CESEDA art. D414-1","CESEDA art. D414-4"],"sources":[["Légifrance — CESEDA, Réunification familiale (art. L561-2 à L561-5)","https://www.legifrance.gouv.fr/codes/section_lc/LEGITEXT000006070158/LEGISCTA000042772546/"],["Légifrance — CESEDA, Documents de circulation pour étrangers mineurs (art. D414-1 à D414-4)","https://www.legifrance.gouv.fr/codes/section_lc/LEGITEXT000006070158/LEGISCTA000042800892/"],["OFPRA — La reconstitution de l'état civil","https://www.ofpra.gouv.fr/en/folder/institutions/civil-status-reconstitution"],["Sénat — Délais de reconstitution et de délivrance des actes d'état civil (réunification familiale)","https://www.senat.fr/questions/base/2022/qSEQ220700483.html"]]},{"id":"droit-au-compte","icon":"bank","titre":"Ouvrir un compte bancaire : le droit au compte","intro":"Disposer d'un compte de dépôt est indispensable pour percevoir l'allocation, recevoir un salaire, payer un loyer ou souscrire un abonnement. Pourtant, faute de contrat de travail durable, de justificatif de domicile stable ou d'historique bancaire en France, de nombreuses personnes protégées (dont des bénéficiaires de la protection temporaire venus d'Ukraine) se voient refuser l'ouverture d'un compte par les banques. Le droit français prévoit une réponse à cette situation : le « droit au compte ». Toute personne domiciliée en France qui se voit refuser un compte peut saisir la Banque de France, qui désigne alors d'office un établissement tenu d'ouvrir le compte, gratuitement, avec des services bancaires de base. Ce parcours décrit la procédure, ses délais théoriques et les écarts constatés sur le terrain.","steps":[{"ic":"euro","l":"Besoin d'un compte de dépôt"},{"ic":"warning","l":"Refus ou limitation par la banque (pas de CDI / domicile)"},{"ic":"form","l":"Saisine de la Banque de France au titre du droit au compte"},{"ic":"bank","l":"Désignation d'office d'un établissement"},{"w":true,"real":"Variable : la désignation est souvent rapide, mais l'ouverture effective connaît des reports fréquents — demandes de pièces supplémentaires, rendez-vous repoussés.<br>Délais d'attente de plusieurs semaines régulièrement signalés.","legal":"1 jour ouvré pour la désignation, puis 3 jours ouvrés pour l'ouverture du compte par la banque désignée (à compter de la réception des pièces)"},{"ic":"check","l":"Compte ouvert avec services bancaires de base gratuits"}],"constat":"La loi est claire et protectrice : une fois la Banque de France saisie, l'ouverture du compte n'est plus une faveur mais une obligation pour la banque désignée, dans des délais courts (1 jour ouvré pour la désignation, 3 jours ouvrés pour l'ouverture). Sur le papier, aucune personne domiciliée en France ne devrait rester sans compte.","probleme":"Dans les faits, le parcours reste semé d'embûches. Beaucoup de personnes ignorent l'existence même du droit au compte ; les agences renvoient parfois vers la procédure sans l'expliquer. Au stade de l'ouverture effective, on observe des demandes répétées de justificatifs (domicile, identité), des rendez-vous repoussés et des comptes ouverts a minima, parfois clôturés peu après. Les services bancaires de base, sans découvert ni chéquier classique, ne permettent pas toujours de mener une vie économique normale (un bailleur ou un employeur peut être réticent). La barrière de la langue et la complexité administrative aggravent l'écart entre le délai légal de 3 jours ouvrés et le délai réellement vécu.","chiffres":[["1 jour","ouvré pour la désignation d'une banque par la Banque de France"],["3 jours","ouvrés pour l'ouverture du compte par la banque désignée"],["12","services bancaires de base gratuits garantis"]],"propositions":[["Information systématique sur le droit au compte","Remettre, lors de tout refus d'ouverture, une notice écrite multilingue expliquant la saisine de la Banque de France et l'établir comme un réflexe en agence."],["Accompagnement dédié pour les personnes protégées","Mobiliser les intervenants sociaux (déjà habilités à saisir la Banque de France) et les associations pour constituer les dossiers et suivre les délais jusqu'à l'ouverture effective."],["Faire respecter le délai de 3 jours ouvrés","Mettre en place un suivi des reports et un signalement simple (Banque de France, ACPR, Défenseur des droits) lorsque la banque désignée tarde au-delà du délai légal."],["Clarifier les pièces exigibles","Diffuser une liste-type des justificatifs admis (titre de séjour / protection temporaire, attestation de domiciliation) pour éviter les demandes abusives de documents."],["Renforcer les moyens d'accueil","Recruter et former des agents et médiateurs multilingues à la Banque de France et dans les réseaux d'aide, et financer les structures de domiciliation, pour absorber les flux et réduire les délais réels."],["Élargir l'utilité des services de base","Encourager les banques à proposer, au-delà des services minimaux, des solutions de paiement réellement utilisables pour le logement et l'emploi."]],"base":[["CMF art. L312-1, I","Toute personne physique ou morale domiciliée en France a droit à l'ouverture d'un compte de dépôt dans l'établissement de crédit de son choix."],["CMF art. L312-1, II","En cas de refus, la personne peut saisir la Banque de France, qui désigne un établissement de crédit dans un délai d'un jour ouvré à compter de la réception des pièces requises."],["CMF art. L312-1, III","L'établissement désigné est tenu d'ouvrir le compte dans un délai de trois jours ouvrés à compter de la réception de l'ensemble des pièces."],["CMF art. D312-5","L'établissement désigné assure gratuitement les services bancaires de base (les douze services prévus par le décret)."]],"chips":["CMF art. L312-1","CMF art. D312-5","Charte d'accessibilité bancaire"],"sources":[["Banque de France — Faire valoir votre droit au compte","https://www.banque-france.fr/fr/a-votre-service/particuliers/faire-valoir-droit-au-compte-bancaire"],["Légifrance — Code monétaire et financier, article L312-1","https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000044605348/"],["economie.gouv.fr — La procédure de droit au compte (DAC)","https://www.economie.gouv.fr/particuliers/gerer-mon-argent/gerer-mon-budget-et-mon-epargne/comment-utiliser-la-procedure-de-droit-au-compte-dac-pour-ouvrir-un-compte-bancaire"],["ABE Infoservice — Droit au compte","https://www.abe-infoservice.fr/fr/banque/droit-au-compte"]]},{"id":"se-loger-logement-social","icon":"house","titre":"Se loger : logement social et sortie de l'hébergement","intro":"Une fois protégées, beaucoup de personnes réfugiées vivent en hébergement d'urgence ou en logement temporaire. Pour accéder à un logement durable, la voie principale est la demande de logement social, enregistrée sous un « numéro unique ». Mais l'offre est très inférieure à la demande : l'attente se compte souvent en mois, voire en années, alors que la place en hébergement, elle, peut être remise en cause. Ce parcours décrit les étapes, les délais réels constatés et les droits qui protègent la personne pendant l'attente, notamment le droit au logement opposable (DALO).","steps":[{"ic":"house","l":"Besoin de logement / fin de l'hébergement d'urgence"},{"ic":"form","l":"Demande de logement social (numéro unique)"},{"ic":"recepisse","l":"Attestation d'enregistrement (dans le mois)"},{"w":true,"real":"Plusieurs mois à plusieurs années<br>selon le territoire et la composition familiale","legal":"« Délai anormalement long » fixé par arrêté préfectoral, variable selon le département (ex. 24 mois, 36 mois)"},{"ic":"warning","l":"Risque de devoir quitter l'hébergement avant relogement"},{"ic":"check","l":"Proposition de logement (ou recours DALO)"}],"constat":"La demande de logement social repose sur un dispositif clair et opposable : enregistrement, numéro unique, attestation dans le mois, et un droit de recours (DALO) si l'attente dépasse le « délai anormalement long ». Sur le papier, le maintien en hébergement d'urgence est garanti tant qu'aucune solution adaptée n'est proposée.","probleme":"En pratique, l'écart entre l'offre et la demande de logements sociaux rend l'attente très longue, sans plafond légal universel. Le « délai anormalement long » varie d'un département à l'autre et n'ouvre qu'un recours, non un logement immédiat. Surtout, la tension sur les places d'hébergement conduit à des fins de prise en charge alors que la personne n'est pas relogée : le principe de continuité de l'hébergement (CASF art. L345-2-3) est fragilisé faute de places, exposant à des remises à la rue de fait.","chiffres":[["1 mois","délai légal pour recevoir l'attestation avec le numéro unique (CCH art. L441-2-1)"],["3 mois","délai pour reloger après décision DALO favorable (6 mois en outre-mer et grandes agglomérations)"],["—","aucun délai national garanti d'attribution d'un logement social"]],"propositions":[["Sécuriser le maintien en hébergement","Garantir effectivement le principe de continuité (CASF art. L345-2-3) : pas de fin de prise en charge sans solution adaptée proposée, ni remise à la rue."],["Information dès l'octroi de la protection","Accompagner chaque personne protégée pour déposer la demande de logement social et obtenir son numéro unique sans délai, dans une langue comprise."],["Mieux faire connaître le DALO","Informer systématiquement sur le recours amiable devant la commission de médiation dès que le délai anormalement long est atteint, et sur le recours contentieux."],["Harmoniser les « délais anormalement longs »","Réduire les écarts entre départements et publier clairement l'arrêté préfectoral applicable à chaque territoire."],["Renforcer les moyens : offre et accompagnement","Augmenter le contingent de logements mobilisables (contingent préfectoral, Action Logement) et financer les travailleurs sociaux et associations d'accompagnement vers et dans le logement."],["Articuler hébergement et relogement","Fluidifier le passage de l'hébergement vers le logement (intermédiation locative, bail glissant) pour éviter les ruptures de parcours."]],"base":[["CCH art. L441-2-1","Toute demande de logement social est enregistrée et donne lieu à un numéro unique national ; une attestation est délivrée dans le mois ; aucune attribution sans enregistrement et numéro unique."],["CCH art. L300-1 (loi n° 2007-290 du 5 mars 2007)","Le droit à un logement décent et indépendant est garanti par l'État à toute personne résidant régulièrement et ne pouvant y accéder ou s'y maintenir par ses propres moyens (DALO)."],["CCH art. L441-2-3","La commission de médiation peut être saisie sans délai par le demandeur n'ayant pas reçu de proposition adaptée au terme du délai anormalement long fixé par le préfet ; le préfet doit ensuite reloger le bénéficiaire désigné prioritaire."],["CASF art. L345-2-3","Toute personne accueillie en hébergement d'urgence doit pouvoir y demeurer, dès lors qu'elle le souhaite, jusqu'à une orientation vers une solution adaptée (principe de continuité)."]],"chips":["CCH art. L441-2-1","CCH art. L300-1","CCH art. L441-2-3","Loi n° 2007-290 du 5 mars 2007","CASF art. L345-2-3","CASF art. L345-2-2"],"sources":[["Légifrance — CCH art. L441-2-1 (numéro unique)","https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000033971871"],["Légifrance — Loi n° 2007-290 du 5 mars 2007 (DALO)","https://www.legifrance.gouv.fr/loda/id/JORFTEXT000000271094"],["ANIL — Droit au logement opposable (DALO) : conditions et délais","https://www.anil.org/votre-projet/vous-etes-locataire/locataire-en-difficulte/droit-au-logement-et-a-lhebergement-opposable/
