    flagfr: '<svg viewBox="0 0 40 40" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M11.5 5.5v29" stroke="'+B+'" stroke-width="2.6"/><rect x="12.8" y="8" width="6.2" height="12" fill="'+B+'"/><rect x="19" y="8" width="6.2" height="12" fill="#ffffff"/><rect x="25.2" y="8" width="6.2" height="12" fill="'+R+'"/><rect x="12.8" y="8" width="18.6" height="12" rx="1" stroke="'+B+'" stroke-width="2" fill="none"/></svg>',
    ofpraok: svg('<path d="M20 4.5l12.5 4v8.2c0 8.6-5.3 13.8-12.5 16.8-7.2-3-12.5-8.2-12.5-16.8V8.5z"/><path d="M14.5 19l4 4 7.5-8.5" stroke="'+R+'"/>'),
    actebarre: svg('<path d="M23.8 6H12.5a3 3 0 0 0-3 3v22a3 3 0 0 0 3 3h15a3 3 0 0 0 3-3V12.7z"/><path d="M23.8 6v6.7h6.7"/><path d="M14.5 18.5h11M14.5 22.5h8"/><circle cx="28" cy="28.5" r="6.5" stroke="'+R+'"/><path d="M23.4 33.1L32.6 23.9" stroke="'+R+'"/>'),
    acte: svg('<path d="M23.8 6H12.5a3 3 0 0 0-3 3v22a3 3 0 0 0 3 3h15a3 3 0 0 0 3-3V12.7z"/><path d="M23.8 6v6.7h6.7"/><path d="M14.5 18.5h11M14.5 22.5h8"/><circle cx="26.5" cy="28.5" r="3.8" stroke="'+R+'"/><path d="M24.8 31.9l-1.7 4.3M28.2 31.9l1.7 4.3" stroke="'+R+'"/>'),
    unlock: svg('<rect x="8.5" y="18" width="23" height="15" rx="3"/><path d="M13.5 18v-6a6.5 6.5 0 0 1 12.8-1.6"/><circle cx="20" cy="24.5" r="2" stroke="'+R+'"/><path d="M20 26.5v3.2" stroke="'+R+'"/>'),
    plane: svg('<path d="M34 6L6 16l10 4 4 10z"/><path d="M16 20l4.5-4.5"/><path d="M32.5 7.5L20.5 19.5" stroke="'+R+'"/>'),
    planeok: svg('<path d="M34 6L6 16l10 4 4 10z"/><path d="M16 20l4.5-4.5"/><circle cx="29" cy="29" r="5.5" stroke="'+R+'"/><path d="M26.5 29l1.9 1.9 3.9-4.4" stroke="'+R+'"/>'),
    passport: svg('<rect x="9.5" y="6" width="21" height="28" rx="3.5"/><circle cx="20" cy="15.5" r="4.4"/><path d="M16.4 15.5h7.2"/><path d="M15 27h10"/><path d="M15 30.5h6" stroke="'+R+'"/>'),
    passportno: svg('<rect x="9.5" y="6" width="21" height="28" rx="3.5"/><circle cx="20" cy="15.5" r="4.4"/><path d="M16.4 15.5h7.2"/><path d="M15 27h10M15 30.5h6"/><circle cx="30" cy="9.5" r="6" stroke="'+R+'"/><path d="M25.8 13.7L34.2 5.3" stroke="'+R+'"/>'),
    carte: svg('<rect x="5" y="10.5" width="30" height="19" rx="3"/><circle cx="13.5" cy="18" r="3.2"/><path d="M9.5 24.5h8"/><path d="M22.5 15.5h9M22.5 19.5h9M22.5 23.5h5.5" stroke="'+R+'"/>'),
    pauseada: svg('<circle cx="18" cy="17" r="10"/><path d="M22.3 13.4a5.6 5.6 0 1 0 0 7.2M12.8 15.2h6.5M12.8 18.8h6"/><path d="M30 22v10.5M26.8 29.1l3.2 3.4 3.2-3.4" stroke="'+R+'"/>'),
    family: svg('<circle cx="12.5" cy="11" r="3.5"/><path d="M6 28.5c0-4.8 2.8-7.3 6.5-7.3s6.5 2.5 6.5 7.3"/><circle cx="27.5" cy="11" r="3.5"/><path d="M21 28.5c0-4.8 2.8-7.3 6.5-7.3s6.5 2.5 6.5 7.3"/><circle cx="20" cy="24" r="2.7" stroke="'+R+'"/><path d="M15.2 35c0-3 2.1-4.9 4.8-4.9s4.8 1.9 4.8 4.9" stroke="'+R+'"/>'),
    warning: svg('<path d="M20 6l15.5 27.5H4.5z"/><path d="M20 15.5v8" stroke="'+R+'"/><circle cx="20" cy="28.7" r="1.5" fill="'+R+'" stroke="none"/>'),
    timer: svg('<circle cx="20" cy="23" r="12"/><path d="M20 11V7.8M16.8 6h6.4M29.3 12.6l2.3-2.3"/><path d="M20 23v-6.8M20 23l4.6 2.7"/>', O),
    law: svg('<path d="M20 8v24M13 32h14M8 12h24"/><circle cx="20" cy="6.3" r="1.6"/><path d="M8 12l-3.5 8m3.5-8l3.5 8M32 12l-3.5 8m3.5-8l3.5 8"/><path d="M4.5 20a3.5 3.5 0 0 0 7 0M28.5 20a3.5 3.5 0 0 0 7 0"/>'),
    check: svg('<circle cx="20" cy="20" r="13.5"/><path d="M13.5 20.5l4.8 4.8 8.6-10" stroke="'+R+'"/>'),
    bank: svg('<path d="M5.5 15.5L20 6.5l14.5 9"/><path d="M8 19h24"/><path d="M11 22.5v6.5M17 22.5v6.5M23 22.5v6.5M29 22.5v6.5"/><path d="M6.5 32.5h27"/><circle cx="20" cy="13" r="1.7" fill="'+R+'" stroke="none"/>'),
    house: svg('<path d="M5.5 18L20 6l14.5 12"/><path d="M9 16.5V33h22V16.5"/><path d="M17.3 33v-7.2h5.4V33"/><circle cx="20" cy="15" r="1.7" fill="'+R+'" stroke="none"/>'),
    car: svg('<path d="M12.5 22l3-6.5a2.6 2.6 0 0 1 2.4-1.7h4.2a2.6 2.6 0 0 1 2.4 1.7l3 6.5"/><path d="M4.5 29v-3.8a3 3 0 0 1 3-3.2h25a3 3 0 0 1 3 3.2V29"/><path d="M4.5 29h4.3M15.3 29h9.4M31.2 29h4.3"/><circle cx="12" cy="29" r="3.3"/><circle cx="28" cy="29" r="3.3"/><path d="M20 14.3v6.2" stroke="'+R+'"/>'),
    euro: svg('<circle cx="20" cy="20" r="13"/><path d="M25.5 14.9a7.1 7.1 0 1 0 0 10.2M13.9 18.1h7.6M13.9 21.9h7" stroke="'+R+'"/>'),
    permis: svg('<rect x="4.5" y="9" width="31" height="22" rx="3.5"/><circle cx="14" cy="20" r="5.6"/><circle cx="14" cy="20" r="1.9" stroke="'+R+'"/><path d="M14 14.4v3.7M9.2 22.4l3.1-1.4M18.8 22.4l-3.1-1.4" stroke="'+R+'"/><path d="M23 16.5h8M23 20h8M23 23.5h5.5"/>'),
    key: svg('<circle cx="12.5" cy="20" r="5.5"/><path d="M18 20h16.5M29.5 20v5.8M34.5 20v4.8"/><circle cx="12.5" cy="20" r="1.6" fill="'+R+'" stroke="none"/>')
  };
  function icon(n){return ICONS[n]||ICONS.form;}
  const ARC='<svg viewBox="0 0 60 40" fill="none"><path d="M6 20h37" stroke="'+B+'" stroke-width="3" stroke-linecap="round" stroke-dasharray="0.5 8"/><path d="M54 20L44.5 15.2v9.6z" fill="'+B+'"/></svg>';
  const WRAP='<svg class="curve" viewBox="0 0 100 54" preserveAspectRatio="none"><path d="M100 6 C 82 48, 28 52, 4 41" stroke="'+B+'" stroke-width="3.2" fill="none" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg><svg class="head" viewBox="0 0 26 26" fill="none"><path d="M3.5 23 L4 9.5 L15.5 18 Z" fill="'+B+'"/></svg>';

  function get(lang){const n=document.getElementById('SITE-'+lang);if(!n)return null;try{return JSON.parse(n.textContent);}catch(e){console.error('parse',lang,e);return null;}}
  let io,spy;

  function legalBadge(s,UI){
    return s.legal
      ? '<div class="legalbadge"><span>'+icon('law')+'</span><span class="lt"><span class="lbl">'+esc(UI.lawLabel)+'</span>'+esc(s.legal)+'</span></div>'
      : '<div class="legalbadge none"><span>'+icon('law')+'</span><span class="lt"><span class="lbl">'+esc(UI.lawLabel)+'</span>'+esc(UI.notSet)+'</span></div>';
  }
  function flowNode(s,UI,noBadge){
    if(s.w){
      const legalHtml = legalBadge(s,UI);
      return '<div class="node wait"><div class="ic">'+icon('timer')+'</div>'
        +'<div class="real"><span class="lbl">'+esc(UI.realLabel)+'</span>'+s.real+'</div>'+(noBadge?'':legalHtml)+'</div>';
    }
    const warn = (s.ic==='actebarre'||s.ic==='passportno'||s.ic==='pauseada'||s.ic==='warning')?' warn':'';
    return '<div class="node'+warn+'"><div class="ic">'+icon(s.ic)+'</div><div class="cap">'+esc(s.l)+'</div></div>';
  }
  function fitsOneRow(steps){
    var NW=134,WW=134,CW=44;
    var need=steps.reduce(function(a,s){return a+(s.w?WW:NW);},0)+(steps.length-1)*CW;
    var avail=Math.min(window.innerWidth||1200,1200)-116;
    return avail>=need;
  }
  function detailBlock(p,L){
    if(!p.constat||!L) return '';
    var ch = (p.chiffres&&p.chiffres.length)? '<div class="chiffres">'+p.chiffres.map(function(c){return '<div class="stat2"><div class="sn">'+esc(c[0])+'</div><div class="sl">'+esc(c[1])+'</div></div>';}).join('')+'</div>' : '';
    var props = '<div class="props">'+(p.propositions||[]).map(function(x,i){return '<div class="prop"><span class="pn">'+esc(L.propWord)+' '+(i+1)+'</span><h4>'+esc(x[0])+'</h4><p>'+esc(x[1])+'</p></div>';}).join('')+'</div>';
    var base = (p.base||[]).map(function(b){return '<div class="legal-item"><div class="lref">'+esc(b[0])+'</div><div class="ltext">'+esc(b[1])+'</div></div>';}).join('');
    var chips = (p.chips||[]).map(function(c){return '<span class="chip">'+esc(c)+'</span>';}).join('');
    var src = (p.sources||[]).map(function(s){return '<li><a href="'+esc(s[1])+'" target="_blank" rel="noopener">'+esc(s[0])+'</a></li>';}).join('');
    return '<div class="pc-detail">'
      +'<div class="blk"><div class="blabel">'+esc(L.constat)+'</div><p class="prose">'+p.constat+'</p></div>'
      +ch
      +'<div class="probleme"><div class="blabel">'+esc(L.probleme)+'</div><p>'+p.probleme+'</p></div>'
      +'<div class="blk"><div class="blabel">'+esc(L.propositions)+'</div>'+props+'</div>'
      +'<details class="fw"><summary><span>'+esc(L.fond)+'</span>'+chips+'<span class="chev">▾</span></summary><div class="fw-body">'+base+'<ul class="src-list">'+src+'</ul></div></details>'
      +'</div>';
  }
  function parcours(p,UI,L){
    var steps=p.steps, single=(pdfMode?false:fitsOneRow(steps)), flow='';
    if(single){
      var r='',badge='';
      steps.forEach(function(s,si){
        if(si>0) r+='<div class="conn">'+ARC+'</div>';
        if(s.w) badge=legalBadge(s,UI);
        r+=flowNode(s,UI,true);
      });
      flow='<div class="flow"><div class="flow-row">'+r+'</div></div>'+(badge?'<div class="legalstrip">'+badge+'</div>':'');
    } else {
      var inner='';
      steps.forEach(function(s,si){ if(si>0) inner+='<div class="conn down">'+ARC+'</div>'; inner+=flowNode(s,UI); });
      flow='<div class="flow vert">'+inner+'</div>';
    }
    return '<div class="parcours reveal" id="'+p.id+'"><div class="pc-head"><div class="pc-ic">'+icon(p.icon)+'</div><div><h3>'+esc(p.titre)+'</h3><p>'+esc(p.intro)+'</p></div></div><div class="flow-wrap">'+flow+'</div>'+detailBlock(p,L)+'</div>';
  }

  function render(lang){
    const D=get(lang)||get('fr'); const UI=D.ui;
    document.documentElement.lang=lang; document.title=D.meta.title;
    $('#brandText').textContent=UI.brand;
    $('#navLinks').innerHTML=UI.nav.map(n=>'<li><a class="link" href="#'+n[0]+'">'+esc(n[1])+'</a></li>').join('');
    let h='';
    // hero
    h+='<section class="hero"><div class="wrap">'
      +'<div class="eyebrow reveal"><span class="tricolore"><i></i><i></i><i></i></span>'+esc(D.hero.eyebrow)+'</div>'
      +'<h1 class="reveal">'+esc(D.hero.h1a)+' <span class="r">'+esc(D.hero.h1b)+'</span></h1>'
      +'<p class="lead reveal">'+esc(D.hero.lead)+'</p>'
      +'<div class="cta-row reveal"><a class="btn primary" href="#parcours">'+esc(UI.ctaPrimary)+'</a><a class="btn" href="delais-droits-'+lang+'.pdf" download>'+esc(UI.ctaSecondary)+'</a></div>'
      +'<p class="note reveal">'+esc(D.hero.note)+'</p></div></section>';
    // stats
    const S=D.stats;
    h+='<section class="sec alt" id="chiffres"><div class="wrap"><div class="section-tag reveal">'+esc(S.tag)+'</div><h2 class="reveal">'+esc(S.h)+'</h2><p class="sub reveal">'+esc(S.sub)+'</p>'
      +'<div class="stat-grid">'+S.cards.map(c=>'<div class="stat reveal"><div class="sn">'+esc(c[0])+'</div><div class="sl">'+esc(c[1])+'</div><div class="ss">'+esc(c[2])+'</div></div>').join('')+'</div>'
      +'<div class="context reveal"><h3>'+esc(S.context.h)+'</h3><p>'+esc(S.context.p)+'</p></div></div></section>';
    // parcours
    const P=D.parcours;
    h+='<section class="sec" id="parcours"><div class="wrap"><div class="section-tag reveal">'+esc(P.tag)+'</div><h2 class="reveal">'+esc(P.h)+'</h2><p class="sub reveal">'+esc(P.sub)+'</p>'
      +P.items.map(p=>parcours(p,UI,D.labels)).join('')+'</div></section>';
    // comparatif
    const C=D.comparatif;
    h+='<section class="sec alt" id="comparatif"><div class="wrap"><div class="section-tag reveal">'+esc(C.tag)+'</div><h2 class="reveal">'+esc(C.h)+'</h2><p class="sub reveal">'+esc(C.sub)+'</p>'
      +'<div class="cmp-grid">'+C.rows.map(r=>{const none=/non établi|не установ|not set|не встановл/i.test(r[2])?' none':'';return '<div class="cmp reveal"><h4>'+esc(r[0])+'</h4><div class="bars"><div class="line real"><span class="tg">'+esc(UI.realLabel)+'</span><span class="val">'+esc(r[1])+'</span></div><div class="line law"><span class="tg">'+esc(UI.lawLabel)+'</span><span class="val'+none+'">'+esc(r[2])+'</span></div></div></div>';}).join('')+'</div></div></section>';
    // propositions
    const PR=D.propositions;
    h+='<section class="sec" id="propositions"><div class="wrap"><div class="section-tag reveal">'+esc(PR.tag)+'</div><h2 class="reveal">'+esc(PR.h)+'</h2><p class="sub reveal">'+esc(PR.sub)+'</p>'
      +'<div class="pgrid">'+PR.cards.map(c=>'<div class="pcard reveal"><div class="pi">'+esc(c[0])+'</div><h4>'+esc(c[1])+'</h4><p>'+esc(c[2])+'</p></div>').join('')+'</div></div></section>';
    // cadre juridique
    const F=D.cadre;
    h+='<section class="sec alt" id="cadre"><div class="wrap"><div class="section-tag reveal">'+esc(F.tag)+'</div><h2 class="reveal">'+esc(F.h)+'</h2><p class="sub reveal">'+esc(F.sub)+'</p>'
      +'<details class="fw reveal"><summary><span>'+esc(F.h)+'</span><span class="chev">▾</span></summary><div class="fw-body">'
      +F.items.map(it=>'<div class="fw-item"><h5>'+esc(it[0])+'</h5><div class="chips">'+it[1].map(c=>'<span class="chip">'+esc(c)+'</span>').join('')+'</div></div>').join('')
      +'<ul class="src-list">'+F.sources.map(s=>'<li><a href="'+esc(s[1])+'" target="_blank" rel="noopener">'+esc(s[0])+'</a></li>').join('')+'</ul>'
      +'</div></details></div></section>';
    // cta
    h+='<section class="cta"><div class="wrap"><h2 class="reveal">'+esc(D.cta.ha)+'</h2><p class="reveal">'+esc(D.cta.p)+'</p><div class="cta-row reveal"><button class="btn primary" data-share>'+esc(D.cta.share)+'</button><a class="btn" href="delais-droits-'+lang+'.pdf" download>'+esc(D.cta.print)+'</a></div></div></section>';
    // merci (mot de gratitude, clôture)
    if(D.merci){var M=D.merci;h+='<section class="merci" id="merci"><div class="wrap"><div class="inner reveal"><span class="tricolore"><i></i><i></i><i></i></span><div class="mtag">'+esc(M.tag)+'</div><h2>'+esc(M.h)+'</h2><p>'+esc(M.p1)+'</p><p>'+esc(M.p2)+'</p><p>'+esc(M.p3)+'</p><div class="sign">'+esc(M.sign)+'</div></div></div></section>';}
    // footer
    h+='<footer class="site"><div class="wrap fgrid"><div><div class="fbrand"><span class="tricolore"><i></i><i></i><i></i></span>'+esc(D.footer.brand)+'</div><p class="disclaimer">'+D.footer.disclaimer+'</p></div><div class="fmeta">'+D.footer.meta.map(m=>esc(m)).join('<br>')+'</div></div></footer>';

    $('#app').innerHTML=h; wire(D); observe();
  }
  function wire(D){
    document.querySelectorAll('[data-print]').forEach(b=>b.addEventListener('click',()=>window.print()));
    const sb=document.querySelector('[data-share]');
    if(sb)sb.addEventListener('click',async()=>{try{if(navigator.share){await navigator.share({title:document.title,url:location.href});}else{await navigator.clipboard.writeText(location.href);const t=sb.textContent;sb.textContent=D.ui.linkCopied;setTimeout(()=>sb.textContent=t,2000);}}catch(e){}});
  }
  function observe(){
    if(io)io.disconnect(); if(spy)spy.disconnect();
    io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}});},{threshold:0.1,rootMargin:'0px 0px -6% 0px'});
    document.querySelectorAll('.reveal').forEach((el,i)=>{el.style.transitionDelay=((i%5)*55)+'ms';io.observe(el);});
    const links=[...document.querySelectorAll('.nav a.link')];
    const secs=links.map(l=>document.querySelector(l.getAttribute('href'))).filter(Boolean);
    spy=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){const id='#'+e.target.id;links.forEach(l=>l.classList.toggle('active',l.getAttribute('href')===id));}});},{rootMargin:'-45% 0px -50% 0px'});
    secs.forEach(s=>spy.observe(s));
  }
  const pg=$('#progress');
  const onScroll=()=>{const e=document.documentElement;const m=e.scrollHeight-e.clientHeight;pg.style.width=(m>0?(e.scrollTop/m)*100:0)+'%';};
  document.addEventListener('scroll',onScroll,{passive:true});
  var params=new URLSearchParams(location.search);
  var forced=params.get('lang'); var pdfMode=params.get('pdf')==='1'; var showMode=params.get('show')==='1';
  let stored=null; try{stored=localStorage.getItem('lang');}catch(e){}
  let cur=(forced&&['fr','ru','uk','en'].includes(forced))?forced:(stored&&['fr','ru','uk','en'].includes(stored)?stored:'fr');
  function setLang(l){cur=l;try{localStorage.setItem('lang',l);}catch(e){}document.querySelectorAll('#langswitch button').forEach(b=>b.classList.toggle('active',b.dataset.lang===l));render(l);onScroll();}
  document.querySelectorAll('#langswitch button').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.lang)));
  setLang(cur);
  if(pdfMode||showMode){document.querySelectorAll('.reveal').forEach(function(e){e.classList.add('in');e.style.transition='none';e.style.opacity='1';e.style.transform='none';});}
  if(pdfMode){document.querySelectorAll('details').forEach(function(d){d.open=true;});}
  if(location.hash){try{var _t=document.querySelector(location.hash);if(_t){_t.scrollIntoView();window.scrollBy(0,-72);}}catch(e){}}
  let lastW=window.innerWidth,rt;
  window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(function(){if(Math.abs(window.innerWidth-lastW)>=30){lastW=window.innerWidth;render(cur);}},180);},{passive:true});
})();
</script>
